  function chips(name, items, value) {
    return `<div class="chips" role="group" data-chips="${name}">${items.map(it =>
      `<button type="button" class="chip ${String(it.v) === String(value) ? 'on' : ''}" data-v="${esc(it.v)}" aria-pressed="${String(it.v) === String(value)}">${esc(it.label)}</button>`).join('')}</div>`;
  }
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2200);
  }

  function fbState(extra = {}) {
    const st = set();
    return Object.assign({ frets: st.frets, lefty: st.lefty, latin: st.latin }, extra);
  }

  /** Monta marcas para uma demonstração de aula/explorador. */
  function buildDemo(cfg) {
    const st = set(), N = Math.max(st.frets, cfg.minFrets || 0);
    const root = typeof cfg.root === 'number' ? cfg.root : T.pcOf(cfg.root || 'C');
    let marks = [], caption = '', labels = cfg.labels || 'iv', flats = T.useFlats(root, 0), seq = null, frets = N;
    switch (cfg.kind) {
      case 'natural': {
        const nat = [0, 2, 4, 5, 7, 9, 11];
        (cfg.strings || [0]).forEach(s => { for (let f = 0; f <= 12; f++) {
          const pc = T.mod(T.pitch(s, f));
          if (nat.includes(pc)) marks.push(Object.assign(T.mark(s, f, 0), { role: (pc === 4 || pc === 5 || pc === 11 || pc === 0) ? 'pair' : 'n' }));
        } });
        labels = 'note'; flats = false;
        caption = 'Notas naturais. Em destaque os pares sem casa no meio: Mi–Fá e Si–Dó.';
        seq = 'run'; break;
      }
      case 'note': {
        marks = T.pcPositions(root, N).map(p => T.mark(p.s, p.f, root));
        labels = 'note';
        caption = `Todas as posições de ${T.rootName(root, st.latin)} até a casa ${N}.`;
        seq = 'run'; break;
      }
      case 'interval': {
        const rp = T.pitch(cfg.s, cfg.f);
        for (const iv of cfg.ivs) for (let s = cfg.s; s <= Math.min(5, cfg.s + 3); s++)
          for (let f = Math.max(0, cfg.f - 3); f <= cfg.f + 4; f++)
            if (T.pitch(s, f) === rp + iv && !(iv && s === cfg.s && f === cfg.f))
              marks.push(T.mark(s, f, root, iv === 12 ? { label: '8' } : {}));
        marks.push(T.mark(cfg.s, cfg.f, root));
        caption = `Tônica ${T.rootName(root, st.latin)} na ${T.stringLabel(cfg.s).toLowerCase()}, casa ${cfg.f}.`;
        seq = 'run'; break;
      }
      case 'power': {
        const s = cfg.s || 0;
        for (let f = T.mod(root - T.TUNING[s]); f + 2 <= N; f += 12)
          marks.push(T.mark(s, f, root), T.mark(s + 1, f + 2, root), T.mark(s + 2, f + 2, root, { label: '8' }));
        caption = `${T.rootName(root, st.latin)}5: tônica, 5ª e oitava.`;
        seq = 'strum'; break;
      }
      case 'scale': {
        const sc = T.SCALES[cfg.scale];
        flats = T.useFlats(root, sc.parent);
        const pos = cfg.pos ?? 0;
        marks = T.scaleMarks(cfg.scale, root, pos, N);
        const posName = pos < 0 ? 'braço inteiro' : (sc.sys === 'box' ? `caixa ${pos + 1}` : `posição ${pos + 1}`);
        caption = `${sc.name} de ${T.rootName(root, st.latin)}, ${posName}.`;
        seq = 'run'; break;
      }
      case 'triad': {
        const set3 = T.STRING_SETS.find(x => x.id === (cfg.set || '123'));
        const q = cfg.quality || 'maior';
        flats = T.useFlats(root, q === 'menor' ? 3 : 0);
        let vs = T.triads(root, q, set3.s, N);
        if (cfg.inv != null && cfg.inv >= 0) vs = vs.filter(v => v.inv === cfg.inv);
        vs.forEach(v => v.notes.forEach(n => marks.push(n)));
        seq = { groups: vs.map(v => v.notes) };
        caption = `${T.chordName(root, q, st.latin)} nas ${set3.label.toLowerCase()}` + (cfg.inv >= 0 ? `, ${T.INV_NAME[cfg.inv].toLowerCase()}.` : ', três inversões.');
        break;
      }
      case 'caged': {
        const q = cfg.quality || 'maior';
        flats = T.useFlats(root, q === 'menor' ? 3 : 0);
        const shapes = T.cagedAll(q, root, N);
        const chordIv = T.CHORDS[q].iv;
        if (cfg.shape === 'all' || !cfg.shape) {
          const seen = new Set();
          shapes.forEach(sh => sh.notes.forEach(n => { const k = n.s + ':' + n.f; if (!seen.has(k)) { seen.add(k); marks.push(n); } }));
          seq = { groups: shapes.map(sh => sh.notes) };
          caption = `${T.chordName(root, q, st.latin)} nas 5 formas: ` + shapes.map(sh => `${sh.k} (casa ${sh.lo})`).join(' → ');
        } else {
          const sh = shapes.find(x => x.k === cfg.shape);
          const layer = cfg.layer || 'chord';
          if (layer === 'chord') { marks = sh.notes; seq = { groups: [sh.notes] }; }
          else {
            const lo = Math.max(0, sh.lo - (layer === 'pent' ? 1 : 0)), hi = sh.hi + 1;
            const ivs = layer === 'arp' ? chordIv : (q === 'menor' ? T.SCALES.pent_menor.iv : T.SCALES.pent_maior.iv);
            const shapeKeys = new Set(sh.notes.map(n => n.s + ':' + n.f));
            marks = T.allNotes(ivs, root, hi, lo).map(m => (layer === 'pent' && !chordIv.includes(m.iv)) ? Object.assign(m, { small: true }) : m);
            sh.notes.forEach(n => { if (!marks.some(m => m.s === n.s && m.f === n.f)) marks.push(n); });
            marks.forEach(m => { if (layer !== 'chord' && !shapeKeys.has(m.s + ':' + m.f) && chordIv.includes(m.iv)) m.cls = 'ring'; });
            seq = 'run';
          }
          caption = `Forma ${sh.k} de ${T.chordName(root, q, st.latin)}, casas ${sh.lo} a ${sh.hi}.`;
        }
        break;
      }
      case 'lick': {
        const lk = lickById(cfg.lick);
        const p = TAB.parse(lk.src);
        const r = T.pcOf(lk.key);
        marks = TAB.marks(p, r);
        flats = T.useFlats(r, T.SCALES[lk.scale]?.parent || 0);
        const mx = Math.max(...marks.map(m => m.f));
        frets = Math.min(22, Math.max(N, mx + 1));
        caption = `Notas do lick “${lk.title}”. Use o player abaixo.`;
        break;
      }
    }
    return { marks, caption, labels, flats, seq, frets, root };
  }

  /** Toca o conteúdo de uma demonstração. */
  function playDemo(demo) {
    A.init(); S.practiced();
    const t0 = A.now() + 0.08;
    if (demo.seq && demo.seq.groups) {
      demo.seq.groups.forEach((g, i) => {
        const notes = g.slice().sort((a, b) => T.pitch(a.s, a.f) - T.pitch(b.s, b.f));
        notes.forEach((n, j) => A.play(T.pitch(n.s, n.f), t0 + i * 0.9 + j * 0.03, { dur: 0.85, vel: 0.6, string: n.s }));
      });
      return;
    }
    const uniq = new Map();
    demo.marks.filter(m => !m.dim).forEach(m => { const p = T.pitch(m.s, m.f); if (!uniq.has(p)) uniq.set(p, m); });
    const ps = [...uniq.keys()].sort((a, b) => a - b);
    if (demo.seq === 'strum') { ps.forEach((p, j) => A.play(p, t0 + j * 0.03, { dur: 1.4, vel: 0.65 })); return; }
    const run = ps.length > 1 ? ps.concat(ps.slice(0, -1).reverse()) : ps;
    run.slice(0, 64).forEach((p, i) => A.play(p, t0 + i * 0.2, { dur: 0.3, vel: 0.7, string: uniq.get(p).s }));
  }

  function legend(kind) {
    const items = [['r','Tônica'],['3','Terça'],['5','Quinta'],['7','Sétima'],['2','2ª / 9ª'],['4','4ª / 11ª'],['6','6ª / 13ª'],['b5','♭5 (blue note)']];
    const list = kind === 'natural' ? [['n','Nota natural'],['pair','Mi–Fá / Si–Dó']] : items;
    return `<div class="legend">${list.map(([r, l]) => `<span><i class="dot iv-${r}"></i>${l}</span>`).join('')}</div>`;
  }

  /** Painel de lick: tablatura + controles. Usa o braço `fb` informado. */
  function lickPanel(host, lick, fb, opts = {}) {
    const parsed = TAB.parse(lick.src);
    const root = T.pcOf(lick.key);
    const sc = T.SCALES[lick.scale];
    const level = '●'.repeat(lick.level) + '○'.repeat(5 - lick.level);
    host.innerHTML = `
      <div class="lick-head">
        <div><h3>${esc(lick.title)}</h3>
          <p class="meta"><span>${STYLES[lick.style]}</span><span>Tom: ${T.rootName(root, set().latin)}</span><span>${sc ? sc.name : ''}</span><span>${lick.bpm} BPM</span><span title="Dificuldade">${level}</span></p></div>
      </div>
      ${lick.chords ? `<p class="chords">${lick.chords.map((c, i) => `<span>${i + 1}</span>${esc(c)}`).join('')}</p>` : ''}
      <div class="tab-scroll" data-tab></div>
      <div class="ctrl-row">
        <button type="button" class="btn primary" data-act="play">▶ Tocar</button>
        <label class="field">Velocidade <select data-speed id="spd-${lick.id}${opts.idSuffix || ''}">
          ${[50, 60, 70, 80, 90, 100, 110, 120].map(p => `<option value="${p}" ${p === (opts.speed || 100) ? 'selected' : ''}>${p}% · ${Math.round(lick.bpm * p / 100)} BPM</option>`).join('')}
        </select></label>
        <label class="check"><input type="checkbox" data-loop id="loop-${lick.id}${opts.idSuffix || ''}"> Repetir</label>
        <label class="check"><input type="checkbox" data-click id="clk-${lick.id}${opts.idSuffix || ''}" ${opts.click ? 'checked' : ''}> Metrônomo</label>
      </div>
      <p class="tip"><b>${esc(lick.tech)}.</b> ${esc(lick.tip)}</p>`;
    const highlight = TAB.render(host.querySelector('[data-tab]'), parsed);
    const btn = host.querySelector('[data-act="play"]');
    const player = TAB.Player({
      onEvent(i) {
        highlight(i);
        const ev = parsed.events[i];
        fb && fb.setActive(ev ? ev.notes.filter(o => !o.dead).map(o => o.s + ':' + o.f) : []);
      },
      onEnd() { btn.textContent = '▶ Tocar'; btn.classList.remove('on'); fb && fb.setActive([]); },
    });
    btn.addEventListener('click', () => {
      if (player.playing) { player.stop(); btn.textContent = '▶ Tocar'; btn.classList.remove('on'); return; }
      opts.onPlay && opts.onPlay();
      const pct = +host.querySelector('[data-speed]').value;
      player.play(parsed, { bpm: lick.bpm * pct / 100, loop: host.querySelector('[data-loop]').checked, click: host.querySelector('[data-click]').checked });
      btn.textContent = '■ Parar'; btn.classList.add('on');
      S.practiced();
    });
    return { player, parsed, root, stop: () => { player.stop(); btn.textContent = '▶ Tocar'; btn.classList.remove('on'); } };
  }

  return { $, esc, set, rootOptions, chips, toast, fbState, buildDemo, playDemo, legend, lickPanel };
})();

/* ===== Trilha e aula ===== */
const V = {};
const ALL_LESSONS = () => MODULES.flatMap((m, mi) => m.lessons.map((l, li) => Object.assign({ mod: m, num: `${mi + 1}.${li + 1}` }, l)));

function linkHref(l) {
  if (l.to === 'quiz') return '#quiz-' + l.id;
  if (l.to === 'treino') return '#treino-' + l.id;
  if (l.to === 'jam') return '#jam-' + l.id;
  if (l.to === 'licks') return '#lick-' + l.id;
  return '#' + l.to;
}

V.trilha = (el) => {
  const st = S.get(), all = ALL_LESSONS();
  const doneN = all.filter(l => st.done[l.id]).length;
  const next = all.find(l => !st.done[l.id]);
  el.innerHTML = `
    <section class="hero-strip">
      <div>
        <p class="eyebrow">Sua trilha</p>
        <h1>Do mapa do braço ao primeiro solo</h1>
        <p class="lede">${all.length} aulas em ${MODULES.length} módulos. Cada aula tem o braço interativo, som, e um exercício para fazer com a guitarra na mão.</p>
      </div>
      <div class="stat-row">
        <div class="stat"><b>${doneN}<small>/${all.length}</small></b><span>aulas concluídas</span></div>
        <div class="stat"><b>${S.streak()}</b><span>${S.streak() === 1 ? 'dia seguido' : 'dias seguidos'}</span></div>
        ${next ? `<a class="btn primary big" href="#aula-${next.id}">${doneN ? 'Continuar' : 'Começar'}: ${U.esc(next.title)} →</a>` : `<span class="pill ok">Trilha completa</span>`}
      </div>
    </section>
    <div class="modules">
      ${MODULES.map((m, mi) => {
        const d = m.lessons.filter(l => st.done[l.id]).length;
        return `<section class="module">
          <header><span class="mod-n">Módulo ${mi + 1}</span><span class="tag">${m.tag}</span></header>
          <h2>${m.title}</h2>
          <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${m.lessons.length}" aria-valuenow="${d}"><i style="width:${d / m.lessons.length * 100}%"></i></div>
          <ol class="lessons">
            ${m.lessons.map((l, li) => `<li><a href="#aula-${l.id}" class="${st.done[l.id] ? 'done' : ''}">
              <span class="ln">${mi + 1}.${li + 1}</span><span class="lt">${l.title}</span><span class="lm">${l.min} min</span><span class="ck" aria-label="${st.done[l.id] ? 'concluída' : 'pendente'}"></span></a></li>`).join('')}
          </ol>
        </section>`;
      }).join('')}
    </div>`;
};

V.lesson = (el, id) => {
  const all = ALL_LESSONS();
  const idx = all.findIndex(l => l.id === id);
  if (idx < 0) { location.hash = '#trilha'; return; }
  const L = all[idx], prev = all[idx - 1], next = all[idx + 1];
  const demo0 = L.demo;
  let view = 0, root = demo0.root != null ? T.pcOf(demo0.root) : null;
  let labelsMode = demo0.labels || (['natural', 'note'].includes(demo0.kind) ? 'note' : 'iv');

  el.innerHTML = `
    <nav class="crumbs"><a href="#trilha">Trilha</a><span>›</span><span>Módulo ${MODULES.indexOf(L.mod) + 1} · ${L.mod.title}</span></nav>
    <article class="lesson">
      <header class="lesson-head">
        <p class="eyebrow">Aula ${L.num} · ${L.min} min</p>
        <h1>${L.title}</h1>
      </header>
      <div class="prose">${L.body}</div>
    </article>
    <section class="panel demo">
      <div class="ctrl-row" data-demo-ctrl></div>
      <div data-fb></div>
      <p class="caption" data-caption></p>
      <div data-legend></div>
    </section>
    ${L.lick && demo0.kind !== 'lick' ? `<section class="panel"><p class="eyebrow">Lick da aula</p><div data-lick></div></section>` : ''}
    ${demo0.kind === 'lick' ? `<section class="panel"><div data-lick></div></section>` : ''}
    <section class="practice">
      <h2>Pratique</h2>
      <ul class="tasks">${(L.tasks || []).map(t => `<li>${t}</li>`).join('')}</ul>
      ${L.links ? `<div class="links">${L.links.map(l => `<a class="btn" href="${linkHref(l)}">${l.label} →</a>`).join('')}</div>` : ''}
    </section>
    <footer class="lesson-foot">
      ${prev ? `<a class="btn ghost" href="#aula-${prev.id}">← ${U.esc(prev.title)}</a>` : '<span></span>'}
      <button type="button" class="btn ${S.get().done[L.id] ? 'ok' : 'primary'}" data-act="done">${S.get().done[L.id] ? '✓ Concluída' : 'Marcar como concluída'}</button>
      ${next ? `<a class="btn ghost" href="#aula-${next.id}">${U.esc(next.title)} →</a>` : '<span></span>'}
    </footer>`;

  const fb = FB.create(el.querySelector('[data-fb]'));
  let lp = null;
  const lickHost = el.querySelector('[data-lick]');

  function cfg() {
    const v = (demo0.views || [])[view] || {};
    const c = Object.assign({}, demo0, v);
    if (root != null && demo0.keySel) c.root = root;
    if (v.labels) labelsMode = v.labels;
    return c;
  }

  function draw() {
    const c = cfg();
    const d = U.buildDemo(c);
    const ctrl = el.querySelector('[data-demo-ctrl]');
    const views = demo0.views ? U.chips('view', demo0.views.map((v, i) => ({ v: i, label: v.label })), view) : '';
    const keySel = demo0.keySel ? `<label class="field">Tom <select data-root id="lesson-root">${U.rootOptions(T.pcOf(c.root))}</select></label>` : '';
    const lab = demo0.kind !== 'natural' && demo0.kind !== 'lick' ? U.chips('labels', [{ v: 'iv', label: 'Intervalos' }, { v: 'note', label: 'Notas' }], labelsMode) : '';
    ctrl.innerHTML = `${views}<div class="ctrl-right">${keySel}${lab}${demo0.kind !== 'lick' ? '<button type="button" class="btn" data-act="hear">♪ Ouvir</button>' : ''}</div>`;
    fb.set(U.fbState({ marks: d.marks, labels: demo0.kind === 'natural' ? 'note' : labelsMode, flats: d.flats, frets: d.frets,
      onPick: (s, f) => { A.play(T.pitch(s, f), null, { dur: 1.2, string: s }); fb.setActive([s + ':' + f]); } }));
    el.querySelector('[data-caption]').textContent = d.caption;
    el.querySelector('[data-legend]').innerHTML = U.legend(demo0.kind);
    draw.demo = d;
  }
  draw();

  if (lickHost) {
    const lk = lickById(L.lick || demo0.lick);
    lp = U.lickPanel(lickHost, lk, fb, {
      idSuffix: '-aula',
      onPlay() {
        if (demo0.kind !== 'lick') {
          const d = U.buildDemo({ kind: 'lick', lick: lk.id });
          fb.set({ marks: d.marks, labels: labelsMode, flats: d.flats, frets: d.frets });
        }
      },
    });
  }

  el.addEventListener('click', e => {
    const chip = e.target.closest('[data-chips] .chip');
    if (chip) {
      const g = chip.parentElement.dataset.chips;
      if (g === 'view') view = +chip.dataset.v;
      if (g === 'labels') labelsMode = chip.dataset.v;
      draw(); return;
    }
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'hear') U.playDemo(draw.demo);
    if (act === 'done') {
      const was = !!S.get().done[L.id];
      S.update(s => { if (was) delete s.done[L.id]; else s.done[L.id] = S.today(); });
      S.practiced();
      const b = e.target.closest('[data-act]');
      b.className = 'btn ' + (was ? 'primary' : 'ok');
      b.textContent = was ? 'Marcar como concluída' : '✓ Concluída';
      if (!was) U.toast(next ? `Aula concluída. Próxima: ${next.title}` : 'Trilha completa!');
    }
  });
  el.addEventListener('change', e => {
    if (e.target.matches('[data-root]')) { root = +e.target.value; draw(); }
  });
  return () => { lp && lp.stop(); A.stopAll(); };
};

/* ===== Explorador do braço ===== */
const EXP = { type:'scale', root:9, scale:'pent_menor', pos:0, quality:'maior', set:'123', inv:-1, shape:'all', layer:'chord', chord:'maior', labels:'iv' };

V.braco = (el) => {
  el.innerHTML = `
    <header class="page-head"><p class="eyebrow">Explorador</p><h1>O braço inteiro, em qualquer tom</h1></header>
    <section class="panel">
      <div class="explorer-ctrl" data-ctrl></div>
      <div data-fb></div>
      <p class="caption" data-caption></p>
      <div data-legend></div>
    </section>
    <section class="info-grid" data-info></section>`;
  const fb = FB.create(el.querySelector('[data-fb]'));

  function cfg() {
    const e = EXP;
    if (e.type === 'scale') return { kind:'scale', root:e.root, scale:e.scale, pos:e.pos };
    if (e.type === 'triad') return { kind:'triad', root:e.root, quality:e.quality, set:e.set, inv:e.inv };
    if (e.type === 'caged') return { kind:'caged', root:e.root, quality:e.quality === 'menor' ? 'menor' : 'maior', shape:e.shape, layer:e.layer };
    if (e.type === 'note') return { kind:'note', root:e.root };
    return { kind:'chord', root:e.root, chord:e.chord };
  }

  function controls() {
    const e = EXP, sc = T.SCALES[e.scale];
    const rows = [];
    rows.push(`<div class="ctrl-row"><label class="field">Tom <select data-k="root" id="exp-root">${U.rootOptions(e.root)}</select></label>
      ${U.chips('type', [{ v:'scale', label:'Escalas' }, { v:'triad', label:'Tríades' }, { v:'caged', label:'CAGED' }, { v:'chord', label:'Arpejos' }, { v:'note', label:'Uma nota' }], e.type)}</div>`);
    if (e.type === 'scale') {
      const n = T.positionsCount(e.scale);
      rows.push(`<div class="ctrl-row"><label class="field">Escala <select data-k="scale" id="exp-scale">${Object.entries(T.SCALES).map(([k, s]) => `<option value="${k}" ${k === e.scale ? 'selected' : ''}>${s.name}</option>`).join('')}</select></label>
        ${U.chips('pos', [{ v:-1, label:'Braço' }].concat(Array.from({ length:n }, (_, i) => ({ v:i, label:(sc.sys === 'box' ? 'Caixa ' : 'Pos. ') + (i + 1) }))), e.pos)}</div>`);
    }
    if (e.type === 'triad') {
      rows.push(`<div class="ctrl-row">${U.chips('quality', ['maior', 'menor', 'dim', 'aum'].map(q => ({ v:q, label:T.CHORDS[q].name })), e.quality)}
        ${U.chips('set', T.STRING_SETS.map(s => ({ v:s.id, label:s.label })), e.set)}
        ${U.chips('inv', [{ v:-1, label:'Todas' }, { v:0, label:'Fundamental' }, { v:1, label:'1ª inv.' }, { v:2, label:'2ª inv.' }], e.inv)}</div>`);
    }
    if (e.type === 'caged') {
      rows.push(`<div class="ctrl-row">${U.chips('quality', [{ v:'maior', label:'Maior' }, { v:'menor', label:'Menor' }], e.quality === 'menor' ? 'menor' : 'maior')}
        ${U.chips('shape', [{ v:'all', label:'Todas' }, ...['C', 'A', 'G', 'E', 'D'].map(k => ({ v:k, label:'Forma ' + k }))], e.shape)}
        ${e.shape !== 'all' ? U.chips('layer', [{ v:'chord', label:'Acorde' }, { v:'arp', label:'Arpejo' }, { v:'pent', label:'Pentatônica' }], e.layer) : ''}</div>`);
    }
    if (e.type === 'chord') {
      rows.push(`<div class="ctrl-row"><label class="field">Acorde <select data-k="chord" id="exp-chord">${Object.entries(T.CHORDS).map(([k, c]) => `<option value="${k}" ${k === e.chord ? 'selected' : ''}>${c.name}</option>`).join('')}</select></label></div>`);
    }
    rows.push(`<div class="ctrl-row">${U.chips('labels', [{ v:'iv', label:'Intervalos' }, { v:'note', label:'Notas' }, { v:'none', label:'Sem rótulo' }], e.labels)}
      <button type="button" class="btn" data-act="hear">♪ Ouvir</button></div>`);
    el.querySelector('[data-ctrl]').innerHTML = rows.join('');
  }

  function info(c, d) {
    const st = U.set();
    let ivs = [], title = '';
    if (c.kind === 'scale') { ivs = T.SCALES[c.scale].iv; title = T.SCALES[c.scale].name; }
    else if (c.kind === 'triad' || c.kind === 'caged') { ivs = T.CHORDS[c.quality].iv; title = 'Tríade ' + T.CHORDS[c.quality].name.toLowerCase(); }
    else if (c.kind === 'chord') { ivs = T.CHORDS[c.chord].iv; title = 'Arpejo ' + T.CHORDS[c.chord].name.toLowerCase(); }
    else { ivs = [0]; title = 'Nota'; }
    const cells = ivs.map(iv => `<div class="deg iv-${T.IV_ROLE[iv]}"><b>${T.noteName(c.root + iv, d.flats, st.latin)}</b><span>${T.ivLabel(iv)}</span></div>`).join('');
    el.querySelector('[data-info]').innerHTML = `
      <div class="panel"><p class="eyebrow">${title} de ${T.rootName(c.root, st.latin)}</p><div class="degrees">${cells}</div>
      <p class="small">Fórmula: ${ivs.map(T.ivLabel).join(' – ')}</p></div>
      <div class="panel"><p class="eyebrow">Como estudar</p><p class="small">${tip(c)}</p></div>`;
  }

  function tip(c) {
    if (c.kind === 'scale' && c.pos < 0) return 'Com o braço inteiro aceso, escolha uma corda e toque a escala só nela, de uma ponta à outra. Depois volte para as posições.';
    if (c.kind === 'scale') return 'Toque a posição subindo e descendo com metrônomo. Depois esconda os rótulos e tente tocar só as tônicas.';
    if (c.kind === 'triad') return 'Escolha “Todas” e toque as inversões em sequência pelo braço. Depois troque só a qualidade (maior/menor) e veja qual nota anda.';
    if (c.kind === 'caged') return 'Passe pelas formas na ordem em que aparecem no braço. Em cada forma, ache a tônica nas cordas 6, 5 e 4.';
    if (c.kind === 'chord') return 'Arpejos de 4 notas (7, 7M, m7) são o próximo passo depois das tríades: eles soam “jazz” e “soul” no solo.';
    return 'Use os desenhos de oitava para ligar as posições da nota. Esconda os rótulos e tente prever onde está a próxima.';
  }

  function draw() {
    controls();
    const c = cfg();
    let d;
    if (c.kind === 'chord') {
      const ch = T.CHORDS[c.chord];
      d = { marks: T.allNotes(ch.iv, c.root, U.set().frets), flats: T.useFlats(c.root, ch.iv.includes(3) ? 3 : 0), caption: `Arpejo de ${T.chordName(c.root, c.chord, U.set().latin)} no braço inteiro.`, seq: 'run' };
    } else d = U.buildDemo(c);
    fb.set(U.fbState({ marks: d.marks, labels: EXP.labels, flats: d.flats,
      onPick: (s, f) => { A.play(T.pitch(s, f), null, { dur: 1.2, string: s }); fb.setActive([s + ':' + f]); } }));
    el.querySelector('[data-caption]').textContent = d.caption;
    el.querySelector('[data-legend]').innerHTML = U.legend(c.kind);
    info(c, d);
    draw.d = d;
  }
  draw();

  el.addEventListener('click', e => {
    const chip = e.target.closest('[data-chips] .chip');
    if (chip) {
      const g = chip.parentElement.dataset.chips, v = chip.dataset.v;
      if (['pos', 'inv'].includes(g)) EXP[g] = +v; else EXP[g] = v;
      if (g === 'type' && v === 'caged' && !['maior', 'menor'].includes(EXP.quality)) EXP.quality = 'maior';
      draw(); return;
    }
    if (e.target.closest('[data-act="hear"]')) U.playDemo(draw.d);
  });
  el.addEventListener('change', e => {
    const k = e.target.dataset.k;
    if (!k) return;
    EXP[k] = k === 'root' ? +e.target.value : e.target.value;
    if (k === 'scale') EXP.pos = Math.min(EXP.pos, T.positionsCount(EXP.scale) - 1);
    draw();
  });
  return () => A.stopAll();
};

/* ===== Treino: metrônomo e velocidade progressiva ===== */
const MET = { bpm: 80, beats: 4, sub: 1 };
const SPEED = { id: 'ex-pent', start: 60, target: 100, step: 5, reps: 2, listen: true };

function treinoTabs(active) {
  return `<header class="page-head"><p class="eyebrow">Treino</p><h1>Tempo, velocidade e improviso</h1></header>
    <nav class="subtabs">${[['treino', 'Metrônomo'], ['treino-' + SPEED.id, 'Velocidade progressiva'], ['jam', 'Jam (bases)']].map(([h, l], i) =>
      `<a href="#${h}" class="${['met', 'speed', 'jam'][i] === active ? 'on' : ''}">${l}</a>`).join('')}</nav>`;
}

V.metronomo = (el) => {
  el.innerHTML = treinoTabs('met') + `
    <section class="panel met">
      <div class="met-bpm">
        <button type="button" class="btn round" data-d="-5" aria-label="Menos 5 BPM">−5</button>
        <button type="button" class="btn round" data-d="-1" aria-label="Menos 1 BPM">−1</button>
        <div class="bpm-read"><b data-bpm>${MET.bpm}</b><span>BPM</span></div>
        <button type="button" class="btn round" data-d="1" aria-label="Mais 1 BPM">+1</button>
        <button type="button" class="btn round" data-d="5" aria-label="Mais 5 BPM">+5</button>
      </div>
      <input type="range" min="30" max="240" value="${MET.bpm}" data-range id="met-range" aria-label="Andamento">
      <div class="beats" data-beats></div>
      <div class="ctrl-row center">
        ${U.chips('beats', [2, 3, 4, 6].map(b => ({ v: b, label: b + ' tempos' })), MET.beats)}
        ${U.chips('sub', [{ v: 1, label: '♩' }, { v: 2, label: '♫ colcheia' }, { v: 3, label: 'tercina' }, { v: 4, label: 'semicolcheia' }], MET.sub)}
      </div>
      <div class="ctrl-row center">
        <button type="button" class="btn primary big" data-act="go">▶ Iniciar</button>
        <button type="button" class="btn" data-act="tap">Bater o tempo</button>
      </div>
    </section>`;
  const beatsEl = el.querySelector('[data-beats]');
  const drawBeats = () => { beatsEl.innerHTML = Array.from({ length: MET.beats }, (_, i) => `<i class="${i === 0 ? 'acc' : ''}"></i>`).join(''); };
  drawBeats();
  const setBpm = b => { MET.bpm = Math.max(30, Math.min(240, b)); el.querySelector('[data-bpm]').textContent = MET.bpm; el.querySelector('[data-range]').value = MET.bpm; };
  // 12 pulsos por tempo cobrem colcheia, tercina e semicolcheia sem reiniciar o relógio
  const clock = A.Clock(() => MET.bpm, 12, (i, t) => {
    const sub = i % 12, beat = Math.floor(i / 12) % MET.beats;
    if (sub === 0) {
      A.click(t, beat === 0);
      setTimeout(() => { [...beatsEl.children].forEach((c, k) => c.classList.toggle('on', k === beat)); }, Math.max(0, (t - A.ctx.currentTime) * 1000));
    } else if (MET.sub > 1 && sub % (12 / MET.sub) === 0) A.tick(t);
  });
  let taps = [];
  el.addEventListener('click', e => {
    const d = e.target.closest('[data-d]'); if (d) { setBpm(MET.bpm + +d.dataset.d); return; }
    const chip = e.target.closest('[data-chips] .chip');
    if (chip) {
      MET[chip.parentElement.dataset.chips] = +chip.dataset.v;
      chip.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === chip));
      drawBeats();
      return;
    }
    const btn = e.target.closest('[data-act]'), act = btn?.dataset.act;
    if (act === 'go') {
      if (clock.running) { clock.stop(); btn.textContent = '▶ Iniciar'; beatsEl.querySelectorAll('.on').forEach(c => c.classList.remove('on')); }
      else { clock.start(); btn.textContent = '■ Parar'; S.practiced(); }
    }
    if (act === 'tap') {
      const n = performance.now(); taps = taps.filter(x => n - x < 2500); taps.push(n);
      if (taps.length > 1) setBpm(Math.round(60000 / ((taps[taps.length - 1] - taps[0]) / (taps.length - 1))));
    }
  });
  el.addEventListener('input', e => { if (e.target.matches('[data-range]')) setBpm(+e.target.value); });
  return () => clock.stop();
};

V.speed = (el, id) => {
  if (id && lickById(id)) SPEED.id = id;
  const lick = lickById(SPEED.id);
  const rec = S.get().bpm[lick.id];
  if (SPEED.lastId !== lick.id) { SPEED.start = Math.round(lick.bpm * 0.7); SPEED.target = rec ? rec + 10 : lick.bpm; SPEED.lastId = lick.id; }
  const groups = Object.entries(STYLES).map(([k, n]) => `<optgroup label="${n}">${LICKS.filter(l => l.style === k).map(l => `<option value="${l.id}" ${l.id === lick.id ? 'selected' : ''}>${U.esc(l.title)}</option>`).join('')}</optgroup>`).join('');
  el.innerHTML = treinoTabs('speed') + `
    <section class="panel">
      <div class="ctrl-row"><label class="field grow">Exercício <select data-k="id" id="spd-ex">${groups}</select></label>
        <span class="pill">${rec ? `Recorde: ${rec} BPM` : 'Sem recorde ainda'}</span></div>
      <div class="ctrl-row">
        <label class="field">Começar em <input type="number" min="30" max="260" value="${SPEED.start}" data-k="start" id="spd-start"> BPM</label>
        <label class="field">Meta <input type="number" min="30" max="300" value="${SPEED.target}" data-k="target" id="spd-target"> BPM</label>
        <label class="field">Subir <input type="number" min="1" max="20" value="${SPEED.step}" data-k="step" id="spd-step"> BPM</label>
        <label class="field">a cada <input type="number" min="1" max="8" value="${SPEED.reps}" data-k="reps" id="spd-reps"> repetições</label>
        <label class="check"><input type="checkbox" data-k="listen" id="spd-listen" ${SPEED.listen ? 'checked' : ''}> Tocar junto</label>
      </div>
      <div class="speed-read"><div><b data-cur>${SPEED.start}</b><span>BPM agora</span></div><div><b data-rep>0</b><span>repetição</span></div>
        <div class="bar wide"><i data-prog style="width:0%"></i></div></div>
      <div class="tab-scroll" data-tab></div>
      <div class="ctrl-row">
        <button type="button" class="btn primary big" data-act="go">▶ Iniciar treino</button>
        <button type="button" class="btn ok" data-act="save">✓ Consegui limpo neste BPM</button>
      </div>
      <p class="tip">${U.esc(lick.tip)} Regra de ouro: só suba quando tocar 4 vezes seguidas sem erro. Se travar, volte 10 BPM.</p>
    </section>`;
  const parsed = TAB.parse(lick.src);
  const hl = TAB.render(el.querySelector('[data-tab]'), parsed);
  const beats = Math.ceil(parsed.beats);
  let bpm = SPEED.start, rep = 0, beatInRep = 0, repStart = 0, repBpm = bpm, raf = null;
  const curEl = el.querySelector('[data-cur]'), repEl = el.querySelector('[data-rep]'), progEl = el.querySelector('[data-prog]');
  const clock = A.Clock(() => bpm, 1, (i, t) => {
    if (beatInRep === 0) {
      repStart = t; repBpm = bpm;
      if (SPEED.listen) TAB.scheduleNotes(parsed, t, bpm);
      const shown = bpm, r = rep + 1;
      setTimeout(() => { curEl.textContent = shown; repEl.textContent = r; progEl.style.width = Math.min(100, (shown - SPEED.start) / Math.max(1, SPEED.target - SPEED.start) * 100) + '%'; }, Math.max(0, (t - A.ctx.currentTime) * 1000));
    }
    A.click(t, beatInRep % 4 === 0);
    beatInRep++;
    if (beatInRep >= beats) {
      beatInRep = 0; rep++;
      if (rep % SPEED.reps === 0) bpm = Math.min(SPEED.target, bpm + SPEED.step);
    }
  });
  function anim() {
    const now = A.ctx.currentTime;
    if (now >= repStart) {
      const b = (now - repStart) * repBpm / 60;
      let idx = -1; parsed.events.forEach((e, i) => { if (e.beat <= b + 1e-6) idx = i; });
      hl(idx);
    }
    raf = requestAnimationFrame(anim);
  }
  function stop() { clock.stop(); cancelAnimationFrame(raf); A.stopAll(); hl(-1); const b = el.querySelector('[data-act="go"]'); if (b) b.textContent = '▶ Iniciar treino'; }

  el.addEventListener('click', e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'go') {
      if (clock.running) { stop(); return; }
      bpm = SPEED.start; rep = 0; beatInRep = 0;
      A.init(); repStart = Infinity; clock.start(); raf = requestAnimationFrame(anim);
      e.target.textContent = '■ Parar'; S.practiced();
    }
    if (act === 'save') {
      const val = clock.running ? repBpm : +curEl.textContent;
      S.update(s => { s.bpm[lick.id] = Math.max(s.bpm[lick.id] || 0, val); });
      S.practiced();
      U.toast(`Recorde salvo: ${Math.max(val, rec || 0)} BPM`);
      el.querySelector('.pill').textContent = `Recorde: ${S.get().bpm[lick.id]} BPM`;
    }
  });
  el.addEventListener('change', e => {
    const k = e.target.dataset.k; if (!k) return;
    if (k === 'id') { stop(); location.hash = '#treino-' + e.target.value; return; }
    if (k === 'listen') SPEED.listen = e.target.checked;
    else SPEED[k] = Math.max(1, +e.target.value || 1);
    if (k === 'start' && !clock.running) curEl.textContent = SPEED.start;
  });
  return stop;
};

/* ===== Jam: bases para improvisar ===== */
const JAMS = [
  { id:'blues', title:'Blues em Lá (12 compassos)', key:'A', bpm:88, feel:'shuffle', bass:'boogie',
    chords:['A7','D7','A7','A7','D7','D7','A7','A7','E7','D7','A7','E7'], scales:['blues','pent_menor','mixolidio'] },
  { id:'pop', title:'Louvor / pop: G–D–Em–C', key:'G', bpm:76, feel:'straight', bass:'root',
    chords:['G','D','Em','C'], scales:['pent_maior','maior'] },
  { id:'rock', title:'Rock menor: Am–G–F–G', key:'A', bpm:100, feel:'straight', bass:'eighths',
    chords:['Am','G','F','G'], scales:['pent_menor','menor','blues'] },
  { id:'metal', title:'Metal: Em–C–D–B', key:'E', bpm:132, feel:'straight', bass:'eighths',
    chords:['Em','C','D','B'], scales:['menor_harm','menor','pent_menor'] },
  { id:'dorico', title:'Modal dórico: Am7–D', key:'A', bpm:96, feel:'straight', bass:'root',
    chords:['Am7','Am7','D','D'], scales:['dorico','pent_menor'] },
];
const JAM = { id:'blues', scale:null, bpm:null, drums:true, bass:true, comp:true, labels:'iv' };

function parseChord(name) {
  const m = name.match(/^([A-G][b#]?)(.*)$/);
  const q = { '':'maior', 'm':'menor', '7':'dom7', 'm7':'m7', '7M':'maj7' }[m[2]] || 'maior';
  return { root: T.pcOf(m[1]), q, name };
}

V.jam = (el, id) => {
  if (id && JAMS.some(j => j.id === id)) { if (JAM.id !== id) { JAM.scale = null; JAM.bpm = null; } JAM.id = id; }
  const jam = JAMS.find(j => j.id === JAM.id);
  if (!JAM.scale || !jam.scales.includes(JAM.scale)) JAM.scale = jam.scales[0];
  if (!JAM.bpm) JAM.bpm = jam.bpm;
  const chords = jam.chords.map(parseChord);
  const keyPc = T.pcOf(jam.key);

  el.innerHTML = treinoTabs('jam') + `
    <section class="panel">
      <div class="ctrl-row">${U.chips('jam', JAMS.map(j => ({ v:j.id, label:j.title })), jam.id)}</div>
      <div class="ctrl-row">
        <label class="field">Escala <select data-k="scale" id="jam-scale">${jam.scales.map(s => `<option value="${s}" ${s === JAM.scale ? 'selected' : ''}>${T.SCALES[s].name} de ${T.rootName(keyPc, U.set().latin)}</option>`).join('')}</select></label>
        <label class="field">Andamento <input type="range" min="50" max="180" value="${JAM.bpm}" data-k="bpm" id="jam-bpm"> <b data-bpm>${JAM.bpm}</b> BPM</label>
        <label class="check"><input type="checkbox" data-k="drums" id="jam-drums" ${JAM.drums ? 'checked' : ''}> Bateria</label>
        <label class="check"><input type="checkbox" data-k="bass" id="jam-bass" ${JAM.bass ? 'checked' : ''}> Baixo</label>
        <label class="check"><input type="checkbox" data-k="comp" id="jam-comp" ${JAM.comp ? 'checked' : ''}> Acordes</label>
      </div>
      <div class="jam-now">
        <button type="button" class="btn primary big" data-act="go">▶ Tocar base</button>
        <div class="now"><span>Agora</span><b data-now>${chords[0].name}</b></div>
        <div class="now dim"><span>Próximo</span><b data-next>${chords[1 % chords.length].name}</b></div>
        <ol class="bars" data-bars>${chords.map((c, i) => `<li data-i="${i}">${c.name}</li>`).join('')}</ol>
      </div>
      <div data-fb></div>
      <p class="caption">Notas grandes: notas do acorde atual (rótulos em relação ao acorde). Pontos pequenos: o resto da escala. Mire nas notas grandes quando o acorde mudar.</p>
    </section>`;
  const fb = FB.create(el.querySelector('[data-fb]'));
  const sc = T.SCALES[JAM.scale];
  const flats = T.useFlats(keyPc, sc.parent);

  function showChord(ci) {
    const c = chords[ci], civ = T.CHORDS[c.q].iv.map(i => T.mod(c.root + i));
    const scalePcs = sc.iv.map(i => T.mod(keyPc + i));
    const N = U.set().frets, marks = [];
    for (let s = 0; s < 6; s++) for (let f = 0; f <= N; f++) {
      const pc = T.mod(T.pitch(s, f));
      if (civ.includes(pc)) marks.push(T.mark(s, f, c.root));
      else if (scalePcs.includes(pc)) marks.push(Object.assign(T.mark(s, f, keyPc), { small: true, role: 'n', label: '' }));
    }
    fb.set(U.fbState({ marks, labels: JAM.labels, flats,
      onPick: (s, f) => { A.play(T.pitch(s, f), null, { dur: 1.2, string: s }); fb.setActive([s + ':' + f]); } }));
    el.querySelector('[data-now]').textContent = c.name;
    el.querySelector('[data-next]').textContent = chords[(ci + 1) % chords.length].name;
    el.querySelectorAll('[data-bars] li').forEach((li, i) => li.classList.toggle('on', i === ci));
  }
  showChord(0);

  const bassMidi = pc => 28 + T.mod(pc - 4);
  const BOOGIE = [0, 4, 7, 9, 10, 9, 7, 4];
  const clock = A.Clock(() => JAM.bpm, 2, (i, t) => {
    const spb = 60 / JAM.bpm;
    const bar = Math.floor(i / 8) % chords.length, pos = i % 8, beat = pos >> 1, off = pos & 1;
    const c = chords[bar];
    const tt = off && jam.feel === 'shuffle' ? t + spb / 6 : t;
    if (pos === 0) setTimeout(() => showChord(bar), Math.max(0, (t - A.ctx.currentTime) * 1000));
    if (JAM.drums) {
      if (!off && (beat === 0 || beat === 2)) A.drum('kick', tt);
      if (jam.id === 'metal' && off) A.drum('kick', tt, 0.7);
      if (!off && (beat === 1 || beat === 3)) A.drum('snare', tt);
      A.drum('hat', tt, off ? 0.6 : 1);
    }
    if (JAM.bass) {
      const r = bassMidi(c.root);
      if (jam.bass === 'boogie') A.bass(r + (c.q === 'menor' && BOOGIE[pos] === 4 ? 3 : BOOGIE[pos]), tt, spb * 0.45);
      else if (jam.bass === 'eighths') A.bass(r, tt, spb * 0.42);
      else if (!off && beat !== 3) A.bass(r, tt, spb * 0.9);
      else if (!off) A.bass(r + 7, tt, spb * 0.9);
    }
    if (JAM.comp) {
      const ivs = T.CHORDS[c.q].iv;
      const voice = ivs.map(iv => 52 + T.mod(c.root + iv - 4)).sort((a, b) => a - b);
      const strum = (vel, dur) => voice.forEach((m, k) => A.play(m, tt + k * 0.018, { dur, vel, bus: 'back' }));
      if (jam.feel === 'shuffle') { if (off === 0 && (beat === 1 || beat === 3)) strum(0.35, spb * 0.5); }
      else if (jam.id === 'metal') { if (pos === 0) strum(0.4, spb * 3.6); }
      else if (pos === 0 || pos === 3 || pos === 6) strum(pos === 0 ? 0.42 : 0.3, spb * (pos === 0 ? 1.4 : 1));
    }
  });

  el.addEventListener('click', e => {
    const chip = e.target.closest('[data-chips="jam"] .chip');
    if (chip) { clock.stop(); A.stopAll(); location.hash = '#jam-' + chip.dataset.v; return; }
    const btn = e.target.closest('[data-act="go"]');
    if (btn) {
      if (clock.running) { clock.stop(); A.stopAll(); btn.textContent = '▶ Tocar base'; showChord(0); }
      else { clock.start(); btn.textContent = '■ Parar'; S.practiced(); }
    }
  });
  el.addEventListener('input', e => {
    if (e.target.dataset.k === 'bpm') { JAM.bpm = +e.target.value; el.querySelector('[data-bpm]').textContent = JAM.bpm; }
  });
  el.addEventListener('change', e => {
    const k = e.target.dataset.k;
    if (k === 'scale') { JAM.scale = e.target.value; const running = clock.running; APP.rerender(); if (running) U.toast('Escala trocada. Toque a base de novo.'); }
    if (['drums', 'bass', 'comp'].includes(k)) JAM[k] = e.target.checked;
  });
  return () => { clock.stop(); A.stopAll(); };
};

/* ===== Quizzes ===== */
const QUIZZES = [
  { id:'qual-nota', title:'Qual é a nota?', desc:'Uma casa acende no braço. Escolha o nome da nota.', scope:true },
  { id:'ache-nota', title:'Ache a nota', desc:'Clique na casa da nota pedida, na corda indicada.', scope:true },
  { id:'intervalo', title:'Que intervalo é esse?', desc:'Tônica em vermelho e outra nota. Diga a distância entre elas.' },
  { id:'triade', title:'Tríade e inversão', desc:'Três notas acesas. É maior ou menor? Qual inversão?' },
  { id:'ouvido', title:'Treino de ouvido', desc:'Ouça duas notas e diga o intervalo, sem olhar o braço.' },
];
const QZ = { scope:'65', rounds:10 };
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];

V.quiz = (el, id) => {
  const q = QUIZZES.find(x => x.id === id);
  if (!q) return quizHome(el);
  return quizRun(el, q);
};

function quizHome(el) {
  const best = S.get().quiz;
  el.innerHTML = `<header class="page-head"><p class="eyebrow">Quiz</p><h1>Decorar o braço jogando</h1>
    <p class="lede">Rodadas de ${QZ.rounds} perguntas. Seu melhor resultado fica salvo.</p></header>
    <div class="quiz-grid">${QUIZZES.map(z => `<a class="quiz-card" href="#quiz-${z.id}">
      <h2>${z.title}</h2><p>${z.desc}</p>
      <span class="pill ${best[z.id] ? (best[z.id].best >= 90 ? 'ok' : '') : 'muted'}">${best[z.id] ? `Melhor: ${best[z.id].best}% · ${best[z.id].time}s` : 'Ainda não jogado'}</span></a>`).join('')}</div>`;
}

function quizRun(el, q) {
  let round = 0, score = 0, t0 = performance.now(), cur = null, locked = false, timer = null;
  el.innerHTML = `<nav class="crumbs"><a href="#quiz">Quiz</a><span>›</span><span>${q.title}</span></nav>
    <section class="panel quiz">
      <div class="quiz-top"><h1>${q.title}</h1>
        ${q.scope ? U.chips('scope', [{ v:'65', label:'Cordas 6 e 5' }, { v:'all', label:'Todas as cordas' }], QZ.scope) : ''}
        <span class="pill" data-count></span></div>
      <p class="prompt" data-prompt></p>
      <div data-fb></div>
      <div class="answers" data-ans></div>
      <p class="feedback" data-fbk aria-live="polite"></p>
    </section>`;
  const fb = FB.create(el.querySelector('[data-fb]'));
  const promptEl = el.querySelector('[data-prompt]'), ansEl = el.querySelector('[data-ans]'), fbk = el.querySelector('[data-fbk]');
  const latin = () => U.set().latin;
  const N = 12;
  const strings = () => QZ.scope === '65' ? [0, 1] : [0, 1, 2, 3, 4, 5];
  const noteButtons = () => T.ROOTS.map((r, i) => `<button type="button" class="btn ans" data-a="${i}">${T.noteName(i, false, latin())}${[1, 3, 6, 8, 10].includes(i) ? ' / ' + T.noteName(i, true, latin()) : ''}</button>`).join('');

  const GEN = {
    'qual-nota'() {
      const s = pick(strings()), f = rnd(N + 1), pc = T.mod(T.pitch(s, f));
      fb.set(U.fbState({ frets: N, marks: [Object.assign(T.mark(s, f, pc), { role:'q', label:'?' })], onPick: null }));
      promptEl.textContent = `Que nota é esta? (${T.stringLabel(s)}, casa ${f})`;
      ansEl.innerHTML = noteButtons();
      return { answer: pc, reveal: () => fb.set({ marks: [Object.assign(T.mark(s, f, pc), { role:'r' })], labels:'note' }) };
    },
    'ache-nota'() {
      const s = pick(strings()), pc = rnd(12);
      fb.set(U.fbState({ frets: N, marks: [], labels:'note', onPick: (ss, ff) => answer(ss === s && T.mod(T.pitch(ss, ff)) === pc, { s: ss, f: ff }) }));
      promptEl.innerHTML = `Ache <b>${T.noteName(pc, false, latin())}${[1, 3, 6, 8, 10].includes(pc) ? ' / ' + T.noteName(pc, true, latin()) : ''}</b> na <b>${T.stringLabel(s).toLowerCase()}</b>.`;
      ansEl.innerHTML = '';
      return { custom: true, reveal: (click) => {
        const marks = [];
        for (let f = 0; f <= N; f++) if (T.mod(T.pitch(s, f)) === pc) marks.push(Object.assign(T.mark(s, f, pc), { role:'r' }));
        if (click && !marks.some(m => m.s === click.s && m.f === click.f)) marks.push(Object.assign(T.mark(click.s, click.f, pc), { role:'bad' }));
        fb.set({ marks, labels:'note', onPick: null });
      } };
    },
    'intervalo'() {
      const ivs = [2, 3, 4, 5, 7, 9, 10, 11, 12];
      for (;;) {
        const s = rnd(4), f = 1 + rnd(9), iv = pick(ivs), rp = T.pitch(s, f), opts = [];
        for (let ss = s; ss <= Math.min(5, s + 2); ss++) for (let ff = Math.max(0, f - 3); ff <= f + 4; ff++)
          if (T.pitch(ss, ff) === rp + iv && ss !== s) opts.push({ s: ss, f: ff });
        if (!opts.length) continue;
        const tg = pick(opts), rootPc = T.mod(rp);
        fb.set(U.fbState({ frets: 15, labels:'iv', marks: [T.mark(s, f, rootPc), Object.assign(T.mark(tg.s, tg.f, rootPc), { role:'q', label:'?' })], onPick: null }));
        promptEl.textContent = 'Qual é o intervalo entre a tônica e a nota “?”';
        ansEl.innerHTML = ivs.map(i => `<button type="button" class="btn ans" data-a="${i}">${i === 12 ? 'Oitava' : T.IV_NAME[i]}</button>`).join('');
        A.play(rp, null, { dur: 0.8 }); A.play(rp + iv, A.now() + 0.5, { dur: 1 });
        return { answer: iv, reveal: () => fb.set({ marks: [T.mark(s, f, rootPc), Object.assign(T.mark(tg.s, tg.f, rootPc), iv === 12 ? { label:'8' } : {})] }) };
      }
    },
    'triade'() {
      const root = rnd(12), qual = pick(['maior', 'menor']), set = pick(T.STRING_SETS);
      const vs = T.triads(root, qual, set.s, 15);
      const v = pick(vs);
      fb.set(U.fbState({ frets: 15, labels:'note', flats: T.useFlats(root, qual === 'menor' ? 3 : 0), marks: v.notes.map(n => Object.assign({}, n, { role:'q' })), onPick: null }));
      promptEl.textContent = `Que tríade é esta? (${set.label})`;
      ansEl.innerHTML = ['maior', 'menor'].flatMap(qq => [0, 1, 2].map(i => `<button type="button" class="btn ans" data-a="${qq}-${i}">${T.CHORDS[qq].name} · ${T.INV_NAME[i]}</button>`)).join('');
      v.notes.forEach((n, k) => A.play(T.pitch(n.s, n.f), A.now() + k * 0.03, { dur: 1.2, vel: 0.6 }));
      return { answer: `${qual}-${v.inv}`, extra: `${T.chordName(root, qual, latin())}, ${T.INV_NAME[v.inv].toLowerCase()}`, reveal: () => fb.set({ marks: v.notes, labels:'iv' }) };
    },
    'ouvido'() {
      const ivs = [3, 4, 5, 7, 9, 10, 12];
      const iv = pick(ivs), base = 48 + rnd(12);
      const playIt = () => { A.play(base, null, { dur: 0.9 }); A.play(base + iv, A.now() + 0.7, { dur: 0.9 }); A.play(base, A.now() + 1.6, { dur: 1.2, vel: 0.6 }); A.play(base + iv, A.now() + 1.6, { dur: 1.2, vel: 0.6 }); };
      fb.set(U.fbState({ frets: 15, marks: [], onPick: null }));
      promptEl.innerHTML = 'Ouça e escolha o intervalo. <button type="button" class="btn" data-act="replay">♪ Ouvir de novo</button>';
      promptEl.querySelector('[data-act]').onclick = playIt;
      ansEl.innerHTML = ivs.map(i => `<button type="button" class="btn ans" data-a="${i}">${i === 12 ? 'Oitava' : T.IV_NAME[i]}</button>`).join('');
      playIt();
      const s = base - 40 < 12 ? 0 : 1, f = base - T.TUNING[s];
      return { answer: iv, reveal: () => {
        const tp = base + iv; let best = null;
        for (let ts = s; ts < 6; ts++) {
          const tf = tp - T.TUNING[ts];
          if (tf < 0 || tf > 15) continue;
          const d = Math.abs(tf - f);
          if (!best || d < best.d) best = { ts, tf, d };
        }
        fb.set({ marks: [T.mark(s, f, T.mod(base)), Object.assign(T.mark(best.ts, best.tf, T.mod(base)), iv === 12 ? { label:'8' } : {})], labels:'iv' });
      } };
    },
  };

  function next() {
    clearTimeout(timer);
    if (round >= QZ.rounds) return finish();
    locked = false; fbk.textContent = ''; fbk.className = 'feedback';
    el.querySelector('[data-count]').textContent = `${round + 1}/${QZ.rounds} · ${score} acertos`;
    cur = GEN[q.id]();
  }

  function answer(ok, click) {
    if (locked) return;
    locked = true; round++;
    if (ok) score++;
    let right = '';
    if (q.id === 'qual-nota') right = T.noteName(cur.answer, false, latin());
    else if (q.id === 'intervalo' || q.id === 'ouvido') right = cur.answer === 12 ? 'Oitava' : T.IV_NAME[cur.answer];
    else if (q.id === 'triade') right = cur.extra;
    fbk.textContent = ok ? (q.id === 'triade' ? `Certo: ${cur.extra}.` : 'Certo!') : (right ? `Era ${right}.` : 'Não é aqui. Veja as posições certas.');
    fbk.className = 'feedback ' + (ok ? 'ok' : 'bad');
    cur.reveal(click);
    if (click) A.play(T.pitch(click.s, click.f), null, { dur: 0.8 });
    el.querySelector('[data-count]').textContent = `${round}/${QZ.rounds} · ${score} acertos`;
    timer = setTimeout(next, ok ? 900 : 1900);
  }

  function finish() {
    const pct = Math.round(score / QZ.rounds * 100), secs = Math.round((performance.now() - t0) / 1000);
    const prev = S.get().quiz[q.id];
    const isBest = !prev || pct > prev.best || (pct === prev.best && secs < prev.time);
    if (isBest) S.update(s => { s.quiz[q.id] = { best: pct, time: secs, date: S.today() }; });
    S.practiced();
    promptEl.innerHTML = '';
    ansEl.innerHTML = `<div class="result"><b>${pct}%</b><span>${score} de ${QZ.rounds} em ${secs}s${isBest ? ' · novo recorde' : ` · recorde ${prev.best}%`}</span>
      <div class="ctrl-row center"><button type="button" class="btn primary" data-act="again">Jogar de novo</button><a class="btn" href="#quiz">Outros quizzes</a></div></div>`;
    fbk.textContent = pct >= 90 ? 'Excelente. Tente ficar mais rápido.' : pct >= 60 ? 'Bom. Repita até passar de 90%.' : 'Reveja a aula correspondente e tente de novo.';
    fbk.className = 'feedback';
  }

  el.addEventListener('click', e => {
    const chip = e.target.closest('[data-chips="scope"] .chip');
    if (chip) { QZ.scope = chip.dataset.v; chip.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === chip)); round = 0; score = 0; t0 = performance.now(); next(); return; }
    const a = e.target.closest('[data-a]');
    if (a && cur && !cur.custom) { answer(String(cur.answer) === a.dataset.a); a.classList.add(String(cur.answer) === a.dataset.a ? 'ok' : 'bad'); return; }
    if (e.target.closest('[data-act="again"]')) { round = 0; score = 0; t0 = performance.now(); next(); }
  });
  next();
  return () => { clearTimeout(timer); A.stopAll(); };
}

V.progresso = (el) => {
  const st = S.get(), all = ALL_LESSONS();
  const doneN = all.filter(l => st.done[l.id]).length;
  const days = new Set(st.days);
  const cells = [];
  const d = new Date(); d.setDate(d.getDate() - 83);
  for (let i = 0; i < 84; i++) {
    const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    cells.push(`<i class="${days.has(k) ? 'on' : ''}" title="${d.toLocaleDateString('pt-BR')}"></i>`);
    d.setDate(d.getDate() + 1);
  }
  const recs = LICKS.filter(l => st.bpm[l.id]);
  el.innerHTML = `
    <header class="page-head"><p class="eyebrow">Progresso</p><h1>Seu caderno de estudo</h1>
      <p class="lede" data-syncline></p></header>
    <div class="stat-row wide">
      <div class="stat"><b>${doneN}<small>/${all.length}</small></b><span>aulas concluídas</span></div>
      <div class="stat"><b>${S.streak()}</b><span>dias seguidos</span></div>
      <div class="stat"><b>${st.days.length}</b><span>dias de prática</span></div>
      <div class="stat"><b>${recs.length}</b><span>recordes de BPM</span></div>
    </div>
    <div class="info-grid">
      <section class="panel"><p class="eyebrow">Últimas 12 semanas</p><div class="heat">${cells.join('')}</div>
        <p class="small">Um dia conta quando você toca um lick, faz um quiz, usa o treino ou conclui uma aula.</p></section>
      <section class="panel"><p class="eyebrow">Módulos</p>
        <ul class="mod-prog">${MODULES.map(m => { const n = m.lessons.filter(l => st.done[l.id]).length;
          return `<li><span>${m.title}</span><div class="bar"><i style="width:${n / m.lessons.length * 100}%"></i></div><em>${n}/${m.lessons.length}</em></li>`; }).join('')}</ul></section>
      <section class="panel"><p class="eyebrow">Recordes de velocidade</p>
        ${recs.length ? `<table class="tbl"><thead><tr><th>Exercício</th><th>Recorde</th><th>Original</th></tr></thead><tbody>${recs.map(l => `<tr><td><a href="#treino-${l.id}">${U.esc(l.title)}</a></td><td><b>${st.bpm[l.id]}</b> BPM</td><td>${l.bpm} BPM</td></tr>`).join('')}</tbody></table>`
          : '<p class="small">Nenhum recorde ainda. No <a href="#treino-ex-pent">treino de velocidade</a>, toque limpo e clique em “Consegui limpo”.</p>'}</section>
      <section class="panel"><p class="eyebrow">Quizzes</p>
        <table class="tbl"><tbody>${QUIZZES.map(z => `<tr><td><a href="#quiz-${z.id}">${z.title}</a></td><td>${st.quiz[z.id] ? `<b>${st.quiz[z.id].best}%</b> · ${st.quiz[z.id].time}s` : '—'}</td></tr>`).join('')}</tbody></table></section>
    </div>
    ${S.standalone ? `<section class="panel backup"><p class="eyebrow">Backup</p>
      <p class="small">Neste modo o progresso fica salvo só neste aparelho. Para levar para outro (do PC para o celular, por exemplo), exporte aqui e importe lá.</p>
      <div class="ctrl-row"><button type="button" class="btn" data-act="export">Exportar progresso</button>
        <label class="btn" for="import-file">Importar backup</label><input type="file" id="import-file" accept="application/json,.json" hidden></div></section>` : ''}
    <section class="danger"><button type="button" class="btn ghost" data-act="reset">Apagar meu progresso</button></section>`;
  const sync = () => { el.querySelector('[data-syncline]').textContent = S.mode === 'conta'
    ? 'Seu progresso fica salvo na sua conta e aparece igual no computador e no celular.'
    : S.standalone ? 'Seu progresso fica salvo neste aparelho. Use o backup abaixo para levar para outro.'
    : 'Seu progresso está salvo neste navegador. Abra pelo link do Claude com sua conta para levar para outros aparelhos.'; };
  sync();
  const off = S.on(sync);
  let armed = false;
  el.addEventListener('change', e => {
    if (e.target.id !== 'import-file' || !e.target.files[0]) return;
    e.target.files[0].text().then(txt => { S.importData(JSON.parse(txt)); U.toast('Backup importado'); APP.rerender(); })
      .catch(() => U.toast('Não consegui ler esse arquivo. Use um backup exportado por este app.'));
  });
  el.addEventListener('click', e => {
    if (e.target.closest('[data-act="export"]')) {
      const blob = new Blob([S.exportData()], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `mapa-do-braco-backup-${S.today()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      return;
    }
    const b = e.target.closest('[data-act="reset"]'); if (!b) return;
    if (!armed) { armed = true; b.textContent = 'Clique de novo para apagar tudo'; b.classList.add('warn'); setTimeout(() => { armed = false; b.textContent = 'Apagar meu progresso'; b.classList.remove('warn'); }, 4000); return; }
    S.reset(); U.toast('Progresso apagado'); APP.rerender();
  });
  return off;
};

const APP = (() => {
  let cleanup = null;
  const host = () => document.getElementById('view');

  function route() {
    const h = (location.hash || '#trilha').slice(1);
    const pre = (p) => h.startsWith(p) ? h.slice(p.length) : null;
    if (pre('aula-') != null) return ['trilha', el => V.lesson(el, pre('aula-'))];
    if (h === 'licks' || pre('lick-') != null) return ['licks', el => V.licks(el, pre('lick-'))];
    if (h === 'treino') return ['treino', el => V.metronomo(el)];
    if (pre('treino-') != null) return ['treino', el => V.speed(el, pre('treino-'))];
    if (h === 'jam' || pre('jam-') != null) return ['treino', el => V.jam(el, pre('jam-'))];
    if (h === 'quiz' || pre('quiz-') != null) return ['quiz', el => V.quiz(el, pre('quiz-'))];
    if (h === 'braco') return ['braco', el => V.braco(el)];
    if (h === 'progresso') return ['progresso', el => V.progresso(el)];
    return ['trilha', el => V.trilha(el)];
  }

  let lastHash = null;
  function render() {
    if (cleanup) { try { cleanup(); } catch (e) { console.error(e); } cleanup = null; }
    const [nav, fn] = route();
    const el = document.createElement('div');
    el.className = 'view';
    host().replaceChildren(el);
    try { const r = fn(el); cleanup = typeof r === 'function' ? r : null; }
    catch (e) { console.error(e); el.innerHTML = `<div class="panel"><p>Algo deu errado ao abrir esta tela. <a href="#trilha">Voltar para a trilha</a>.</p></div>`; }
    document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.nav === nav));
    const h = location.hash;
    const sameBase = lastHash && lastHash.startsWith('#lick-') && h.startsWith('#lick-');
    if (sameBase && window.innerWidth < 900) el.querySelector('.lick-main')?.scrollIntoView({ block: 'start' });
    else if (!sameBase) window.scrollTo(0, 0);
    lastHash = h;
  }

  function settingsSheet() {
    const st = S.get().settings;
    const sh = document.getElementById('settings');
    sh.querySelector('[data-body]').innerHTML = `
      <div class="set-row"><span>Nomes das notas</span>${U.chips('latin', [{ v:'0', label:'C D E' }, { v:'1', label:'Dó Ré Mi' }], st.latin ? '1' : '0')}</div>
      <div class="set-row"><span>Mão</span>${U.chips('lefty', [{ v:'0', label:'Destro' }, { v:'1', label:'Canhoto' }], st.lefty ? '1' : '0')}</div>
      <div class="set-row"><span>Casas visíveis</span>${U.chips('frets', [{ v:'12', label:'12' }, { v:'15', label:'15' }, { v:'22', label:'22' }], String(st.frets))}</div>
      <div class="set-row"><span>Timbre</span>${U.chips('tone', [{ v:'clean', label:'Limpo' }, { v:'drive', label:'Drive' }], st.tone)}</div>
      <div class="set-row"><label for="set-vol">Volume</label><input type="range" id="set-vol" min="0" max="1" step="0.05" value="${st.volume}"></div>
      <p class="small">Toque qualquer casa do braço para ouvir a nota.</p>`;
  }

  function init() {
    const st = S.get().settings;
    A.setTone(st.tone); A.setVolume(st.volume);
    window.addEventListener('hashchange', render);
    const sh = document.getElementById('settings');
    const open = () => { settingsSheet(); sh.hidden = false; sh.querySelector('.chip')?.focus(); };
    const close = () => { sh.hidden = true; };
    document.getElementById('btn-settings').addEventListener('click', () => sh.hidden ? open() : close());
    sh.addEventListener('click', e => {
      if (e.target === sh || e.target.closest('[data-close]')) return close();
      const chip = e.target.closest('[data-chips] .chip'); if (!chip) return;
      const k = chip.parentElement.dataset.chips, v = chip.dataset.v;
      S.update(s => {
        if (k === 'latin' || k === 'lefty') s.settings[k] = v === '1';
        else if (k === 'frets') s.settings.frets = +v;
        else s.settings[k] = v;
      });
      if (k === 'tone') { A.setTone(v); A.play(52, null, { dur: 1 }); A.play(59, A.now() + 0.02, { dur: 1 }); A.play(64, A.now() + 0.04, { dur: 1 }); }

    const syncEl = document.getElementById('sync');

  return { init, rerender: render };
