/* ===== Progresso: conta (db) com cópia local ===== */
const S = (() => {
  const KEY = 'mapa-do-braco-v1';
  const DEF = () => ({ v:1, done:{}, bpm:{}, quiz:{}, days:[], changes:{}, goals:{},
    minutes:{}, plan:null, myLicks:[], songs:[], badges:{}, challenges:{},
    settings:{ latin:false, lefty:false, frets:15, tone:'clean', volume:0.8 } });
  let state = DEF(), ref = null, mode = 'local', timer = null, writing = Promise.resolve();
  const subs = new Set();

  try { const raw = localStorage.getItem(KEY); if (raw) state = Object.assign(DEF(), JSON.parse(raw)); } catch (e) {}
  state.settings = Object.assign(DEF().settings, state.settings);
  { const d = DEF(); for (const k in d) if (state[k] === undefined) state[k] = d[k]; }

  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

  function merge(a, b) {
    const out = DEF();
    out.done = Object.assign({}, b.done, a.done);
    for (const src of [a.bpm || {}, b.bpm || {}]) for (const k in src) out.bpm[k] = Math.max(out.bpm[k] || 0, src[k]);
    for (const src of [a.quiz || {}, b.quiz || {}]) for (const k in src) {
      const cur = out.quiz[k];
      if (!cur || src[k].best > cur.best) out.quiz[k] = src[k];
    }
    out.days = [...new Set([...(a.days || []), ...(b.days || [])])].sort().slice(-400);
    out.goals = Object.assign({}, b.goals, a.goals);
    for (const src of [a.changes || {}, b.changes || {}]) for (const k in src) out.changes[k] = Math.max(out.changes[k] || 0, src[k]);
    out.settings = Object.assign(DEF().settings, b.settings, a.settings);
    for (const src of [a.minutes || {}, b.minutes || {}]) for (const k in src) out.minutes[k] = Math.max(out.minutes[k] || 0, src[k]);
    out.badges = Object.assign({}, b.badges, a.badges);
    out.challenges = Object.assign({}, b.challenges, a.challenges);
    const pa = a.plan, pb = b.plan;
    out.plan = !pa ? pb || null : !pb ? pa : pa.date !== pb.date ? (pa.date > pb.date ? pa : pb)
      : Object.assign({}, pb, pa, { done: Object.assign({}, pb.done, pa.done) });
    // listas com id e updatedAt: fica a versão mais recente de cada item (apagados ficam marcados com deleted)
    const mergeList = (x = [], y = []) => {
      const m = new Map();
      [...y, ...x].forEach(it => { const cur = m.get(it.id); if (!cur || (it.updatedAt || 0) >= (cur.updatedAt || 0)) m.set(it.id, it); });
      return [...m.values()];
    };
    out.myLicks = mergeList(a.myLicks, b.myLicks);
    out.songs = mergeList(a.songs, b.songs);
    return out;
  }

  function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function scheduleRemote() {
    if (!ref) return;
    clearTimeout(timer);
    timer = setTimeout(() => {
      const body = JSON.parse(JSON.stringify(state));
      writing = writing.then(() => ref.set(body)).then(() => { if (mode !== 'conta') { mode = 'conta'; emit(); } })
        .catch(e => { if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { ref = null; mode = 'local'; emit(); } });
    }, 1200);
  }

  function emit() { subs.forEach(fn => { try { fn(state, mode); } catch (e) { console.error(e); } }); }

  function update(fn) {
    fn(state);
    saveLocal();
    scheduleRemote();
    emit();
  }

  async function connect() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const r = db.doc('data/users/' + id + '/progress');
      const snap = await r.get();
      ref = r; mode = 'conta';
      const remote = snap.exists ? snap.data() : null;
      if (remote) { state = merge(remote, state); saveLocal(); }
      const hasLocal = Object.keys(state.done).length || state.days.length || Object.keys(state.bpm).length;
      const differs = remote ? JSON.stringify(merge(remote, {})) !== JSON.stringify(state) : hasLocal;
      if (differs) scheduleRemote();
      emit();
    } catch (e) { mode = 'local'; emit(); }
  }

  function addMinutes(n) {
    if (!(n > 0)) return;
    const d = today();
    update(s => { s.minutes[d] = Math.round(((s.minutes[d] || 0) + n) * 10) / 10; if (!s.days.includes(d)) s.days.push(d); });
  }

  function practiced() {
    const d = today();
    if (!state.days.includes(d)) update(s => { s.days.push(d); });
  }

  function streak() {
    const set = new Set(state.days);
    let n = 0; const d = new Date();
    if (!set.has(today())) d.setDate(d.getDate() - 1);
    for (;;) {
      const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      if (!set.has(k)) break;
      n++; d.setDate(d.getDate() - 1);
    }
    return n;
  }

  // fora do Claude (arquivo local, GitHub Pages, app instalado) não existe window.claude
  const standalone = !(window.claude && typeof window.claude.use === 'function');

  function importData(obj) {
    if (!obj || typeof obj !== 'object' || !obj.done || !obj.settings) throw new Error('Arquivo de backup inválido');
    state = merge(obj, state);
    saveLocal(); scheduleRemote(); emit();
  }
  const exportData = () => JSON.stringify(Object.assign({ app: 'mapa-do-braco', exportedAt: new Date().toISOString() }, state), null, 1);

  return {
    get: () => state, get mode() { return mode; }, standalone, importData, exportData,
    update, connect, practiced, streak, today, addMinutes,
    on(fn) { subs.add(fn); return () => subs.delete(fn); },
    reset() { const keep = state.settings; state = DEF(); state.settings = keep; saveLocal(); scheduleRemote(); emit(); },
  };
})();

/* ===== Componentes compartilhados ===== */
const U = (() => {
  const $ = (sel, el = document) => el.querySelector(sel);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const set = () => S.get().settings;

  function rootOptions(selPc) {
    return T.ROOTS.map((r, i) => `<option value="${i}" ${i === selPc ? 'selected' : ''}>${T.rootName(i, set().latin)}</option>`).join('');
  }
  function chips(name, items, value) {
    return `<div class="chips" role="group" data-chips="${name}">${items.map(it =>
      `<button type="button" class="chip ${String(it.v) === String(value) ? 'on' : ''}" data-v="${esc(it.v)}" aria-pressed="${String(it.v) === String(value)}">${esc(it.label)}</button>`).join('')}</div>`;
  }
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2200);
  }

  function fbState(extra = {}) {
    const st = set();
    return Object.assign({ frets: st.frets, lefty: st.lefty, latin: st.latin }, extra);
  }

  /** Monta marcas para uma demonstração de aula/explorador. */
  function buildDemo(cfg) {
    const st = set(), N = Math.max(st.frets, cfg.minFrets || 0);
    const root = typeof cfg.root === 'number' ? cfg.root : T.pcOf(cfg.root || 'C');
    let marks = [], caption = '', labels = cfg.labels || 'iv', flats = T.useFlats(root, 0), seq = null, frets = N;
    switch (cfg.kind) {
      case 'natural': {
        const nat = [0, 2, 4, 5, 7, 9, 11];
        (cfg.strings || [0]).forEach(s => { for (let f = 0; f <= 12; f++) {
          const pc = T.mod(T.pitch(s, f));
          if (nat.includes(pc)) marks.push(Object.assign(T.mark(s, f, 0), { role: (pc === 4 || pc === 5 || pc === 11 || pc === 0) ? 'pair' : 'n' }));
        } });
        labels = 'note'; flats = false;
        caption = 'Notas naturais. Em destaque os pares sem casa no meio: Mi–Fá e Si–Dó.';
        seq = 'run'; break;
      }
      case 'note': {
        marks = T.pcPositions(root, N).map(p => T.mark(p.s, p.f, root));
        labels = 'note';
        caption = `Todas as posições de ${T.rootName(root, st.latin)} até a casa ${N}.`;
        seq = 'run'; break;
      }
      case 'interval': {
        const rp = T.pitch(cfg.s, cfg.f);
        for (const iv of cfg.ivs) for (let s = cfg.s; s <= Math.min(5, cfg.s + 3); s++)
          for (let f = Math.max(0, cfg.f - 3); f <= cfg.f + 4; f++)
            if (T.pitch(s, f) === rp + iv && !(iv && s === cfg.s && f === cfg.f))
              marks.push(T.mark(s, f, root, iv === 12 ? { label: '8' } : {}));
        marks.push(T.mark(cfg.s, cfg.f, root));
        caption = `Tônica ${T.rootName(root, st.latin)} na ${T.stringLabel(cfg.s).toLowerCase()}, casa ${cfg.f}.`;
        seq = 'run'; break;
      }
      case 'power': {
        const s = cfg.s || 0;
        for (let f = T.mod(root - T.TUNING[s]); f + 2 <= N; f += 12)
          marks.push(T.mark(s, f, root), T.mark(s + 1, f + 2, root), T.mark(s + 2, f + 2, root, { label: '8' }));
        caption = `${T.rootName(root, st.latin)}5: tônica, 5ª e oitava.`;
        seq = 'strum'; break;
      }
      case 'scale': {
        const sc = T.SCALES[cfg.scale];
        flats = T.useFlats(root, sc.parent);
        const pos = cfg.pos ?? 0;
        marks = T.scaleMarks(cfg.scale, root, pos, N);
        const posName = pos < 0 ? 'braço inteiro' : (sc.sys === 'box' ? `caixa ${pos + 1}` : `posição ${pos + 1}`);
        caption = `${sc.name} de ${T.rootName(root, st.latin)}, ${posName}.`;
        seq = 'run'; break;
      }
      case 'triad': {
        const set3 = T.STRING_SETS.find(x => x.id === (cfg.set || '123'));
        const q = cfg.quality || 'maior';
        flats = T.useFlats(root, q === 'menor' ? 3 : 0);
        let vs = T.triads(root, q, set3.s, N);
        if (cfg.inv != null && cfg.inv >= 0) vs = vs.filter(v => v.inv === cfg.inv);
        vs.forEach(v => v.notes.forEach(n => marks.push(n)));
        seq = { groups: vs.map(v => v.notes) };
        caption = `${T.chordName(root, q, st.latin)} nas ${set3.label.toLowerCase()}` + (cfg.inv >= 0 ? `, ${T.INV_NAME[cfg.inv].toLowerCase()}.` : ', três inversões.');
        break;
      }
      case 'caged': {
        const q = cfg.quality || 'maior';
        flats = T.useFlats(root, q === 'menor' ? 3 : 0);
        const shapes = T.cagedAll(q, root, N);
        const chordIv = T.CHORDS[q].iv;
        if (cfg.shape === 'all' || !cfg.shape) {
          const seen = new Set();
          shapes.forEach(sh => sh.notes.forEach(n => { const k = n.s + ':' + n.f; if (!seen.has(k)) { seen.add(k); marks.push(n); } }));
          seq = { groups: shapes.map(sh => sh.notes) };
          caption = `${T.chordName(root, q, st.latin)} nas 5 formas: ` + shapes.map(sh => `${sh.k} (casa ${sh.lo})`).join(' → ');
        } else {
          const sh = shapes.find(x => x.k === cfg.shape);
          const layer = cfg.layer || 'chord';
          if (layer === 'chord') { marks = sh.notes; seq = { groups: [sh.notes] }; }
          else {
            const lo = Math.max(0, sh.lo - (layer === 'pent' ? 1 : 0)), hi = sh.hi + 1;
            const ivs = layer === 'arp' ? chordIv : (q === 'menor' ? T.SCALES.pent_menor.iv : T.SCALES.pent_maior.iv);
            const shapeKeys = new Set(sh.notes.map(n => n.s + ':' + n.f));
            marks = T.allNotes(ivs, root, hi, lo).map(m => (layer === 'pent' && !chordIv.includes(m.iv)) ? Object.assign(m, { small: true }) : m);
            sh.notes.forEach(n => { if (!marks.some(m => m.s === n.s && m.f === n.f)) marks.push(n); });
            marks.forEach(m => { if (layer !== 'chord' && !shapeKeys.has(m.s + ':' + m.f) && chordIv.includes(m.iv)) m.cls = 'ring'; });
            seq = 'run';
          }
          caption = `Forma ${sh.k} de ${T.chordName(root, q, st.latin)}, casas ${sh.lo} a ${sh.hi}.`;
        }
        break;
      }
      case 'arp': {
        const ch = T.CHORDS[cfg.chord];
        flats = T.useFlats(root, ch.iv.includes(3) ? 3 : 0);
        const lo = cfg.lo ?? 0, hi = Math.min(cfg.hi ?? N, N);
        marks = T.allNotes(ch.iv, root, hi, lo);
        caption = `Arpejo de ${T.chordName(root, cfg.chord, st.latin)} entre as casas ${lo} e ${hi}.`;
        seq = 'run'; break;
      }
      case 'lick': {
        const lk = lickById(cfg.lick);
        const p = TAB.parse(lk.src);
        const r = T.pcOf(lk.key);
        marks = TAB.marks(p, r);
        flats = T.useFlats(r, T.SCALES[lk.scale]?.parent || 0);
        const mx = Math.max(...marks.map(m => m.f));
        frets = Math.min(22, Math.max(N, mx + 1));
        caption = `Notas do lick “${lk.title}”. Use o player abaixo.`;
        break;
      }
    }
    return { marks, caption, labels, flats, seq, frets, root };
  }

  /** Toca o conteúdo de uma demonstração. */
  function playDemo(demo) {
    A.init(); S.practiced();
    const t0 = A.now() + 0.08;
    if (demo.seq && demo.seq.groups) {
      demo.seq.groups.forEach((g, i) => {
        const notes = g.slice().sort((a, b) => T.pitch(a.s, a.f) - T.pitch(b.s, b.f));
        notes.forEach((n, j) => A.play(T.pitch(n.s, n.f), t0 + i * 0.9 + j * 0.03, { dur: 0.85, vel: 0.6, string: n.s }));
      });
      return;
    }
    const uniq = new Map();
    demo.marks.filter(m => !m.dim).forEach(m => { const p = T.pitch(m.s, m.f); if (!uniq.has(p)) uniq.set(p, m); });
    const ps = [...uniq.keys()].sort((a, b) => a - b);
    if (demo.seq === 'strum') { ps.forEach((p, j) => A.play(p, t0 + j * 0.03, { dur: 1.4, vel: 0.65 })); return; }
    const run = ps.length > 1 ? ps.concat(ps.slice(0, -1).reverse()) : ps;
    run.slice(0, 64).forEach((p, i) => A.play(p, t0 + i * 0.2, { dur: 0.3, vel: 0.7, string: uniq.get(p).s }));
  }

  function legend(kind) {
    const items = [['r','Tônica'],['3','Terça'],['5','Quinta'],['7','Sétima'],['2','2ª / 9ª'],['4','4ª / 11ª'],['6','6ª / 13ª'],['b5','♭5 (blue note)']];
    const list = kind === 'natural' ? [['n','Nota natural'],['pair','Mi–Fá / Si–Dó']] : items;
    return `<div class="legend">${list.map(([r, l]) => `<span><i class="dot iv-${r}"></i>${l}</span>`).join('')}</div>`;
  }

  /** Painel de lick: tablatura + controles, trecho A-B e prática com microfone. Usa o braço `fb` informado. */
  function lickPanel(host, lick, fb, opts = {}) {
    const parsed = TAB.parse(lick.src);
    const root = T.pcOf(lick.key);
    const sc = T.SCALES[lick.scale];
    const level = '●'.repeat(lick.level) + '○'.repeat(5 - lick.level);
    const sfx = lick.id + (opts.idSuffix || '');
    host.innerHTML = `
      <div class="lick-head">
        <div><h3>${esc(lick.title)}</h3>
          <p class="meta"><span>${STYLES[lick.style] || 'Meus licks'}</span><span>Tom: ${T.rootName(root, set().latin)}</span><span>${sc ? sc.name : ''}</span><span>${lick.bpm} BPM</span><span title="Dificuldade">${level}</span></p></div>
      </div>
      ${lick.chords ? `<p class="chords">${lick.chords.map((c, i) => `<span>${i + 1}</span>${esc(c)}`).join('')}</p>` : ''}
      <div class="tab-scroll" data-tab></div>
      <p class="small ab-line"><span data-ab>Toque em duas colunas da tablatura para repetir só aquele trecho.</span> <button type="button" class="linkbtn" data-act="abclear" hidden>Tocar tudo</button></p>
      <div class="ctrl-row">
        <button type="button" class="btn primary" data-act="play">▶ Tocar</button>
        <label class="field">Velocidade <select data-speed id="spd-${sfx}">
          ${[50, 60, 70, 80, 90, 100, 110, 120].map(p => `<option value="${p}" ${p === (opts.speed || 100) ? 'selected' : ''}>${p}% · ${Math.round(lick.bpm * p / 100)} BPM</option>`).join('')}
        </select></label>
        <label class="check"><input type="checkbox" data-loop id="loop-${sfx}"> Repetir</label>
        <label class="check"><input type="checkbox" data-click id="clk-${sfx}" ${opts.click ? 'checked' : ''}> Metrônomo</label>
        <button type="button" class="btn" data-act="mic">🎤 Praticar com microfone</button>
      </div>
      <p class="tu-msg" data-micmsg aria-live="polite" hidden></p>
      <p class="tip"><b>${esc(lick.tech)}.</b> ${esc(lick.tip)}</p>`;
    const tabHost = host.querySelector('[data-tab]');
    const highlight = TAB.render(tabHost, parsed);
    const btn = host.querySelector('[data-act="play"]');
    let A0 = null, B0 = null, offset = 0;
    const setActive = ev => fb && fb.setActive(ev ? ev.notes.filter(o => !o.dead).map(o => o.s + ':' + o.f) : []);
    const player = TAB.Player({
      onEvent(i) { const gi = i < 0 ? -1 : i + offset; highlight(gi); setActive(parsed.events[gi]); },
      onEnd() { btn.textContent = '▶ Tocar'; btn.classList.remove('on'); fb && fb.setActive([]); },
    });
    function range() {
      if (A0 == null) return null;
      return [Math.min(A0, B0 ?? A0), Math.max(A0, B0 ?? A0)];
    }
    function paintAB() {
      const r = range();
      tabHost.querySelectorAll('.tab-col').forEach(c => { const i = +c.dataset.i; c.classList.toggle('sel', !!r && i >= r[0] && i <= r[1]); });
      host.querySelector('[data-ab]').textContent = !r ? 'Toque em duas colunas da tablatura para repetir só aquele trecho.'
        : B0 == null ? 'Agora toque na última coluna do trecho.' : `Trecho: notas ${r[0] + 1} a ${r[1] + 1}. Ele toca em loop.`;
      host.querySelector('[data-act="abclear"]').hidden = !r;
    }
    function sub() {
      const r = range();
      if (!r || B0 == null) { offset = 0; return parsed; }
      const evs = parsed.events.slice(r[0], r[1] + 1), b0 = evs[0].beat;
      offset = r[0];
      return { events: evs.map(e => Object.assign({}, e, { beat: e.beat - b0 })), beats: evs[evs.length - 1].beat + evs[evs.length - 1].d - b0 };
    }
    function play() {
      opts.onPlay && opts.onPlay();
      const pct = +host.querySelector('[data-speed]').value;
      player.play(sub(), { bpm: lick.bpm * pct / 100, loop: B0 != null || host.querySelector('[data-loop]').checked, click: host.querySelector('[data-click]').checked });
      btn.textContent = '■ Parar'; btn.classList.add('on');
      S.practiced();
    }
    btn.addEventListener('click', () => {
      if (player.playing) { player.stop(); btn.textContent = '▶ Tocar'; btn.classList.remove('on'); return; }
      stopMic(); play();
    });
    tabHost.addEventListener('click', e => {
      const c = e.target.closest('.tab-col'); if (!c) return;
      const i = +c.dataset.i;
      if (A0 == null || B0 != null) { A0 = i; B0 = null; } else B0 = i;
      paintAB();
      if (B0 != null && player.playing) play();
    });
    host.querySelector('[data-act="abclear"]').addEventListener('click', () => { A0 = B0 = null; paintAB(); if (player.playing) play(); });

    /* prática com microfone: o app espera a nota certa para avançar */
    const msg = host.querySelector('[data-micmsg]'), micBtn = host.querySelector('[data-act="mic"]');
    let mic = null;
    function stopMic(text) {
      if (!mic) return;
      MIC.stop(); mic = null; micBtn.textContent = '🎤 Praticar com microfone'; micBtn.classList.remove('on');
      highlight(-1); fb && fb.setActive([]);
      if (text) msg.textContent = text; else msg.hidden = true;
    }
    function targetAt(k) {
      const ev = mic.evs[k];
      return ev.notes.filter(o => !o.dead).flatMap(o => [T.TUNING[o.s] + o.f].concat(o.bend ? [T.TUNING[o.s] + o.f + o.bend] : []));
    }
    function showTarget() {
      const gi = mic.idx[mic.k];
      highlight(gi); setActive(parsed.events[gi]);
      const names = [...new Set(targetAt(mic.k).map(m => T.noteName(m, false, set().latin)))].join(' ou ');
      msg.textContent = `Nota ${mic.k + 1} de ${mic.evs.length}: toque ${names}${mic.miss ? ` · ${mic.miss} erro${mic.miss > 1 ? 's' : ''}` : ''}`;
    }
    micBtn.addEventListener('click', async () => {
      if (mic) { stopMic(); return; }
      player.stop(); btn.textContent = '▶ Tocar'; btn.classList.remove('on');
      const r = range() && B0 != null ? range() : [0, parsed.events.length - 1];
      const idx = []; for (let i = r[0]; i <= r[1]; i++) if (parsed.events[i].notes.some(o => !o.dead)) idx.push(i);
      mic = { k: 0, idx, evs: idx.map(i => parsed.events[i]), stable: 0, last: null, miss: 0, wrongLock: 0, t0: performance.now() };
      msg.hidden = false;
      try {
        await MIC.start(p => {
          if (!mic) return;
          if (p.hz < 0) { mic.stable = 0; mic.last = null; return; }
          if (p.midi === mic.last) mic.stable++; else { mic.stable = 1; mic.last = p.midi; }
          if (mic.stable < 3 || Math.abs(p.cents) > 45) return;
          if (targetAt(mic.k).includes(p.midi)) {
            mic.k++; mic.stable = -6; mic.wrongLock = 0;
            if (mic.k >= mic.evs.length) {
              const secs = Math.round((performance.now() - mic.t0) / 1000), miss = mic.miss;
              S.practiced(); stopMic(`Concluído em ${secs} s${miss ? ` com ${miss} erro${miss > 1 ? 's' : ''}` : ' sem erros'}! Agora tente no tempo do metrônomo.`);
              msg.hidden = false; return;
            }
            showTarget();
          } else if (mic.stable === 3 && performance.now() > mic.wrongLock) { mic.miss++; mic.wrongLock = performance.now() + 600; showTarget(); }
        });
        micBtn.textContent = '■ Parar microfone'; micBtn.classList.add('on');
        showTarget();
      } catch (err) { mic = null; msg.textContent = MIC.errorText(err); }
    });
    return { player, parsed, root, stop: () => { player.stop(); stopMic(); btn.textContent = '▶ Tocar'; btn.classList.remove('on'); } };
  }

  return { $, esc, set, rootOptions, chips, toast, fbState, buildDemo, playDemo, legend, lickPanel };
})();

/* ===== Componentes de aula: acordes, trocas, levadas, música com cifra ===== */
const W = {};

function chordItems(list) { return list.map(c => { const [name, prefer] = c.split('@'); return { name, prefer }; }); }

W.chords = (host, cfg) => {
  const items = chordItems(cfg.chords);
  host.innerHTML = `<div class="chord-row">${items.map(i => CH.card(i.name, { prefer: i.prefer })).join('')}</div>
    <div class="ctrl-row"><button type="button" class="btn" data-act="all">♪ Ouvir todos</button><span class="small">Toque num diagrama para ouvir o acorde.</span></div>`;
  host.addEventListener('click', e => {
    const c = e.target.closest('[data-chord]');
    if (c) { CH.strum(c.dataset.chord, null, { prefer: c.dataset.prefer }); return; }
    if (e.target.closest('[data-act="all"]')) { A.init(); items.forEach((it, i) => CH.strum(it.name, A.now() + 0.05 + i * 1.1, { prefer: it.prefer, dur: 1 })); S.practiced(); }
  });
  return () => A.stopAll();
};

/* ---- Trocas de acordes em 1 minuto ---- */
const CHANGE_PAIRS = [['Em','Am'],['E','A'],['A','D'],['D','G'],['G','C'],['C','Am'],['Em','C'],['G','D'],['Am','Dm'],['D','Em'],['C','F'],['E7','A7'],['A7','D7'],['G','Em'],['F','G'],['Am','F'],['Bm','G'],['D','Bm']];
const pairKey = p => p.join('-');

W.changes = (host, cfg = {}) => {
  const pairs = cfg.pairs || CHANGE_PAIRS;
  let cur = 0, count = 0, timer = null, endAt = 0;
  host.innerHTML = `
    <div class="ctrl-row" data-pairs></div>
    <div class="changes">
      <div class="chord-row two" data-cards></div>
      <div class="ch-side">
        <div class="ch-clock"><b data-time>60</b><span>segundos</span></div>
        <button type="button" class="tap-pad" data-act="tap" disabled><b data-count>0</b><span>trocas · toque aqui ou espaço</span></button>
        <div class="ctrl-row"><button type="button" class="btn primary" data-act="go">▶ Começar 1 minuto</button><span class="pill" data-best></span></div>
      </div>
    </div>`;
  const $ = s => host.querySelector(s);
  function paint() {
    const best = S.get().changes || {};
    $('[data-pairs]').innerHTML = U.chips('pair', pairs.map((p, i) => ({ v: i, label: `${p[0]} ↔ ${p[1]}${best[pairKey(p)] ? ` · ${best[pairKey(p)]}` : ''}` })), cur);
    $('[data-cards]').innerHTML = pairs[cur].map(n => CH.card(n)).join('');
    const b = best[pairKey(pairs[cur])];
    $('[data-best]').textContent = b ? `Recorde: ${b} trocas` : 'Sem recorde ainda';
  }
  function stop(save) {
    clearInterval(timer); timer = null;
    $('[data-act="tap"]').disabled = true;
    $('[data-act="go"]').textContent = '▶ Começar 1 minuto';
    if (save && count > 0) {
      const k = pairKey(pairs[cur]), prev = (S.get().changes || {})[k] || 0;
      S.update(s => { s.changes = s.changes || {}; s.changes[k] = Math.max(prev, count); });
      S.practiced();
      U.toast(count > prev ? `Novo recorde: ${count} trocas!` : `${count} trocas. Recorde: ${prev}`);
      A.click(A.now() + 0.01, true);
      paint();
    }
  }
  function tap() { if (!timer) return; count++; $('[data-count]').textContent = count; }
  host.addEventListener('click', e => {
    const chip = e.target.closest('[data-chips="pair"] .chip');
    if (chip) { if (timer) stop(false); cur = +chip.dataset.v; count = 0; $('[data-count]').textContent = 0; paint(); return; }
    const c = e.target.closest('[data-chord]'); if (c) { CH.strum(c.dataset.chord); return; }
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'tap') tap();
    if (act === 'go') {
      if (timer) { stop(false); return; }
      count = 0; $('[data-count]').textContent = 0; endAt = performance.now() + 60000;
      $('[data-act="tap"]').disabled = false; $('[data-act="go"]').textContent = '■ Cancelar';
      A.click(A.now() + 0.01, true);
      timer = setInterval(() => { const left = Math.max(0, Math.ceil((endAt - performance.now()) / 1000)); $('[data-time]').textContent = left; if (left <= 0) stop(true); }, 200);
    }
  });
  const key = e => { if (e.code === 'Space' && timer) { e.preventDefault(); tap(); } };
  document.addEventListener('keydown', key);
  paint();
  return () => { clearInterval(timer); document.removeEventListener('keydown', key); };
};

/* ---- Levadas ---- */
function strumPanel(host, o) {
  // o: { pattern, chords, views?, editable? }
  let pat = RH.patById(o.pattern), chords = o.chords.slice(), bpm = pat.bpm, view = 0;
  host.innerHTML = `
    ${o.views ? `<div class="ctrl-row" data-views></div>` : ''}
    <div class="strum-head"><h3 data-pname></h3><span class="small" data-pstyle></span></div>
    <div data-grid></div>
    <div class="ctrl-row"><ol class="bars" data-bars></ol></div>
    ${o.editable ? `<div class="ctrl-row"><label class="field grow">Acordes (um por compasso) <input type="text" data-chords id="strum-chords" value="${chords.join(' ')}" autocomplete="off"></label></div>` : ''}
    <div class="chord-row small-cards" data-cards></div>
    <div class="ctrl-row">
      <button type="button" class="btn primary" data-act="play">▶ Tocar</button>
      <label class="field">Andamento <input type="range" min="40" max="160" value="${bpm}" data-bpm id="strum-bpm-${o.idSuffix || ''}"> <b data-bpmv>${bpm}</b> BPM</label>
      <label class="check"><input type="checkbox" data-click id="strum-click-${o.idSuffix || ''}" checked> Metrônomo</label>
    </div>`;
  const $ = s => host.querySelector(s);
  const player = RH.Strummer({ onSlot(bar, slot) {
    host.querySelectorAll('.sg-cell.on').forEach(c => c.classList.remove('on'));
    host.querySelectorAll('[data-bars] li').forEach((li, i) => li.classList.toggle('on', i === bar));
    if (slot >= 0) host.querySelector(`.sg-cell[data-slot="${slot}"]`)?.classList.add('on');
  } });
  function paint() {
    if (o.views) $('[data-views]').innerHTML = U.chips('sview', o.views.map((v, i) => ({ v: i, label: v.label })), view);
    $('[data-pname]').textContent = pat.name;
    $('[data-pstyle]').textContent = `${pat.style} · ${pat.beats === 2 ? '6/8' : pat.beats + '/4'}`;
    $('[data-grid]').innerHTML = RH.grid(pat);
    $('[data-bars]').innerHTML = chords.map(c => `<li>${U.esc(c)}</li>`).join('');
    $('[data-cards]').innerHTML = [...new Set(chords)].filter(c => CH.get(c)).map(c => CH.card(c)).join('');
  }
  function restart() { if (player.running) player.start({ pattern: pat.id, chords, bpm, click: $('[data-click]').checked }); }
  host.addEventListener('click', e => {
    const chip = e.target.closest('[data-chips="sview"] .chip');
    if (chip) {
      view = +chip.dataset.v; const v = o.views[view];
      pat = RH.patById(v.pattern || o.pattern); chords = (v.chords || o.chords).slice(); bpm = pat.bpm;
      $('[data-bpm]').value = bpm; $('[data-bpmv]').textContent = bpm; paint(); restart(); return;
    }
    const c = e.target.closest('[data-chord]'); if (c && !player.running) { CH.strum(c.dataset.chord); return; }
    const b = e.target.closest('[data-act="play"]');
    if (b) {
      if (player.running) { player.stop(); b.textContent = '▶ Tocar'; }
      else { player.start({ pattern: pat.id, chords, bpm, click: $('[data-click]').checked }); b.textContent = '■ Parar'; S.practiced(); }
    }
  });
  host.addEventListener('input', e => {
    if (e.target.matches('[data-bpm]')) { bpm = +e.target.value; $('[data-bpmv]').textContent = bpm; player.setBpm(bpm); }
  });
  host.addEventListener('change', e => {
    if (e.target.matches('[data-click]')) player.setClick(e.target.checked);
    if (e.target.matches('[data-chords]')) {
      const list = e.target.value.trim().split(/[\s,|]+/).filter(Boolean);
      const bad = list.filter(c => !CH.get(c));
      if (!list.length || bad.length) { U.toast(bad.length ? `Não conheço: ${bad.join(', ')}` : 'Escreva pelo menos um acorde'); return; }
      chords = list; paint(); restart();
    }
  });
  paint();
  return { stop: () => player.stop(), setPattern(id) { pat = RH.patById(id); bpm = pat.bpm; $('[data-bpm]').value = bpm; $('[data-bpmv]').textContent = bpm; paint(); restart(); } };
}

W.strum = (host, cfg) => { const p = strumPanel(host, Object.assign({ idSuffix: 'aula' }, cfg)); return () => p.stop(); };

    <div class="ctrl-row">
      ${U.chips('spat', song.patterns.map(p => ({ v: p, label: RH.patById(p).name })), song.patterns[0])}
    </div>

const TUNINGS = [
  { id:'padrao', name:'Padrão (E A D G B E)', m:[40,45,50,55,59,64] },
  { id:'meio', name:'Meio tom abaixo (E♭ A♭ D♭ G♭ B♭ E♭)', m:[39,44,49,54,58,63] },
  { id:'dropd', name:'Drop D (D A D G B E)', m:[38,45,50,55,59,64] },
  { id:'umtom', name:'Um tom abaixo (D G C F A D)', m:[38,43,48,53,57,62] },
  { id:'dropc', name:'Drop C (C G C F A D)', m:[36,43,48,53,57,62] },
  { id:'openg', name:'Open G (D G D G B D)', m:[38,43,50,55,59,62] },
  { id:'dadgad', name:'DADGAD', m:[38,45,50,55,57,62] },
];

W.tuner = (host, cfg = {}) => {
  let tun = TUNINGS[0], target = -1, hist = [], okSince = 0, done = new Set();
  const latin = () => U.set().latin;
  const nm = m => T.noteName(m, tun.id === 'meio', latin());
  host.innerHTML = `
    <div class="ctrl-row">
      <label class="field">Afinação <select data-tun id="tuner-tun">${TUNINGS.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}</select></label>
      <button type="button" class="btn primary" data-act="mic">🎤 Ligar microfone</button>
    </div>
    <div class="tuner">
      <div class="tu-read"><b data-note>–</b><span data-hz>Toque uma corda solta</span></div>
      <div class="tu-meter" aria-hidden="true"><i class="tu-zero"></i><i class="tu-needle" data-needle></i><span>−50</span><span>0</span><span>+50</span></div>
      <p class="tu-msg" data-msg aria-live="polite"></p>
    </div>
    <div class="tu-strings" data-strings></div>
    <p class="small">Toque num botão de corda para ouvir a nota de referência e afinar de ouvido. Com o microfone ligado, o afinador reconhece a corda sozinho.</p>`;
  const $ = s => host.querySelector(s);
  function strings() {
    $('[data-strings]').innerHTML = tun.m.map((m, i) => `<button type="button" class="tu-str ${i === target ? 'on' : ''} ${done.has(i) ? 'ok' : ''}" data-str="${i}"><small>${6 - i}</small><b>${nm(m)}</b></button>`).join('');
  }
  strings();
  function show(r) {
    if (r.hz < 0) { if (r.rms < 0.008) { $('[data-hz]').textContent = 'Toque uma corda solta'; } return; }
    hist.push(r.hz); if (hist.length > 5) hist.shift();
    const hz = hist.slice().sort((a, b) => a - b)[hist.length >> 1];
    const m = 69 + 12 * Math.log2(hz / 440);
    let si = target;
    if (si < 0) { let best = 99; tun.m.forEach((t, i) => { const d = Math.abs(m - t); if (d < best) { best = d; si = i; } }); }
    const ref = tun.m[si];
    const cents = Math.round((m - ref) * 100);
    $('[data-note]').textContent = nm(Math.round(m));
    $('[data-hz]').textContent = `${hz.toFixed(1)} Hz · corda ${6 - si} (${nm(ref)})`;
    const clamped = Math.max(-50, Math.min(50, cents));
    const needle = $('[data-needle]');
    needle.style.left = `calc(${50 + clamped}% - 2px)`;
    const ok = Math.abs(cents) <= 5;
    needle.classList.toggle('ok', ok);
    $('[data-msg]').textContent = Math.abs(cents) > 300 ? 'Longe da nota: confira se é a corda certa.' : ok ? 'Afinada!' : cents < 0 ? `Baixa ${-cents} cents: aperte a tarraxa` : `Alta ${cents} cents: afrouxe um pouco e suba de novo`;
    if (ok) { if (!okSince) okSince = performance.now(); if (performance.now() - okSince > 700 && !done.has(si)) { done.add(si); strings(); if (done.size === 6) { U.toast('Todas as cordas afinadas'); S.practiced(); } } }
    else okSince = 0;
  }
  host.addEventListener('click', async e => {
    const st = e.target.closest('[data-str]');
    if (st) { const i = +st.dataset.str; target = target === i ? -1 : i; A.play(tun.m[i], null, { dur: 2.5, vel: 0.8, string: i }); strings(); return; }
    const b = e.target.closest('[data-act="mic"]');
    if (b) {
      if (MIC.on) { MIC.stop(); b.textContent = '🎤 Ligar microfone'; $('[data-msg]').textContent = ''; return; }
      try { await MIC.start(show); b.textContent = '■ Desligar microfone'; $('[data-msg]').textContent = 'Ouvindo… toque uma corda solta.'; }
      catch (err) { $('[data-msg]').textContent = MIC.errorText(err); }
    }
  });
  host.addEventListener('change', e => { if (e.target.matches('[data-tun]')) { tun = TUNINGS.find(t => t.id === e.target.value); target = -1; done.clear(); strings(); } });
  return () => MIC.stop();
};

W.rhythm = (host, cfg = {}) => {
  const list = RH.READING.filter(r => !cfg.lv || cfg.lv.includes(r.lv));
  let idx = 0, bpm = 70, play = null, raf = null, taps = [], mode = null;
  host.innerHTML = `
    <div class="ctrl-row"><span class="pill" data-n></span>
      <button type="button" class="btn ghost" data-act="prev" aria-label="Ritmo anterior">←</button>
      <button type="button" class="btn ghost" data-act="next" aria-label="Próximo ritmo">→</button>
      <label class="field">Andamento <input type="range" min="40" max="140" value="${bpm}" data-bpm id="rh-bpm"> <b data-bpmv>${bpm}</b> BPM</label></div>
    <div class="rn-wrap" data-svg></div>
    <div class="ctrl-row">
      <button type="button" class="btn" data-act="hear">♪ Ouvir</button>
      <button type="button" class="btn primary" data-act="tapgo">Tocar junto</button>
      <span class="small" data-info>Ouça primeiro. Em “Tocar junto”, conte 4 cliques e bata no ritmo.</span>
    </div>
    <button type="button" class="tap-pad wide" data-act="tap" disabled><b data-score>–</b><span>toque aqui (ou barra de espaço) em cada nota</span></button>`;
  const $ = s => host.querySelector(s);
  let evs = [];
  function draw() {
    const r = list[idx];
    const n = RH.notation(r.src);
    evs = n.evs;
    $('[data-svg]').innerHTML = n.svg;
    $('[data-n]').textContent = `Ritmo ${idx + 1} de ${list.length} · nível ${r.lv}`;
    $('[data-score]').textContent = '–';
  }
  function anim() {
    if (!play) return;
    const now = A.ctx.currentTime, beat = (now - play.t0) / play.spb;
    host.querySelectorAll('.rn-hit').forEach(h => { const e = evs[+h.dataset.ev]; h.classList.toggle('on', beat >= e.beat && beat < e.beat + e.d); });
    if (now > play.end + 0.4) { finish(); return; }
    raf = requestAnimationFrame(anim);
  }
  function start(m) {
    stop(); mode = m; taps = [];
    play = RH.playRhythm(list[idx].src, bpm, { click: true });
    if (m === 'tap') { $('[data-act="tap"]').disabled = false; $('[data-score]').textContent = '…'; }
    raf = requestAnimationFrame(anim);
    S.practiced();
  }
  function finish() {
    cancelAnimationFrame(raf);
    host.querySelectorAll('.rn-hit.on').forEach(h => h.classList.remove('on'));
    if (mode === 'tap') {
      const exp = evs.filter(e => !e.rest).map(e => play.t0 + e.beat * play.spb);
      const used = new Set(); let sum = 0;
      exp.forEach(t => {
        let bi = -1, bd = 0.16;
        taps.forEach((x, i) => { const d = Math.abs(x - t); if (!used.has(i) && d < bd) { bd = d; bi = i; } });
        if (bi >= 0) { used.add(bi); sum += Math.max(0, 1 - bd / 0.16); }
      });
      const extra = taps.length - used.size;
      const pct = Math.round(100 * sum / (exp.length + extra * 0.5));
      $('[data-score]').textContent = pct + '%';
      $('[data-info]').textContent = pct >= 80 ? 'Ótimo! Passe para o próximo ritmo.' : pct >= 50 ? 'Quase lá. Ouça de novo e repita.' : 'Ouça de novo contando os tempos em voz alta.';
      $('[data-act="tap"]').disabled = true;
    }
    play = null; mode = null;
  }
  function stop() { cancelAnimationFrame(raf); play = null; mode = null; $('[data-act="tap"]').disabled = true; }
  // desconta a latência de saída do áudio: você bate quando OUVE o clique
  function tap() { if (mode === 'tap' && play) { taps.push(A.ctx.currentTime - (A.ctx.outputLatency || A.ctx.baseLatency || 0)); A.play(69, null, { dur: 0.08, vel: 0.4, mute: true }); } }
  host.addEventListener('pointerdown', e => { if (e.target.closest('[data-act="tap"]')) { e.preventDefault(); tap(); } });
  host.addEventListener('click', e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'prev') { idx = (idx - 1 + list.length) % list.length; stop(); draw(); }
    if (act === 'next') { idx = (idx + 1) % list.length; stop(); draw(); }
    if (act === 'hear') start('hear');
    if (act === 'tapgo') start('tap');
  });
  host.addEventListener('input', e => { if (e.target.matches('[data-bpm]')) { bpm = +e.target.value; $('[data-bpmv]').textContent = bpm; } });
  const key = e => { if (e.code === 'Space' && mode === 'tap') { e.preventDefault(); tap(); } };
  document.addEventListener('keydown', key);
  draw();
  return () => { stop(); document.removeEventListener('keydown', key); };
};

      { id:'ouvido', title:'Ouvido', desc:'Intervalos e frases de ouvido.', href:'#quiz-ouvido', pct:.15 } ],
  };

  function currentLevel(st = S.get()) {
    const lv = LEVELS.find(l => levelStats(l.n, st).pct < 1);
    return lv ? lv.n : LEVELS.length;
  }
  function nextLesson(level, st = S.get()) {
    const all = ALL_LESSONS();
    return all.find(l => l.mod.level === level && !st.done[l.id]) || all.find(l => !st.done[l.id]);
  }

  /** Blocos do dia para o tempo escolhido. */
  function blocks(mins, st = S.get()) {
    const lv = currentLevel(st), nl = nextLesson(lv, st);
    return BLOCKS[lv].map(b => {
      const o = Object.assign({}, b, { min: Math.max(2, Math.round(mins * b.pct)) });
      if (b.id === 'aula') { o.href = nl ? '#aula-' + nl.id : '#trilha'; o.desc = nl ? nl.title : 'Revise uma aula de que você gostou.'; }

    return p && p.date === S.today() ? p : { date: S.today(), mins: (p && p.mins) || 30, done: {} };
  }
  function setMins(m) { S.update(s => { const p = today(s); s.plan = Object.assign({}, p, { mins: m }); }); }
  function markDone(id) { S.update(s => { const p = today(s); s.plan = Object.assign({}, p, { done: Object.assign({}, p.done, { [id]: true }) }); }); }

  return { blocks, today, setMins, markDone, currentLevel, BLOCKS };
})();

/* Cronômetro no topo da tela: segue contando enquanto você navega. */
const PT = (() => {
  let cur = null, tick = null;
  const el = () => document.getElementById('ptimer');
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  function left() { return !cur ? 0 : cur.paused ? cur.left : Math.max(0, (cur.endAt - performance.now()) / 1000); }
  function elapsed() { return !cur ? 0 : cur.free ? (cur.paused ? cur.acc : cur.acc + (performance.now() - cur.since) / 1000) : cur.total - left(); }
  function paint() {
    const e = el(); if (!e) return;
    if (!cur) { e.hidden = true; e.innerHTML = ''; return; }
    e.hidden = false;
    const t = cur.free ? fmt(elapsed()) : fmt(left());
    e.innerHTML = `<span class="pt-label">${U.esc(cur.label)}</span><b>${t}</b>
      <button type="button" data-pt="pause" aria-label="${cur.paused ? 'Continuar' : 'Pausar'}">${cur.paused ? '▶' : '❚❚'}</button>
      <button type="button" data-pt="stop" aria-label="Encerrar">✕</button>`;
    e.classList.toggle('paused', !!cur.paused);
  }
  function chime() { A.init(); const t = A.now() + 0.05; [76, 79, 84].forEach((m, i) => A.play(m, t + i * 0.12, { dur: 1.2, vel: 0.5, bus: 'back' })); }
  function finish(completed) {
    if (!cur) return;
    const mins = elapsed() / 60;
    S.addMinutes(mins);
    if (completed && cur.blockId) PLAN.markDone(cur.blockId);
    if (completed) { chime(); U.toast(`Bloco “${cur.label}” concluído`); }
    else if (mins >= 0.5) U.toast(`${Math.round(mins)} min registrados`);
    clearInterval(tick); tick = null; cur = null; paint();
  }
  function start(o) {
    if (cur) finish(false);
    A.init();
    cur = o.free ? { free: true, label: o.label || 'Prática livre', acc: 0, since: performance.now() }
      : { blockId: o.id, label: o.label, total: o.minutes * 60, endAt: performance.now() + o.minutes * 60000 };
    clearInterval(tick);
    tick = setInterval(() => { if (!cur.free && left() <= 0) finish(true); else paint(); }, 500);
    paint();
  }
  function toggle() {
    if (!cur) return;
    if (cur.free) { if (cur.paused) { cur.since = performance.now(); cur.paused = false; } else { cur.acc += (performance.now() - cur.since) / 1000; cur.paused = true; } }
    else if (cur.paused) { cur.endAt = performance.now() + cur.left * 1000; cur.paused = false; }
    else { cur.left = left(); cur.paused = true; }
    paint();
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-pt]'); if (!b) return;
    if (b.dataset.pt === 'pause') toggle(); else finish(!cur?.free ? false : false);
  });
  window.addEventListener('pagehide', () => { if (cur) finish(false); });
  return { start, stop: () => finish(false), get active() { return cur; } };
})();

const prettyChord = n => String(n).replace(/^([A-G])#/, '$1♯').replace(/^([A-G])b/, '$1♭').replace('(b5)', '(♭5)').replace('(b9)', '(♭9)').replace('(#9)', '(♯9)');
const EXT_LABEL = { 1:'♭9', 2:'9', 3:'♯9', 9:'13' };
function formula(q) {
  const ext = ['nine', 'm9', 'maj9', 'b9', 's9', 'thirteen'].includes(q);
  return T.CHORDS[q].iv.map((iv, i) => ext && i >= 4 && EXT_LABEL[iv] ? EXT_LABEL[iv] : T.ivLabel(iv));
}
const DICT_GROUPS = [
  ['Tríades', ['maior', 'menor', 'dim', 'aum', 'sus2', 'sus4', 'power']],
  ['Tétrades', ['maj7', 'm7', 'dom7', 'm7b5', 'dim7', 'six', 'm6', 'mmaj7']],
  ['Extensões', ['nine', 'm9', 'maj9', 'thirteen', 'b9', 's9']],
];

W.dict = (host, cfg = {}) => {

  const $ = s => host.querySelector(s);
  function paint() {
    const flats = T.useFlats(root, T.CHORDS[q].iv.includes(3) ? 3 : 0);
    const name = (flats ? T.FLAT : T.SHARP)[root] + (QUAL_SUFFIX[q] ?? '');
    const ivs = T.CHORDS[q].iv, labels = formula(q);
    $('[data-head]').innerHTML = `<h3>${prettyChord(name)}</h3><p class="small">${T.CHORDS[q].name}</p>
      <div class="degrees">${ivs.map((iv, i) => `<div class="deg iv-${T.IV_ROLE[iv]}"><b>${T.noteName(root + iv, flats, U.set().latin)}</b><span>${labels[i]}</span></div>`).join('')}</div>`;
    const vs = CH.voicings(root, q);
    $('[data-voicings]').innerHTML = vs.length ? vs.map((v, i) => `<button type="button" class="chord-card" data-v="${i}"><b>${prettyChord(name)}</b><small>${v.k}</small>${CH.diagram(v)}</button>`).join('')
      : '<p class="small">Sem forma cadastrada para este acorde.</p>';
    paint.vs = vs;
    host.querySelectorAll('[data-chips="q"] .chip').forEach(c => c.classList.toggle('on', c.dataset.v === q));
  }
  host.addEventListener('click', e => {
    const chip = e.target.closest('[data-chips="q"] .chip'); if (chip) { q = chip.dataset.v; paint(); return; }
    const c = e.target.closest('[data-v]');
    if (c && paint.vs) { const v = paint.vs[+c.dataset.v]; A.init(); const t = A.now() + 0.03; CH.voicing(v).forEach((n, i) => A.play(n.midi, t + i * 0.025, { dur: 1.8, vel: 0.55, string: n.s })); }
  });
  host.addEventListener('change', e => { if (e.target.matches('[data-root]')) { root = +e.target.value; paint(); } });
  paint();
  return () => A.stopAll();
};

const PROG_MAJOR = [[1, 5, 6, 4], [6, 4, 1, 5], [1, 6, 4, 5], [1, 4, 5, 4], [2, 5, 1, 1], [4, 5, 3, 6], [1, 4, 6, 5]];
const PROG_MINOR = [[1, 4, 5, 1], [1, 6, 3, 7], [1, 7, 6, 7], [1, 4, 7, 3], [2, 5, 1, 1]];
const PROG_NAMED = { 'ii-V-I': [2, 5, 1, 1], 'I-V-vi-IV': [1, 5, 6, 4] };

W.campo = (host, cfg = {}) => {
  let root = T.pcOf(cfg.root || 'C'), scale = cfg.scale || 'maior', tet = !!cfg.tetrads, view = 0, pi = 0, pattern = 'pop', bpm = 84;
  const views = cfg.views;
  const progs = () => scale === 'maior' ? PROG_MAJOR : PROG_MINOR;
  if (cfg.prog && PROG_NAMED[cfg.prog]) pi = Math.max(0, progs().findIndex(p => p.join() === PROG_NAMED[cfg.prog].join()));
  host.innerHTML = `
    ${views ? `<div class="ctrl-row" data-views></div>` : ''}
    <div class="ctrl-row"><label class="field">Tom <select data-root id="campo-root">${U.rootOptions(root)}</select></label>
      ${U.chips('tet', [{ v: 0, label: 'Tríades' }, { v: 1, label: 'Tétrades' }], tet ? 1 : 0)}</div>
    <div class="campo" data-grid></div>
    <p class="small">T = tônica (repouso) · SD = subdominante (afastamento) · D = dominante (tensão). Toque num acorde para ouvir.</p>
    <div class="prog-box">
      <p class="eyebrow">Progressões</p>
      <div class="ctrl-row" data-progs></div>
      <ol class="bars" data-bars></ol>
      <div class="ctrl-row">
        <button type="button" class="btn primary" data-act="play">▶ Tocar progressão</button>
        ${U.chips('pat', [{ v: 'pop', label: 'Pop' }, { v: 'balada', label: 'Balada' }, { v: 'rock', label: 'Rock' }, { v: 'semi', label: '1 por tempo' }], pattern)}
        <label class="field">Andamento <input type="range" min="50" max="150" value="${bpm}" data-bpm id="campo-bpm"> <b data-bpmv>${bpm}</b></label>
      </div>
    </div>`;
  const $ = s => host.querySelector(s);
  let degs = [];
  const player = RH.Strummer({ onSlot(bar) { host.querySelectorAll('[data-bars] li').forEach((li, i) => li.classList.toggle('on', i === bar)); } });
  const chordsOf = p => p.map(d => tet ? degs[d - 1].tetrad : degs[d - 1].triad);
  function paint() {
    degs = harmonize(root, scale);
    if (views) $('[data-views]').innerHTML = U.chips('cview', views.map((v, i) => ({ v: i, label: v.label })), view);
    $('[data-grid]').innerHTML = degs.map((d, i) => `<button type="button" class="campo-deg fn-${d.fn}" data-deg="${i}">
      <span class="roman">${d.roman}</span><b>${prettyChord(tet ? d.tetrad : d.triad)}</b><span class="fn">${d.fn}</span>${CH.diagram(CH.get(tet ? d.tetrad : d.triad))}</button>`).join('');
    $('[data-progs]').innerHTML = U.chips('prog', progs().map((p, i) => ({ v: i, label: p.map(x => degs[x - 1].roman).join('–') })), pi);
    $('[data-bars]').innerHTML = chordsOf(progs()[pi]).map(c => `<li>${prettyChord(c)}</li>`).join('');
  }
  function restart() { if (player.running) player.start({ pattern, chords: chordsOf(progs()[pi]), bpm }); }
  host.addEventListener('click', e => {
    const chip = e.target.closest('[data-chips] .chip');
    if (chip) {
      const g = chip.parentElement.dataset.chips;
      if (g === 'tet') tet = chip.dataset.v === '1';
      if (g === 'prog') pi = +chip.dataset.v;
      if (g === 'pat') pattern = chip.dataset.v;
      if (g === 'cview') { view = +chip.dataset.v; scale = views[view].scale; pi = Math.min(pi, progs().length - 1); }
      paint(); restart(); return;
    }
    const d = e.target.closest('[data-deg]'); if (d) { CH.strum(tet ? degs[+d.dataset.deg].tetrad : degs[+d.dataset.deg].triad); return; }
    const b = e.target.closest('[data-act="play"]');
    if (b) { if (player.running) { player.stop(); b.textContent = '▶ Tocar progressão'; } else { player.start({ pattern, chords: chordsOf(progs()[pi]), bpm }); b.textContent = '■ Parar'; S.practiced(); } }
  });
  host.addEventListener('change', e => { if (e.target.matches('[data-root]')) { root = +e.target.value; paint(); restart(); } });
  host.addEventListener('input', e => { if (e.target.matches('[data-bpm]')) { bpm = +e.target.value; $('[data-bpmv]').textContent = bpm; player.setBpm(bpm); } });
  paint();
  return () => player.stop();
};

W.staff = (host, cfg = {}) => {
  const latin = () => U.set().latin;
  if (cfg.mode === 'melody') {
    const lk = lickById(cfg.lick), parsed = TAB.parse(lk.src);
    const flats = T.useFlats(T.pcOf(lk.key), T.SCALES[lk.scale]?.parent || 0);
    host.innerHTML = `<div class="staff-wrap" data-st>${STAFF.render(STAFF.fromTab(parsed), { flats })}</div>
      <div class="tab-scroll" data-tab></div>
      <div class="ctrl-row"><button type="button" class="btn primary" data-act="play">▶ Tocar</button>
        <label class="check"><input type="checkbox" data-hide id="staff-hide"> Esconder a tablatura</label></div>`;
    const hl = TAB.render(host.querySelector('[data-tab]'), parsed);
    const btn = host.querySelector('[data-act="play"]');
    const pl = TAB.Player({ onEvent(i) { hl(i); host.querySelectorAll('.rn-head.on').forEach(h => h.classList.remove('on')); host.querySelector(`.rn-head[data-n="${i}"]`)?.classList.add('on'); },
      onEnd() { btn.textContent = '▶ Tocar'; } });
    btn.addEventListener('click', () => { if (pl.playing) { pl.stop(); btn.textContent = '▶ Tocar'; } else { pl.play(parsed, { bpm: lk.bpm, click: true }); btn.textContent = '■ Parar'; S.practiced(); } });
    host.querySelector('[data-hide]').addEventListener('change', e => { host.querySelector('[data-tab]').hidden = e.target.checked; });
    return () => pl.stop();
  }
  const NAT = [0, 2, 4, 5, 7, 9, 11];
  const sets = { cordas123: [55, 67], primeira: [40, 67], acidentes: [40, 67] };
  const [lo, hi] = sets[cfg.set] || sets.primeira;
  const pool = []; for (let m = lo; m <= hi; m++) if (cfg.set === 'acidentes' || NAT.includes(T.mod(m))) pool.push(m);
  let cur = null, flats = false, streak = 0, best = 0, locked = false;
  host.innerHTML = `<div class="ctrl-row"><span class="pill" data-streak>Sequência: 0</span><span class="small" data-best></span></div>
    <div class="staff-wrap single" data-st></div>
    <div class="answers" data-ans></div>
    <p class="feedback" data-fbk aria-live="polite"></p>
    <div data-fb></div>`;
  const $ = s => host.querySelector(s);
  const fb = FB.create($('[data-fb]'));
  const opts = cfg.set === 'acidentes'
    ? T.ROOTS.map((r, i) => ({ v: i, label: T.noteName(i, false, latin()) + ([1, 3, 6, 8, 10].includes(i) ? ' / ' + T.noteName(i, true, latin()) : '') }))
    : NAT.map(i => ({ v: i, label: T.noteName(i, false, latin()) }));
  $('[data-ans]').innerHTML = opts.map(o => `<button type="button" class="btn ans" data-a="${o.v}">${o.label}</button>`).join('');
  function next() {
    locked = false;
    let m; do { m = pool[Math.floor(Math.random() * pool.length)]; } while (cur && m === cur.m && pool.length > 1);
    flats = cfg.set === 'acidentes' ? Math.random() < 0.5 : false;
    cur = { m };
    $('[data-st]').innerHTML = STAFF.render([{ midi: m }], { flats, width: 150 });
    $('[data-fbk]').textContent = ''; $('[data-fbk]').className = 'feedback';
    host.querySelectorAll('.ans').forEach(b => b.classList.remove('ok', 'bad'));
    fb.set(U.fbState({ frets: 5, marks: [] }));
  }
  host.addEventListener('click', e => {
    const a = e.target.closest('[data-a]'); if (!a || locked) return;
    locked = true;
    const ok = +a.dataset.a === T.mod(cur.m);
    a.classList.add(ok ? 'ok' : 'bad');
    streak = ok ? streak + 1 : 0; best = Math.max(best, streak);
    $('[data-streak]').textContent = `Sequência: ${streak}`; $('[data-best]').textContent = best ? `Melhor: ${best}` : '';
    const nm = T.noteName(cur.m, flats, latin()), pos = [];
    for (let s = 0; s < 6; s++) { const f = cur.m - T.TUNING[s]; if (f >= 0 && f <= 5) pos.push(T.mark(s, f, T.mod(cur.m))); }
    $('[data-fbk]').textContent = ok ? `Certo: ${nm}.` : `Era ${nm}.`;
    $('[data-fbk]').className = 'feedback ' + (ok ? 'ok' : 'bad');
    fb.set({ marks: pos.map(p => Object.assign(p, { role: 'r' })), labels: 'note' });
    A.play(cur.m, null, { dur: 1 });
    if (ok) S.practiced();
    setTimeout(next, ok ? 900 : 1800);
  });
  next();
};


/* ===== Trilha (por níveis) e aula ===== */
const V = {};
const MODS = () => MODULES.slice().sort((a, b) => (a.level || 9) - (b.level || 9) || (a.order || 0) - (b.order || 0));
const ALL_LESSONS = () => MODS().flatMap(m => m.lessons.map((l, li) => Object.assign({ mod: m, idx: li }, l)));
const levelOf = n => LEVELS.find(l => l.n === n);

function linkHref(l) {
  const map = { quiz:'#quiz-', treino:'#treino-', jam:'#jam-', licks:'#lick-', levadas:'#levadas-', aula:'#aula-' };
  if (map[l.to]) return l.id ? map[l.to] + l.id : '#' + (l.to === 'licks' ? 'licks' : l.to === 'levadas' ? 'levadas' : l.to);
  if (l.to === 'metronomo') return '#treino';
  return '#' + l.to;
}

function levelStats(n, st) {
  const ls = ALL_LESSONS().filter(l => l.mod.level === n);
  const lv = levelOf(n);
  const done = ls.filter(l => st.done[l.id]).length, goals = lv.goals.filter(g => (st.goals || {})[g.id]).length;
  return { ls, done, goals, total: ls.length + lv.goals.length, pct: (done + goals) / Math.max(1, ls.length + lv.goals.length) };
}

V.trilha = (el) => {
  const st = S.get(), all = ALL_LESSONS();
  const doneN = all.filter(l => st.done[l.id]).length;
  const next = all.find(l => !st.done[l.id]);
  const curLv = LEVELS.find(lv => levelStats(lv.n, st).pct < 1) || LEVELS[LEVELS.length - 1];
  el.innerHTML = `
    <section class="hero-strip">
      <div>
        <p class="eyebrow">Sua trilha · nível ${curLv.n} de ${LEVELS.length}</p>
        <h1>Do zero ao palco</h1>
        <p class="lede">${all.length} aulas em ${LEVELS.length} níveis. Cada nível termina com uma prova prática: quando você marcar tudo, está pronto para o próximo.</p>
      </div>
      <div class="stat-row">
        <div class="stat"><b>${doneN}<small>/${all.length}</small></b><span>aulas concluídas</span></div>
        <div class="stat"><b>${S.streak()}</b><span>${S.streak() === 1 ? 'dia seguido' : 'dias seguidos'}</span></div>
        ${next ? `<a class="btn primary big" href="#aula-${next.id}">${doneN ? 'Continuar' : 'Começar'}: ${U.esc(next.title)} →</a>` : `<span class="pill ok">Trilha completa</span>`}
      </div>
    </section>
    <nav class="level-nav" aria-label="Níveis">${LEVELS.map(lv => { const s = levelStats(lv.n, st);
      return `<a href="#nivel-${lv.n}" class="${lv.n === curLv.n ? 'on' : ''}"><b>${lv.n}</b><span>${lv.title}</span><i style="--p:${Math.round(s.pct * 100)}%"></i></a>`; }).join('')}</nav>
    ${LEVELS.map(lv => {
      const s = levelStats(lv.n, st);
      const mods = MODS().filter(m => m.level === lv.n);
      return `<section class="level" id="nivel-${lv.n}">
        <header class="level-head"><div><p class="eyebrow">Nível ${lv.n}</p><h2>${lv.title}</h2><p class="small">${lv.sub}</p></div>
          <span class="pill ${s.pct >= 1 ? 'ok' : ''}">${Math.round(s.pct * 100)}%</span></header>
        <div class="modules">${mods.map(m => {
          const d = m.lessons.filter(l => st.done[l.id]).length;
          return `<section class="module">
            <header><span class="mod-n">${m.tag}</span><span class="tag">${d}/${m.lessons.length}</span></header>
            <h3>${m.title}</h3>
            <div class="bar"><i style="width:${d / m.lessons.length * 100}%"></i></div>
            <ol class="lessons">${m.lessons.map((l, li) => `<li><a href="#aula-${l.id}" class="${st.done[l.id] ? 'done' : ''}">
              <span class="ln">${li + 1}</span><span class="lt">${l.title}</span><span class="lm">${l.min} min</span><span class="ck"></span></a></li>`).join('')}</ol>
          </section>`; }).join('')}</div>
        <div class="goals panel"><p class="eyebrow">Prova do nível ${lv.n}</p>
          <ul>${lv.goals.map(g => `<li><label class="check"><input type="checkbox" data-goal="${g.id}" id="goal-${g.id}" ${(st.goals || {})[g.id] ? 'checked' : ''}> <span>${g.text}</span></label>${g.href ? ` <a href="${g.href}">treinar →</a>` : ''}</li>`).join('')}</ul>
          <p class="small">Marque só quando conseguir de verdade, sem errar.</p></div>
      </section>`; }).join('')}`;
  el.addEventListener('change', e => {
    const g = e.target.dataset.goal; if (!g) return;
    S.update(s => { s.goals = s.goals || {}; if (e.target.checked) s.goals[g] = S.today(); else delete s.goals[g]; });
    if (e.target.checked) { S.practiced(); U.toast('Meta cumprida!'); }
  });
  el.addEventListener('click', e => {
    const a = e.target.closest('.level-nav a'); if (!a) return;
    e.preventDefault(); el.querySelector(a.getAttribute('href'))?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
};

V.lesson = (el, id) => {
  const all = ALL_LESSONS();
  const idx = all.findIndex(l => l.id === id);
  if (idx < 0) { location.hash = '#trilha'; return; }
  const L = all[idx], prev = all[idx - 1], next = all[idx + 1];
  const demo0 = L.demo || { kind: 'none' };
  const widget = W[demo0.kind];
  const lv = levelOf(L.mod.level) || { n: '', title: '' };
  let view = 0, root = demo0.root != null ? T.pcOf(demo0.root) : null;
  let labelsMode = demo0.labels || (['natural', 'note'].includes(demo0.kind) ? 'note' : 'iv');

  el.innerHTML = `
    <nav class="crumbs"><a href="#trilha">Trilha</a><span>›</span><a href="#trilha">Nível ${lv.n} · ${lv.title}</a><span>›</span><span>${L.mod.title}</span></nav>
    <article class="lesson">
      <header class="lesson-head">
        <p class="eyebrow">Aula ${L.idx + 1} de ${L.mod.lessons.length} · ${L.min} min</p>
        <h1>${L.title}</h1>
      </header>
      <div class="prose">${L.body}</div>
    </article>
    ${widget ? (demo0.kind === 'none' ? '' : `<section class="panel demo" data-widget></section>`) : `<section class="panel demo">
      <div class="ctrl-row" data-demo-ctrl></div>
      <div data-fb></div>
      <p class="caption" data-caption></p>
      <div data-legend></div>
    </section>`}
    ${L.lick && demo0.kind !== 'lick' ? `<section class="panel"><p class="eyebrow">Lick da aula</p><div data-lick></div></section>` : ''}
    ${demo0.kind === 'lick' ? `<section class="panel"><div data-lick></div></section>` : ''}
    <section class="practice">
      <h2>Pratique</h2>
      <ul class="tasks">${(L.tasks || []).map(t => `<li>${t}</li>`).join('')}</ul>
      ${L.links ? `<div class="links">${L.links.map(l => `<a class="btn" href="${linkHref(l)}">${l.label} →</a>`).join('')}</div>` : ''}
    </section>
    <footer class="lesson-foot">
      ${prev ? `<a class="btn ghost" href="#aula-${prev.id}">← ${U.esc(prev.title)}</a>` : '<span></span>'}
      <button type="button" class="btn ${S.get().done[L.id] ? 'ok' : 'primary'}" data-act="done">${S.get().done[L.id] ? '✓ Concluída' : 'Marcar como concluída'}</button>
      ${next ? `<a class="btn ghost" href="#aula-${next.id}">${U.esc(next.title)} →</a>` : '<span></span>'}
    </footer>`;

  const cleanups = [];
  let fb = null, lp = null;
  if (widget) {
    const host = el.querySelector('[data-widget]');
    if (host) { const c = widget(host, demo0); if (typeof c === 'function') cleanups.push(c); }
  } else {
    fb = FB.create(el.querySelector('[data-fb]'));
  }
  const lickHost = el.querySelector('[data-lick]');

  function cfg() {
    const v = (demo0.views || [])[view] || {};
    const c = Object.assign({}, demo0, v);
    if (root != null && demo0.keySel) c.root = root;
    if (v.labels) labelsMode = v.labels;
    return c;
  }

  function draw() {
    if (!fb) return;
    const c = cfg();
    const d = U.buildDemo(c);
    const ctrl = el.querySelector('[data-demo-ctrl]');
    const views = demo0.views ? U.chips('view', demo0.views.map((v, i) => ({ v: i, label: v.label })), view) : '';
    const keySel = demo0.keySel ? `<label class="field">Tom <select data-root id="lesson-root">${U.rootOptions(T.pcOf(c.root))}</select></label>` : '';
    const lab = demo0.kind !== 'natural' && demo0.kind !== 'lick' ? U.chips('labels', [{ v: 'iv', label: 'Intervalos' }, { v: 'note', label: 'Notas' }], labelsMode) : '';
    ctrl.innerHTML = `${views}<div class="ctrl-right">${keySel}${lab}${demo0.kind !== 'lick' ? '<button type="button" class="btn" data-act="hear">♪ Ouvir</button>' : ''}</div>`;
    fb.set(U.fbState({ marks: d.marks, labels: demo0.kind === 'natural' ? 'note' : labelsMode, flats: d.flats, frets: d.frets,
      onPick: (s, f) => { A.play(T.pitch(s, f), null, { dur: 1.2, string: s }); fb.setActive([s + ':' + f]); } }));
    el.querySelector('[data-caption]').textContent = d.caption;
    el.querySelector('[data-legend]').innerHTML = U.legend(demo0.kind);
    draw.demo = d;
  }
  draw();

  if (lickHost) {
    const lk = lickById(L.lick || demo0.lick);
    if (!fb) {
      const fbHost = document.createElement('div');
      lickHost.before(fbHost);
      fb = FB.create(fbHost);
      const d = U.buildDemo({ kind: 'lick', lick: lk.id });
      fb.set(U.fbState({ marks: d.marks, labels: 'iv', flats: d.flats, frets: d.frets }));
    }
    lp = U.lickPanel(lickHost, lk, fb, {
      idSuffix: '-aula',
      onPlay() {
        if (demo0.kind !== 'lick' && !widget) {
          const d = U.buildDemo({ kind: 'lick', lick: lk.id });
          fb.set({ marks: d.marks, labels: labelsMode, flats: d.flats, frets: d.frets });
        }
      },
    });
  }

  el.addEventListener('click', e => {
    const chip = e.target.closest('[data-chips="view"] .chip, [data-chips="labels"] .chip');
    if (chip && fb && !widget) {
      const g = chip.parentElement.dataset.chips;
      if (g === 'view') view = +chip.dataset.v;
      if (g === 'labels') labelsMode = chip.dataset.v;
      draw(); return;
    }
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'hear' && draw.demo) U.playDemo(draw.demo);
    if (act === 'done') {
      const was = !!S.get().done[L.id];
      S.update(s => { if (was) delete s.done[L.id]; else s.done[L.id] = S.today(); });
      S.practiced();
      const b = e.target.closest('[data-act]');
      b.className = 'btn ' + (was ? 'primary' : 'ok');
      b.textContent = was ? 'Marcar como concluída' : '✓ Concluída';
      if (!was) U.toast(next ? `Aula concluída. Próxima: ${next.title}` : 'Trilha completa!');
    }
  });
  el.addEventListener('change', e => {
    if (e.target.matches('[data-root]')) { root = +e.target.value; draw(); }
  });
  return () => { cleanups.forEach(c => c()); lp && lp.stop(); A.stopAll(); };
};

    const rows = [];
    rows.push(`<div class="ctrl-row"><label class="field">Tom <select data-k="root" id="exp-root">${U.rootOptions(e.root)}</select></label>
      ${U.chips('type', [{ v:'scale', label:'Escalas' }, { v:'triad', label:'Tríades' }, { v:'caged', label:'CAGED' }, { v:'chord', label:'Arpejos' }, { v:'note', label:'Uma nota' }], e.type)}</div>`);
    if (e.type === 'scale') {
      const n = T.positionsCount(e.scale);
      rows.push(`<div class="ctrl-row"><label class="field">Escala <select data-k="scale" id="exp-scale">${Object.entries(T.SCALES).map(([k, s]) => `<option value="${k}" ${k === e.scale ? 'selected' : ''}>${s.name}</option>`).join('')}</select></label>
        ${U.chips('pos', [{ v:-1, label:'Braço' }].concat(Array.from({ length:n }, (_, i) => ({ v:i, label:(sc.sys === 'box' ? 'Caixa ' : 'Pos. ') + (i + 1) }))), e.pos)}</div>`);
    }
    if (e.type === 'triad') {
      rows.push(`<div class="ctrl-row">${U.chips('quality', ['maior', 'menor', 'dim', 'aum'].map(q => ({ v:q, label:T.CHORDS[q].name })), e.quality)}
        ${U.chips('set', T.STRING_SETS.map(s => ({ v:s.id, label:s.label })), e.set)}
        ${U.chips('inv', [{ v:-1, label:'Todas' }, { v:0, label:'Fundamental' }, { v:1, label:'1ª inv.' }, { v:2, label:'2ª inv.' }], e.inv)}</div>`);
    }
    if (e.type === 'caged') {
      rows.push(`<div class="ctrl-row">${U.chips('quality', [{ v:'maior', label:'Maior' }, { v:'menor', label:'Menor' }], e.quality === 'menor' ? 'menor' : 'maior')}
        ${U.chips('shape', [{ v:'all', label:'Todas' }, ...['C', 'A', 'G', 'E', 'D'].map(k => ({ v:k, label:'Forma ' + k }))], e.shape)}
        ${e.shape !== 'all' ? U.chips('layer', [{ v:'chord', label:'Acorde' }, { v:'arp', label:'Arpejo' }, { v:'pent', label:'Pentatônica' }], e.layer) : ''}</div>`);
    }
    if (e.type === 'chord') {
      rows.push(`<div class="ctrl-row"><label class="field">Acorde <select data-k="chord" id="exp-chord">${Object.entries(T.CHORDS).map(([k, c]) => `<option value="${k}" ${k === e.chord ? 'selected' : ''}>${c.name}</option>`).join('')}</select></label></div>`);
    }
    rows.push(`<div class="ctrl-row">${U.chips('labels', [{ v:'iv', label:'Intervalos' }, { v:'note', label:'Notas' }, { v:'none', label:'Sem rótulo' }], e.labels)}
      <button type="button" class="btn" data-act="hear">♪ Ouvir</button></div>`);
    el.querySelector('[data-ctrl]').innerHTML = rows.join('');
  }

  function info(c, d) {
    const st = U.set();
    let ivs = [], title = '';
    if (c.kind === 'scale') { ivs = T.SCALES[c.scale].iv; title = T.SCALES[c.scale].name; }
    else if (c.kind === 'triad' || c.kind === 'caged') { ivs = T.CHORDS[c.quality].iv; title = 'Tríade ' + T.CHORDS[c.quality].name.toLowerCase(); }
    else if (c.kind === 'chord') { ivs = T.CHORDS[c.chord].iv; title = 'Arpejo ' + T.CHORDS[c.chord].name.toLowerCase(); }
    else { ivs = [0]; title = 'Nota'; }
    const cells = ivs.map(iv => `<div class="deg iv-${T.IV_ROLE[iv]}"><b>${T.noteName(c.root + iv, d.flats, st.latin)}</b><span>${T.ivLabel(iv)}</span></div>`).join('');
    el.querySelector('[data-info]').innerHTML = `
      <div class="panel"><p class="eyebrow">${title} de ${T.rootName(c.root, st.latin)}</p><div class="degrees">${cells}</div>
      <p class="small">Fórmula: ${ivs.map(T.ivLabel).join(' – ')}</p></div>
      <div class="panel"><p class="eyebrow">Como estudar</p><p class="small">${tip(c)}</p></div>`;
  }

  function tip(c) {
    if (c.kind === 'scale' && c.pos < 0) return 'Com o braço inteiro aceso, escolha uma corda e toque a escala só nela, de uma ponta à outra. Depois volte para as posições.';
    if (c.kind === 'scale') return 'Toque a posição subindo e descendo com metrônomo. Depois esconda os rótulos e tente tocar só as tônicas.';
    if (c.kind === 'triad') return 'Escolha “Todas” e toque as inversões em sequência pelo braço. Depois troque só a qualidade (maior/menor) e veja qual nota anda.';
    if (c.kind === 'caged') return 'Passe pelas formas na ordem em que aparecem no braço. Em cada forma, ache a tônica nas cordas 6, 5 e 4.';
    if (c.kind === 'chord') return 'Arpejos de 4 notas (7, 7M, m7) são o próximo passo depois das tríades: eles soam “jazz” e “soul” no solo.';
    return 'Use os desenhos de oitava para ligar as posições da nota. Esconda os rótulos e tente prever onde está a próxima.';
  }

  function draw() {
    controls();
    const c = cfg();
    let d;
    if (c.kind === 'chord') {
      const ch = T.CHORDS[c.chord];
      d = { marks: T.allNotes(ch.iv, c.root, U.set().frets), flats: T.useFlats(c.root, ch.iv.includes(3) ? 3 : 0), caption: `Arpejo de ${T.chordName(c.root, c.chord, U.set().latin)} no braço inteiro.`, seq: 'run' };
    } else d = U.buildDemo(c);
    fb.set(U.fbState({ marks: d.marks, labels: EXP.labels, flats: d.flats,
      onPick: (s, f) => { A.play(T.pitch(s, f), null, { dur: 1.2, string: s }); fb.setActive([s + ':' + f]); } }));
    el.querySelector('[data-caption]').textContent = d.caption;
    el.querySelector('[data-legend]').innerHTML = U.legend(c.kind);
    info(c, d);
    draw.d = d;
  }
  draw();

  el.addEventListener('click', e => {
    const chip = e.target.closest('[data-chips] .chip');
    if (chip) {
      const g = chip.parentElement.dataset.chips, v = chip.dataset.v;
      if (['pos', 'inv'].includes(g)) EXP[g] = +v; else EXP[g] = v;
      if (g === 'type' && v === 'caged' && !['maior', 'menor'].includes(EXP.quality)) EXP.quality = 'maior';
      draw(); return;
    }
    if (e.target.closest('[data-act="hear"]')) U.playDemo(draw.d);
  });
  el.addEventListener('change', e => {
    const k = e.target.dataset.k;
    if (!k) return;
    EXP[k] = k === 'root' ? +e.target.value : e.target.value;
    if (k === 'scale') EXP.pos = Math.min(EXP.pos, T.positionsCount(EXP.scale) - 1);
    draw();
  });
  return () => A.stopAll();
};

/* ===== Hoje: plano do dia, cronômetro e semana ===== */
const HOJE_EXTRA = [];   // outras partes da tela (desafio do dia, XP) se registram aqui

V.hoje = (el) => {
  const st = S.get(), plan = PLAN.today(st), lv = levelOf(PLAN.currentLevel(st));
  const bl = PLAN.blocks(plan.mins, st);
  const doneMin = bl.filter(b => plan.done[b.id]).reduce((a, b) => a + b.min, 0);
  const dfmt = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const week = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); week.push({ d, k: dfmt(d), m: st.minutes[dfmt(d)] || 0 }); }
  const weekTotal = Math.round(week.reduce((a, w) => a + w.m, 0));
  const goal = st.settings.weekGoal || 150;
  const maxM = Math.max(goal / 5, ...week.map(w => w.m), 1);
  const dias = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  el.innerHTML = `
    <header class="page-head"><p class="eyebrow">Hoje · nível ${lv.n} · ${lv.title}</p>
      <h1>${doneMin >= plan.mins ? 'Treino do dia completo' : 'Seu treino de hoje'}</h1>
      <p class="lede">Uma rotina montada para o seu nível. Comece um bloco: o cronômetro fica no topo da tela enquanto você abre o exercício.</p></header>
    <section class="panel">
      <div class="ctrl-row"><span class="small">Tempo disponível:</span>${U.chips('mins', [15, 30, 45, 60, 90].map(m => ({ v: m, label: m + ' min' })), plan.mins)}
        <button type="button" class="btn ghost" data-act="free">⏱ Prática livre</button></div>
      <ol class="plan">${bl.map((b, i) => `<li class="${plan.done[b.id] ? 'done' : ''}">
        <span class="pl-n">${i + 1}</span>
        <div class="pl-body"><b>${b.title}</b><span>${U.esc(b.desc)}</span></div>
        <span class="pl-min">${b.min} min</span>
        ${plan.done[b.id] ? '<span class="pill ok">Feito</span>' : `<button type="button" class="btn primary" data-start="${b.id}">▶ Começar</button>`}
      </li>`).join('')}</ol>
      <div class="bar wide"><i style="width:${Math.min(100, doneMin / plan.mins * 100)}%"></i></div>
      <p class="small">${doneMin} de ${plan.mins} minutos do plano de hoje.</p>
    </section>
    <div data-extra class="info-grid"></div>
    <section class="panel"><p class="eyebrow">Esta semana</p>
      <div class="week">${week.map(w => `<div class="wk ${w.k === S.today() ? 'today' : ''}"><i style="height:${Math.round(w.m / maxM * 100)}%"></i><b>${Math.round(w.m)}</b><span>${dias[w.d.getDay()]}</span></div>`).join('')}</div>
      <div class="ctrl-row"><span><b>${weekTotal}</b> de <b>${goal}</b> minutos na semana</span>
        <label class="field">Meta semanal <select data-goal id="week-goal">${[60, 90, 150, 210, 300, 420].map(g => `<option value="${g}" ${g === goal ? 'selected' : ''}>${g} min</option>`).join('')}</select></label></div>
      <p class="small">Dica de estudo: pouco todo dia rende mais que muito de vez em quando. 20 minutos diários com foco valem mais que 3 horas no domingo.</p>
    </section>`;
  HOJE_EXTRA.forEach(fn => { try { fn(el.querySelector('[data-extra]')); } catch (e) { console.error(e); } });
  el.addEventListener('click', e => {
    const chip = e.target.closest('[data-chips="mins"] .chip');
    if (chip) { PLAN.setMins(+chip.dataset.v); APP.rerender(); return; }
    const b = e.target.closest('[data-start]');
    if (b) { const blk = bl.find(x => x.id === b.dataset.start); PT.start({ id: blk.id, label: blk.title, minutes: blk.min }); S.practiced(); location.hash = blk.href; return; }
    if (e.target.closest('[data-act="free"]')) { PT.start({ free: true }); U.toast('Cronômetro livre ligado: ele fica no topo da tela'); }
  });
  el.addEventListener('change', e => { if (e.target.matches('[data-goal]')) { S.update(s => { s.settings.weekGoal = +e.target.value; }); APP.rerender(); } });
};
