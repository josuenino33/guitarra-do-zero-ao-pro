MODULES.push(
  { id:'m0', level:1, order:1, title:'Primeiros passos', tag:'Do zero', lessons:[
    { id:'conhecendo', title:'Conhecendo a guitarra e o amplificador', min:8,
      body:`<p>A guitarra elétrica não tem caixa acústica: o som vem dos <b>captadores</b>, ímãs embaixo das cordas que transformam a vibração em sinal elétrico. Esse sinal vai pelo <b>cabo</b> até o <b>amplificador</b>.</p>
<ul><li><b>Captadores</b>: <i>single coil</i> (som brilhante, estalado) ou <i>humbucker</i> (som mais grosso, sem chiado). A <b>chave seletora</b> escolhe qual soa: o do braço é mais suave, o da ponte é mais agudo e agressivo.</li>
<li><b>Volume e tonalidade</b> na guitarra: o tone fechado tira agudos.</li>
<li><b>Tarraxas</b> afinam; a <b>ponte</b> segura as cordas e às vezes tem alavanca.</li></ul>
<p>No amplificador, comece no canal <b>limpo</b>: ganho em 3, graves, médios e agudos em 5, e suba o volume aos poucos. O <b>ganho</b> (ou drive) é o que distorce. Muito ganho esconde erros, então estude bastante no limpo.</p>`,
      demo:{ kind:'none' },
      tasks:['Ache na sua guitarra: captadores, chave seletora, volume, tone, tarraxas e ponte.','Ligue o amplificador com volume no zero, depois ajuste ganho 3 e equalização em 5.','Teste as posições da chave seletora tocando a mesma corda.'] },
    { id:'postura', title:'Postura, palheta e as duas mãos', min:12,
      body:`<p><b>Postura</b>: sentado, a guitarra apoiada na perna direita, costas retas, ombros soltos. Em pé, ajuste a correia para a guitarra ficar na mesma altura de quando você está sentado.</p>
<p><b>Mão esquerda</b>: polegar atrás do braço, mais ou menos na direção do dedo médio. Aperte com a <b>ponta dos dedos</b>, logo atrás do traste (não em cima nem no meio da casa). Unhas curtas.</p>
<p><b>Palheta</b>: segure entre o polegar e a lateral do indicador, deixando só a pontinha para fora. O movimento vem do <b>pulso</b>, pequeno e relaxado, não do braço inteiro.</p>
<p>Os dois exercícios abaixo treinam exatamente isso: cordas soltas com palhetada alternada e um dedo por casa.</p>`,
      demo:{ kind:'lick', lick:'ex-soltas' }, lick:'ex-soltas',
      tasks:['Cordas soltas: 4 palhetadas em cada corda, da 6 para a 1, a 60 BPM.','Dedos 1-2-3-4 nas casas 5-6-7-8 da corda 1, depois em todas as cordas.','Confira: o polegar está atrás do braço e o pulso está relaxado?'],
      links:[{ to:'treino', id:'ex-1234', label:'Exercício 1-2-3-4 com metrônomo' }] },
    { id:'afinar', title:'Afinando a guitarra', min:8,
      body:`<p>Toda vez que pegar a guitarra, <b>afine antes</b>. Uma guitarra desafinada faz até os acordes certos soarem errados.</p>
<p>A afinação padrão é <b>Mi Lá Ré Sol Si Mi</b> (E A D G B E), da corda 6 para a 1. Use o afinador abaixo: toque uma corda solta, deixe soar e gire a tarraxa até o ponteiro ficar no centro.</p>
<ul><li>Se a nota estiver <b>baixa</b> (ponteiro à esquerda), aperte a corda.</li>
<li>Sempre chegue na nota <b>de baixo para cima</b>: se passou, afrouxe um pouco e suba de novo. Assim a corda segura a afinação.</li></ul>
<p>Sem microfone? Use os tons de referência e afine de ouvido, comparando o som.</p>`,
      demo:{ kind:'tuner' },
      tasks:['Afine as 6 cordas usando o afinador.','Desafine uma corda de propósito e afine de novo de ouvido, usando o tom de referência.'],
      links:[{ to:'afinador', label:'Abrir o afinador completo' }] },
    { id:'acordes-abertos', title:'Primeiros acordes: Em, E, Am, A, D e Dm', min:15,
      body:`<p>Como ler o diagrama: as linhas verticais são as cordas (a corda 6 fica à esquerda), as horizontais são os trastes. A bolinha mostra onde apertar e o número é o <b>dedo</b> (1 indicador, 2 médio, 3 anelar, 4 mínimo). <b>○</b> = corda solta, <b>×</b> = não tocar.</p>
<p>Monte o acorde, toque <b>corda por corda</b> e ouça se cada uma soa limpa. Se alguma abafa, arqueie mais os dedos ou aproxime-os do traste. Clique em cada diagrama para ouvir como deve soar.</p>
<p>Comece por <b>Em</b> e <b>E</b>: só dois ou três dedos e todas as cordas soando. Repare que de Em para E muda um dedo só. O mesmo vale para Am → A e Dm → D.</p>`,
      demo:{ kind:'chords', chords:['Em','E','Am','A','D','Dm'] },
      tasks:['Monte cada acorde e toque corda por corda até todas soarem.','Alterne Em ↔ E e Am ↔ A, quatro batidas cada.'],
      links:[{ to:'trocas', label:'Treino de trocas de acordes' }] },
    { id:'acordes-abertos-2', title:'G, C e os acordes com sétima', min:15,
      body:`<p><b>G</b> e <b>C</b> completam os acordes abertos mais usados. Com Em, Am, D e eles, você já toca centenas de músicas.</p>
<p>Os acordes com <b>sétima</b> (E7, A7, D7, G7, B7) têm um som de “quero resolver” e são a base do blues. Repare que E7 é o E com um dedo a menos.</p>
<p>No G, existem duas digitações comuns. A deste app (dedos 2, 1 e 3) é a mais fácil de trocar para C e Em.</p>`,
      demo:{ kind:'chords', chords:['G','C','E7','A7','D7','G7','B7'] },
      tasks:['Monte G e C até soarem limpos.','Toque E7, A7 e B7 em sequência: é a base de um blues em Mi.'] },
    { id:'trocas', title:'Trocando de acordes sem parar', min:15,
      body:`<p>O que separa “sei os acordes” de “toco a música” é a <b>troca</b>. O método do minuto funciona muito bem:</p>
<ul><li>Escolha um par de acordes, ligue o cronômetro de 1 minuto e troque o máximo de vezes que conseguir, tocando uma vez cada.</li>
<li>Anote o recorde. Faça três pares por dia. Em poucas semanas você passa de 10 para 40 trocas por minuto.</li></ul>
<p>Dicas: levante todos os dedos <b>juntos</b>, como um bloco. Use <b>dedos-âncora</b>: de C para Am o dedo 1 e o 2 não saem do lugar. Olhe para o próximo acorde antes de trocar.</p>`,
      demo:{ kind:'changes', pairs:[['Em','Am'],['E','A'],['A','D'],['D','G'],['G','C'],['C','Am'],['Em','C'],['G','D']] },
      tasks:['3 pares por dia, 1 minuto cada.','Meta do nível 1: 30 trocas por minuto entre G e C.'] },
    { id:'primeira-musica', title:'Sua primeira música: “Estrada de Terra”', min:20,
      body:`<p>Uma música feita para este app com os quatro acordes mais usados do pop: <b>G, Em, C e D</b>. Cada acorde dura um compasso (4 tempos).</p>
<p>Comece com a levada de uma batida por tempo (↓ ↓ ↓ ↓). Quando as trocas estiverem no tempo, passe para a levada pop. Se a troca atrasar, diminua o BPM: é melhor tocar devagar sem parar do que rápido aos trancos.</p>`,
      demo:{ kind:'song', song:'estrada' },
      tasks:['Toque só a sequência G–Em–C–D com uma batida por tempo a 60 BPM.','Toque a música inteira com a levada pop.','Cante junto (mesmo baixinho): ajuda a manter o tempo.'] },
  ]},
  { id:'r1', level:1, order:2, title:'Ritmo 1', tag:'Mão direita', lessons:[
    { id:'pulso', title:'Pulso, tempo e compasso', min:10,
      body:`<p>Toda música tem um <b>pulso</b>, a batida que você marca com o pé sem pensar. A velocidade do pulso é medida em <b>BPM</b> (batidas por minuto).</p>
<p>Os pulsos se agrupam em <b>compassos</b>. O mais comum é o de 4 tempos (4/4): conte <b>1 2 3 4</b>, com o 1 um pouco mais forte. Dividindo cada tempo em dois, a contagem vira <b>1 e 2 e 3 e 4 e</b>.</p>
<p>Abaixo, ouça cada ritmo e depois toque junto batendo no botão (ou na barra de espaço). O app mede sua precisão.</p>`,
      demo:{ kind:'rhythm', lv:[1] },
      tasks:['Bata o pé junto com o metrônomo a 60, 80 e 100 BPM.','Toque junto os ritmos do nível 1 até passar de 80% de precisão.'],
      links:[{ to:'metronomo', label:'Abrir o metrônomo' }] },
    { id:'baixo-cima', title:'Para baixo e para cima: a mão não para', min:12,
      body:`<p>A regra de ouro do ritmo no violão e na guitarra: a mão direita é um <b>pêndulo</b>. Ela desce nos números (1, 2, 3, 4) e sobe nos “e”, <b>sempre</b>, mesmo quando não toca as cordas.</p>
<p>Comece em colcheias: ↓↑↓↑↓↑↓↑. A batida para baixo pega todas as cordas; a para cima pega só as mais agudas e é mais leve. Use pouca força e deixe a palheta passar solta.</p>`,
      demo:{ kind:'strum', pattern:'colcheias', chords:['Em','Em','G','G'], views:[{ label:'Uma por tempo', pattern:'semi' },{ label:'Colcheias', pattern:'colcheias' }] },
      tasks:['Colcheias em Em a 60 BPM por 2 minutos sem parar.','Faça a mão passar no ar nas batidas “-” sem tocar as cordas.'],
      links:[{ to:'levadas', id:'colcheias', label:'Treinar no treinador de levadas' }] },
    { id:'levada-pop', title:'A levada pop: ↓ ↓↑ ↑↓↑', min:15,
      body:`<p>A levada mais usada no pop, no louvor e na MPB: <b>↓ - ↓ ↑ - ↑ ↓ ↑</b>. Contando: <b>1 . 2 e . e 4 e</b>. Nos espaços a mão continua o pêndulo, só não encosta nas cordas.</p>
<p>Ela tem uma <b>síncope</b>: a batida do tempo 3 é “pulada”, e é isso que dá o balanço. Fale a contagem em voz alta enquanto toca até ficar automática.</p>`,
      demo:{ kind:'strum', pattern:'pop', chords:['G','D','Em','C'] },
      tasks:['A levada num acorde só (Em) a 70 BPM.','Depois com a sequência G–D–Em–C, trocando no tempo 1.'],
      links:[{ to:'levadas', id:'pop', label:'Treinador de levadas: pop' }] },
    { id:'dinamica', title:'Dinâmica e acentos', min:10,
      body:`<p>Tocar sempre com a mesma força deixa o som chapado. <b>Dinâmica</b> é variar o volume: verso mais baixo, refrão mais forte.</p>
<p><b>Acento</b> é uma batida mais forte que as outras. No rock, os tempos <b>2 e 4</b> recebem acento junto com a caixa da bateria (o <i>backbeat</i>). Experimente a levada de colcheias só para baixo acentuando o 1 e o 3, depois o 2 e o 4, e sinta a diferença.</p>`,
      demo:{ kind:'strum', pattern:'rock', chords:['E','A','D','A'], views:[{ label:'Rock', pattern:'rock' },{ label:'Shuffle', pattern:'shuffle', chords:['A7','D7','A7','E7'] }] },
      tasks:['Toque o verso piano (fraco) e o refrão forte de “Estrada de Terra”.','Colcheias só para baixo com acento no 2 e no 4.'] },
  ]},
  { id:'l1', level:1, order:3, title:'Leitura 1', tag:'Tablatura e cifra', lessons:[
    { id:'ler-tab', title:'Lendo tablatura', min:10,
      body:`<p>A <b>tablatura</b> mostra onde tocar. São 6 linhas, uma para cada corda: a de <b>cima é a corda 1</b> (Mi agudo) e a de baixo é a corda 6. O número é a casa (0 = corda solta). Leia da esquerda para a direita; números empilhados são tocados juntos.</p>
<p>Os símbolos usados neste app:</p>
<ul><li><b>h</b> hammer-on, <b>p</b> pull-off, <b>/</b> e <b>\\</b> slide, <b>7b9</b> bend da casa 7 até soar como a 9, <b>r</b> release, <b>~</b> vibrato, <b>x</b> nota abafada, <b>PM</b> palm mute.</li>
<li>A linha de cima mostra a contagem (<b>1 e 2 e</b>), para você saber o ritmo.</li></ul>`,
      demo:{ kind:'lick', lick:'ex-melodia' }, lick:'ex-melodia',
      tasks:['Toque a melodia da tablatura bem devagar, falando a contagem.','Abra três licks da biblioteca e leia só os símbolos.'],
      links:[{ to:'licks', id:'r2', label:'Lick com bend e vibrato' }] },
    { id:'ler-cifra', title:'Lendo cifra', min:12,
      body:`<p>A <b>cifra</b> é a forma mais comum de escrever músicas no Brasil: a letra com o nome dos acordes em cima da sílaba onde eles entram. O nome do acorde segue um padrão:</p>
<ul><li>Letra = tônica (C Dó, D Ré, E Mi, F Fá, G Sol, A Lá, B Si). Sozinha = acorde <b>maior</b>.</li>
<li><b>m</b> = menor (Am). <b>7</b> = sétima (A7). <b>7M</b> = sétima maior (C7M). <b>m7</b> = menor com sétima.</li>
<li><b>sus4</b>, <b>sus2</b> = a terça troca pela 4ª ou 2ª. <b>add9</b> = acrescenta a nona. <b>°</b> = diminuto. <b>ø</b> ou <b>m7(b5)</b> = meio-diminuto. <b>5</b> = power chord.</li>
<li><b>C/E</b> = acorde de Dó com a nota Mi no baixo.</li></ul>
<p>Clique nos acordes da cifra abaixo para ver o diagrama.</p>`,
      demo:{ kind:'cifra', song:'estrada', symbols:true },
      tasks:['Leia a cifra e diga o nome de cada acorde em voz alta.','Procure uma música que você gosta numa cifra e identifique os símbolos.'] },
  ]},
  { id:'pestana', level:2, order:3, title:'Acordes com pestana', tag:'Formas móveis', lessons:[
    { id:'pestana-f', title:'A pestana: F e Bm', min:20,
      body:`<p>Na <b>pestana</b>, o dedo 1 aperta várias cordas na mesma casa. É difícil no começo para todo mundo; a força vem com algumas semanas.</p>
<ul><li>Use a <b>lateral</b> do dedo 1, um pouco virada para o lado do polegar, bem perto do traste.</li>
<li>O polegar desce para o meio das costas do braço. Puxe com o braço, não esmague com a mão.</li>
<li>Monte primeiro só a pestana e toque corda por corda; depois coloque os outros dedos.</li></ul>`,
      demo:{ kind:'chords', chords:['F','Bm','F7M','Dm'] },
      tasks:['30 segundos montando e soltando a pestana do F, descansando a mão entre as séries.','Troque C → F e Am → Bm.'] },
    { id:'formas-moveis', title:'Formas móveis: E e A', min:20,
      body:`<p>A pestana transforma os acordes abertos E e A em <b>formas móveis</b>: o mesmo desenho, em qualquer casa, vira outro acorde.</p>
<ul><li><b>Forma de E</b>: tônica na corda 6. Na casa 3 é Sol, na 5 é Lá, na 8 é Dó.</li>
<li><b>Forma de A</b>: tônica na corda 5. Na casa 3 é Dó, na 5 é Ré, na 7 é Mi.</li></ul>
<p>Com as notas das cordas 6 e 5 decoradas, você toca qualquer acorde maior, menor ou com sétima. É o começo do sistema CAGED.</p>`,
      demo:{ kind:'chords', chords:['G@E','A@E','Gm@E','A7@E','C@A','D@A','Cm@A','D7@A'] },
      tasks:['Toque Sol, Lá e Dó na forma de E, depois na forma de A.','Toque G–Em–C–D só com pestanas.'],
      links:[{ to:'quiz', id:'qual-nota', label:'Quiz das notas nas cordas 6 e 5' }] },
  ]},
  { id:'r2', level:2, order:4, title:'Ritmo 2', tag:'Levadas por estilo', lessons:[
    { id:'abafado', title:'Abafamento e chuck', min:15,
      body:`<p>O <b>chuck</b> (✕) é uma batida abafada: a mão esquerda afrouxa a pressão (sem tirar os dedos das cordas) ou a palma da mão direita encosta nas cordas no momento da batida. O som fica percussivo, como uma caixa de bateria.</p>
<p>No <b>reggae</b>, a guitarra toca só os contratempos (os “e”) com acordes curtos. No pop com abafado, o chuck cai nos tempos 2 e 4.</p>`,
      demo:{ kind:'strum', pattern:'chuck', chords:['Am','F','C','G'], views:[{ label:'Pop com abafado', pattern:'chuck' },{ label:'Reggae', pattern:'reggae', chords:['Am','D','Am','D'] }] },
      tasks:['Toque só chucks em colcheias, depois intercale com batidas soando.','Reggae: acordes curtos só no “e”.'] },
    { id:'semicolcheias', title:'Semicolcheias e funk', min:20,
      body:`<p>No funk, a mão direita faz o pêndulo em <b>semicolcheias</b> (4 por tempo: <b>1 i e a</b>). A maioria das batidas é abafada; só algumas soam. Quem dá o balanço é a escolha de quais soam.</p>
<p>Use acordes com pestana pequenos ou tétrades nas cordas agudas, palhetada curta e o antebraço solto. Comece bem devagar (60 BPM).</p>`,
      demo:{ kind:'strum', pattern:'funk', chords:['Am7','Am7','D','D'] },
      tasks:['Pêndulo em semicolcheias abafadas por 2 minutos a 60 BPM.','Levada funk completa a 80 BPM.'],
      links:[{ to:'levadas', id:'funk', label:'Treinador de levadas: funk' }] },
    { id:'estilos', title:'Country, valsa, 6/8 e shuffle', min:20,
      body:`<p>Cada estilo tem uma levada típica:</p>
<ul><li><b>Baixo e acorde</b> (country, sertanejo): a nota grave do acorde, depois a batida; alterne o baixo entre duas cordas.</li>
<li><b>Valsa 3/4</b>: compasso de 3 tempos, baixo no 1 e acorde no 2 e no 3.</li>
<li><b>6/8</b>: dois tempos, cada um dividido em três (1 e a 2 e a). Muito usado em baladas e louvor.</li>
<li><b>Shuffle</b>: colcheias “balançadas”, a primeira longa e a segunda curta. É o ritmo do blues.</li></ul>`,
      demo:{ kind:'strum', pattern:'country', chords:['G','C','D','G'], views:[{ label:'Baixo e acorde', pattern:'country' },{ label:'Valsa', pattern:'valsa', chords:['G','D','D','G'] },{ label:'6/8', pattern:'seisoito', chords:['C','G','Am','F'] },{ label:'Shuffle', pattern:'shuffle', chords:['A7','D7','A7','E7'] }] },
      tasks:['Toque cada levada por 1 minuto.','Escolha uma música de cada estilo e identifique a levada.'] },
  ]},
  { id:'l2', level:2, order:5, title:'Leitura 2', tag:'Leitura rítmica', lessons:[
    { id:'figuras', title:'Figuras rítmicas e pausas', min:15,
      body:`<p>Na partitura, o ritmo é escrito com <b>figuras</b>. Cada uma vale um número de tempos (no compasso 4/4):</p>
<ul><li><b>Semibreve</b> (bolinha vazada, sem haste) = 4 tempos. <b>Mínima</b> (vazada com haste) = 2.</li>
<li><b>Semínima</b> (cheia com haste) = 1. <b>Colcheia</b> (uma bandeirola ou barra) = ½. <b>Semicolcheia</b> (duas) = ¼.</li>
<li>O <b>ponto</b> aumenta a figura pela metade: semínima pontuada = 1½ tempo.</li>
<li>Cada figura tem uma <b>pausa</b> com o mesmo valor: um tempo de silêncio contado.</li></ul>`,
      demo:{ kind:'rhythm', lv:[1, 2] },
      tasks:['Ouça cada ritmo e depois toque junto.','Toque os ritmos numa corda solta com palhetada para baixo.'] },
    { id:'leitura-ritmica', title:'Leitura rítmica com semicolcheias', min:20,
      body:`<p>Com semicolcheias, cada tempo se divide em 4: <b>1 i e a</b>. Para ler sem se perder, olhe o tempo inteiro como um bloco: as barras que ligam as notas mostram exatamente um tempo.</p>
<p>Combinações comuns: <b>colcheia + duas semicolcheias</b> (galope invertido), <b>duas semicolcheias + colcheia</b> (galope) e <b>colcheia pontuada + semicolcheia</b>.</p>`,
      demo:{ kind:'rhythm', lv:[3] },
      tasks:['Leia cada ritmo falando “1 i e a” antes de tocar.','Toque junto até passar de 80% de precisão.'] },
  ]},
);

/* ===== Nível 4: harmonia e técnicas avançadas ===== */
MODULES.push(
  { id:'harm', level:4, order:1, title:'Harmonia', tag:'Acordes e campo harmônico', lessons:[
    { id:'campo', title:'O campo harmônico maior', min:15,
      body:`<p>Se você empilhar terças sobre cada nota da escala maior (pulando uma nota da escala), surgem os <b>7 acordes do tom</b>. Em Dó: <b>C Dm Em F G Am B°</b>.</p>
<p>A sequência <b>maior, menor, menor, maior, maior, menor, diminuto</b> vale para qualquer tom. Por isso a harmonia usa números romanos: <b>I ii iii IV V vi vii°</b> (maiúsculo = maior). “Um quatro cinco” é a mesma ideia em Dó, em Sol ou em Mi.</p>
<p>Troque o tom abaixo e toque cada grau. A maioria das músicas que você conhece usa só esses acordes.</p>`,
      demo:{ kind:'campo', root:'C', scale:'maior' },
      tasks:['Toque o campo de Dó, de Sol e de Ré em sequência, dizendo o grau.','Pegue uma música que você toca e escreva os graus dos acordes.'] },
    { id:'tetrades', title:'Tétrades: 7M, m7, 7 e m7(b5)', min:15,
      body:`<p>Empilhando mais uma terça, cada acorde ganha a <b>sétima</b>. O campo maior em tétrades fica <b>I7M ii7 iii7 IV7M V7 vi7 viiø</b>. Em Dó: C7M Dm7 Em7 F7M G7 Am7 Bm7(b5).</p>
<ul><li><b>7M</b>: som aberto e sonhador (bossa nova, MPB, neo soul).</li>
<li><b>m7</b>: menor mais suave.</li>
<li><b>7</b> (dominante): tensão que pede resolução; a base do blues.</li>
<li><b>m7(b5)</b> ou ø: menor com quinta diminuta, comum antes do V em tons menores.</li></ul>`,
      demo:{ kind:'campo', root:'C', scale:'maior', tetrads:true },
      tasks:['Toque as 7 tétrades de Dó.','Compare C e C7M, Am e Am7: o que muda no som?'] },
    { id:'funcoes', title:'Funções e o ii–V–I', min:15,
      body:`<p>Cada grau tem uma <b>função</b>:</p>
<ul><li><b>Tônica</b> (I, iii, vi): repouso, sensação de casa.</li>
<li><b>Subdominante</b> (ii, IV): afasta da tônica.</li>
<li><b>Dominante</b> (V, vii°): tensão que pede a volta para o I.</li></ul>
<p>A tensão do V7 vem do <b>trítono</b> entre a 3ª e a 7ª do acorde (em G7: Si e Fá), que resolve em Dó e Mi. A progressão <b>ii–V–I</b> (Dm7–G7–C7M) é a mais importante do jazz, da bossa e do gospel. Aprenda a tocá-la em todos os tons.</p>`,
      demo:{ kind:'campo', root:'G', scale:'maior', tetrads:true, prog:'ii-V-I' },
      tasks:['Toque ii–V–I em Dó, Sol e Fá.','No Jam ii–V–I, solte arpejos de cada acorde.'],
      links:[{ to:'jam', id:'iivi', label:'Jam: ii–V–I em Sol' }] },
    { id:'progressoes', title:'Progressões que todo músico usa', min:15,
      body:`<p>Algumas sequências de graus aparecem em milhares de músicas. Reconhecer de ouvido é uma das habilidades mais úteis para tocar com outras pessoas:</p>
<ul><li><b>I–V–vi–IV</b>: pop e louvor. <b>vi–IV–I–V</b>: a mesma, começando no menor.</li>
<li><b>I–vi–IV–V</b>: anos 50 e baladas. <b>I–IV–V</b>: rock, blues e sertanejo.</li>
<li><b>ii–V–I</b>: jazz e bossa. <b>i–♭VII–♭VI–♭VII</b>: rock e metal em tom menor.</li></ul>
<p>Escolha uma progressão abaixo, ouça e toque junto em vários tons.</p>`,
      demo:{ kind:'campo', root:'D', scale:'maior', prog:'I-V-vi-IV' },
      tasks:['Toque cada progressão em 3 tons diferentes.','Ouça 3 músicas e diga qual progressão elas usam.'] },
    { id:'menor-campo', title:'Campo harmônico menor', min:15,
      body:`<p>O campo da <b>menor natural</b> é <b>i ii° ♭III iv v ♭VI ♭VII</b> (em Lá: Am B° C Dm Em F G). São os mesmos acordes do campo maior relativo, com outro centro.</p>
<p>Na <b>menor harmônica</b> a 7ª sobe meio tom e o v vira <b>V maior</b> (E e E7 em Lá menor). Isso cria uma resolução muito mais forte para o i, típica do metal neoclássico, do tango e de muitas músicas gospel em tom menor.</p>`,
      demo:{ kind:'campo', root:'A', scale:'menor', views:[{ label:'Menor natural', scale:'menor' },{ label:'Menor harmônica', scale:'menor_harm' }] },
      tasks:['Toque Am–Dm–Em–Am e depois Am–Dm–E–Am. Ouça a diferença do E maior.'] },
    { id:'drop2', title:'Voicings drop 2 e drop 3', min:20,
      body:`<p>Uma tétrade “fechada” (as 4 notas dentro de uma oitava) é difícil de tocar na guitarra. A solução são os <b>voicings abertos</b>:</p>
<ul><li><b>Drop 2</b>: a segunda nota mais aguda desce uma oitava. Fica em 4 cordas vizinhas (5-4-3-2 ou 4-3-2-1). É o som clássico da guitarra de jazz e de bossa.</li>
<li><b>Drop 3</b>: a terceira nota mais aguda desce uma oitava. A tônica fica na corda 6 e a corda 5 não toca.</li></ul>
<p>No dicionário abaixo, troque o tom e o tipo de acorde e veja todas as formas no braço.</p>`,
      demo:{ kind:'dict', root:'C', q:'maj7' },
      tasks:['Toque Dm7–G7–C7M só com drop 2 nas cordas 5 a 2.','Faça o mesmo com drop 3, tônica na corda 6.'],
      links:[{ to:'acordes', label:'Abrir o dicionário de acordes' }] },
    { id:'extensoes', title:'Extensões e alterações: 9, 11, 13, ♭9 e ♯9', min:20,
      body:`<p>Continuando a empilhar terças passamos da oitava: <b>9</b> (= 2), <b>11</b> (= 4) e <b>13</b> (= 6). Elas colorem o acorde sem mudar a função. Na guitarra, quase sempre tiramos a 5ª (ou até a tônica, se o baixo tocar) para caber nos dedos.</p>
<p>No acorde dominante podemos <b>alterar</b> a 9ª e a 5ª: ♭9, ♯9, ♭5, ♯5. Elas aumentam a tensão antes da resolução. O <b>7(♯9)</b> é o “acorde do Hendrix”, ouvido em muito rock e funk.</p>`,
      demo:{ kind:'dict', root:'G', q:'nine', views:[{ label:'9', q:'nine' },{ label:'13', q:'thirteen' },{ label:'7(♭9)', q:'b9' },{ label:'7(♯9)', q:'s9' },{ label:'m9', q:'m9' },{ label:'7M(9)', q:'maj9' }] },
      tasks:['Toque G7 → G9 → G13 e ouça a cor de cada um.','Use E7(♯9) num riff de funk ou rock.'] },
  ]},
  { id:'tec', level:4, order:4, title:'Técnicas avançadas', tag:'Mãos de profissional', lessons:[
    { id:'tapping', title:'Tapping', min:20,
      body:`<p>No <b>tapping</b> a mão direita também aperta notas no braço. O dedo médio (ou indicador) “bate” firme na casa e depois puxa a corda para o lado, fazendo soar a nota que a mão esquerda está segurando.</p>
<p>O padrão clássico é em tercinas: <b>t</b> (mão direita) → <b>p</b> (pull-off para a mão esquerda) → <b>h</b> (hammer-on). Mudando as notas, você toca arpejos amplos que seriam impossíveis com uma mão só.</p>`,
      demo:{ kind:'lick', lick:'tap1' }, lick:'tap1',
      tasks:['Só a primeira tercina, devagar, até as três notas terem o mesmo volume.','Lick completo a 60 BPM, depois 80.'],
      links:[{ to:'treino', id:'tap1', label:'Treino de velocidade' }] },
    { id:'hibrida', title:'Palhetada híbrida', min:20,
      body:`<p>Na <b>palhetada híbrida</b> a palheta toca as cordas graves e os dedos médio e anelar puxam as agudas. Dá para tocar notas em cordas distantes ao mesmo tempo, como no violão dedilhado, sem largar a palheta.</p>
<p>É essencial no country, muito usada no pop, no gospel e no rock moderno. Comece com o padrão do lick: palheta, médio, anelar, médio.</p>`,
      demo:{ kind:'lick', lick:'hib1' }, lick:'hib1',
      tasks:['Só a mão direita nas cordas soltas, no mesmo padrão.','Lick completo a 70 BPM.'] },
    { id:'economica', title:'Palhetada econômica', min:20,
      body:`<p>Na palhetada alternada a palheta sempre alterna baixo e cima. Na <b>econômica</b>, quando você muda para a próxima corda <b>na mesma direção</b> do movimento, a palheta continua o movimento (como um mini sweep) em vez de voltar.</p>
<p>Em escalas de 3 notas por corda subindo: <b>↓↑↓ ↓↑↓</b>… a terceira palhetada de uma corda e a primeira da seguinte saem num movimento só. Fica mais rápido e mais leve, mas exige rigor no tempo.</p>`,
      demo:{ kind:'lick', lick:'ex-3nps' }, lick:'ex-3nps',
      tasks:['Escala maior 3NPS subindo com palhetada econômica e descendo com alternada.','Compare a velocidade máxima limpa das duas.'],
      links:[{ to:'treino', id:'ex-3nps', label:'Treino de velocidade' }] },
    { id:'harmonicos', title:'Harmônicos naturais e artificiais', min:15,
      body:`<p>Os <b>harmônicos naturais</b> (escritos &lt;12&gt;) soam como sininhos: encoste o dedo sem apertar exatamente em cima do traste 12, 7 ou 5 e solte logo após palhetar.</p>
<p>O <b>harmônico artificial</b> (ou <i>pinch harmonic</i>) é aquele “grito” do rock e do metal: segure a palheta com pouca ponta para fora e deixe a lateral do polegar raspar a corda logo depois da palhetada. Funciona melhor com distorção e captador da ponte. A posição da mão direita muda a nota do harmônico: procure o ponto que mais grita.</p>`,
      demo:{ kind:'lick', lick:'harm1' }, lick:'harm1',
      tasks:['Harmônicos nas casas 12, 7 e 5 de todas as cordas.','Com drive, procure o pinch harmonic na corda 3, casa 7.'] },
    { id:'skipping', title:'String skipping: pulando cordas', min:15,
      body:`<p>Tocar pulando cordas abre intervalos maiores e dá um som menos “escala para cima e para baixo”. O desafio é <b>abafar</b> as cordas que você pula e acertar a palheta sem olhar.</p>
<p>O lick desta aula toca a pentatônica em <b>oitavas</b>: a mesma nota duas vezes, uma corda pulada no meio.</p>`,
      demo:{ kind:'lick', lick:'skip1' }, lick:'skip1',
      tasks:['Lick a 70 BPM sem deixar a corda do meio soar.','Crie a mesma ideia com a escala maior.'] },
    { id:'legato-avancado', title:'Legato avançado e trinados', min:20,
      body:`<p>No legato quase todas as notas saem da mão esquerda. Para soar igual à palhetada, o <b>hammer-on</b> precisa ser rápido e firme e o <b>pull-off</b> deve puxar a corda levemente para baixo, quase “palhetando” com o dedo.</p>
<p>O <b>trinado</b> (alternar rápido duas notas) é o melhor exercício de força e independência. Faça em todos os pares de dedos: 1-2, 1-3, 1-4, 2-3, 2-4, 3-4.</p>`,
      demo:{ kind:'lick', lick:'trill1' }, lick:'trill1',
      tasks:['30 segundos de trinado por par de dedos.','Lick de legato em 3 notas por corda a 80 BPM.'],
      links:[{ to:'licks', id:'m4', label:'Legato em 3 notas por corda' }] },
    { id:'vibrato-bend', title:'Bend e vibrato de profissional', min:20,
      body:`<p>Bend afinado e vibrato controlado são o que mais diferencia um guitarrista experiente:</p>
<ul><li><b>Bend afinado</b>: toque a nota-alvo antes, depois faça o bend e compare. Pratique ½ tom, 1 tom e 1 tom e meio.</li>
<li><b>Pré-bend</b>: suba a corda sem tocar, palhete e solte devagar.</li>
<li><b>Vibrato</b>: escolha a largura (estreito e rápido, ou largo e lento) e mantenha regular, no tempo da música.</li>
<li><b>Bend em uníssono</b>: uma corda sobe até soar igual à outra parada.</li></ul>`,
      demo:{ kind:'lick', lick:'b2' }, lick:'b2',
      tasks:['10 bends de 1 tom conferindo com a nota-alvo.','Vibrato no tempo: 2 oscilações por tempo a 80 BPM.'],
      links:[{ to:'licks', id:'r4', label:'Lick com bend em uníssono' }] },
  ]},
);

/* ===== Nível 4 e 5: partitura, improvisação avançada e vida profissional ===== */
MODULES.push(
  { id:'l3', level:4, order:5, title:'Leitura 3', tag:'Partitura', lessons:[
    { id:'pauta', title:'A pauta e a clave de sol', min:15,
      body:`<p>A partitura usa <b>5 linhas</b>. Cada linha e cada espaço é uma nota. A <b>clave de sol</b> (𝄞) marca o Sol na segunda linha de baixo para cima. O pequeno <b>8</b> embaixo da clave indica que a guitarra soa <b>uma oitava abaixo</b> do que está escrito.</p>
<ul><li>Linhas, de baixo para cima: <b>Mi Sol Si Ré Fá</b>.</li>
<li>Espaços: <b>Fá Lá Dó Mi</b>.</li>
<li>Notas mais graves ou mais agudas usam <b>linhas suplementares</b>, pequenos tracinhos.</li></ul>
<p>Comece pelas notas das cordas 1, 2 e 3 até a casa 3.</p>`,
      demo:{ kind:'staff', mode:'quiz', set:'cordas123' },
      tasks:['Acerte 20 notas seguidas no exercício.','Depois de responder, toque a nota na guitarra.'] },
    { id:'primeira-posicao', title:'Notas na primeira posição', min:20,
      body:`<p>A <b>primeira posição</b> vai da corda solta até a casa 3 (ou 4), em todas as cordas. É onde se começa a ler partitura na guitarra, porque cada nota escrita tem um lugar só.</p>
<p>As cordas graves ficam abaixo da pauta, com linhas suplementares: a corda 6 solta (Mi) está três linhas abaixo. A corda 1 solta (Mi) está no quarto espaço.</p>`,
      demo:{ kind:'staff', mode:'quiz', set:'primeira' },
      tasks:['Acerte 20 notas seguidas.','Leia em voz alta as notas da corda 6 até a corda 1.'] },
    { id:'acidentes', title:'Sustenidos, bemóis e armadura', min:15,
      body:`<p>O <b>sustenido (♯)</b> sobe meio tom (uma casa) e o <b>bemol (♭)</b> desce meio tom. O <b>bequadro (♮)</b> cancela. Na partitura, o acidente aparece antes da nota e vale até o fim do compasso.</p>
<p>A <b>armadura de clave</b>, no começo da pauta, lista os acidentes do tom para a música inteira. Sol maior tem um sustenido (Fá♯); Fá maior tem um bemol (Si♭).</p>`,
      demo:{ kind:'staff', mode:'quiz', set:'acidentes' },
      tasks:['Acerte 15 notas seguidas com acidentes.','Diga as notas com ♯ e com ♭ de cada casa da corda 1 até a casa 5.'] },
    { id:'ler-melodia', title:'Lendo uma melodia', min:20,
      body:`<p>Juntando ritmo e notas, você lê uma melodia. A tablatura embaixo serve de conferência, mas tente ler a pauta primeiro: o nome da nota, onde ela fica e quanto tempo dura.</p>
<p>Dica: leia sempre um pouco à frente do que está tocando, como na leitura de texto.</p>`,
      demo:{ kind:'staff', mode:'melody', lick:'ex-melodia' },
      tasks:['Leia a melodia falando o nome das notas.','Toque olhando só para a pauta.'] },
  ]},
  { id:'impro', level:5, order:2, title:'Improvisação avançada', tag:'Linguagem', lessons:[
    { id:'notas-alvo', title:'Solando nas mudanças: notas do acorde', min:20,
      body:`<p>Escala serve para todos os acordes do tom, mas quem dá direção ao solo são as <b>notas do acorde da vez</b>. O exercício profissional é ficar <b>numa região do braço</b> e trocar só as notas-alvo quando o acorde muda.</p>
<p>Abaixo, a mesma região (casas 4 a 8) para Am7, D7 e G7M. Repare como só algumas notas mudam: a 3ª e a 7ª, que definem cada acorde. Mire nelas no tempo 1 de cada compasso.</p>`,
      demo:{ kind:'arp', root:'A', chord:'m7', lo:4, hi:8, views:[{ label:'Am7', root:'A', chord:'m7' },{ label:'D7', root:'D', chord:'dom7' },{ label:'G7M', root:'G', chord:'maj7' }] },
      tasks:['No Jam ii–V–I, toque só notas do acorde, uma por tempo.','Depois ligue as notas-alvo com notas da escala.'],
      links:[{ to:'jam', id:'iivi', label:'Jam: ii–V–I em Sol' }] },
    { id:'arpejos-tetrades', title:'Arpejos de tétrades no braço', min:20,
      body:`<p>Os arpejos de <b>7M, m7, 7 e m7(♭5)</b> são o vocabulário básico do jazz, do fusion e do gospel moderno. Aprenda cada um em pelo menos duas regiões do braço, com a tônica na corda 6 e na corda 5.</p>
<p>Um exercício excelente: toque o campo harmônico inteiro em arpejos, subindo e descendo, sem sair da mesma região.</p>`,
      demo:{ kind:'arp', root:'C', chord:'maj7', lo:7, hi:11, views:[{ label:'C7M', chord:'maj7' },{ label:'Cm7', chord:'m7' },{ label:'C7', chord:'dom7' },{ label:'Cm7(♭5)', chord:'m7b5' },{ label:'C°7', chord:'dim7' }] },
      tasks:['Cada arpejo subindo e descendo com metrônomo.','Campo de Dó em arpejos entre as casas 7 e 10.'] },
    { id:'menor-melodica', title:'Menor melódica, lídio dominante e alterada', min:20,
      body:`<p>A <b>menor melódica</b> é a escala menor com 6ª e 7ª maiores. Dela saem dois modos muito usados:</p>
<ul><li><b>Lídio dominante</b> (4º modo): maior com ♯4 e ♭7. Perfeito sobre acordes 7 que não resolvem (blues moderno, fusion).</li>
<li><b>Alterada</b> (7º modo): todas as tensões do dominante (♭9, ♯9, ♭5, ♯5). Use sobre o V7 logo antes de resolver.</li></ul>
<p>Regra prática: sobre E7 que vai para Am, toque a menor melódica de Fá (meio tom acima do E).</p>`,
      demo:{ kind:'scale', scale:'menor_mel', root:'A', pos:0, keySel:true, views:[{ label:'Menor melódica', scale:'menor_mel' },{ label:'Lídio dominante', scale:'lidio_dom' },{ label:'Alterada', scale:'alterada' }] },
      lick:'alt1',
      tasks:['Toque a menor melódica de Lá em 3 notas por corda.','Use a alterada no último compasso de um blues menor.'] },
    { id:'simetricas', title:'Escalas simétricas', min:15,
      body:`<p>Escalas <b>simétricas</b> repetem o mesmo desenho ao longo do braço:</p>
<ul><li><b>Diminuta tom-semitom</b>: sobre acordes °7. O desenho se repete a cada 3 casas.</li>
<li><b>Dominante diminuta</b> (semitom-tom): sobre 7(♭9), com som “tenso e moderno”.</li>
<li><b>Tons inteiros</b>: só tons inteiros, som de sonho; sobre 7(♯5). Repete a cada 2 casas.</li></ul>`,
      demo:{ kind:'scale', scale:'dim_st', root:'G', pos:-1, keySel:true, views:[{ label:'Dominante diminuta', scale:'dim_st' },{ label:'Diminuta', scale:'dim_ts' },{ label:'Tons inteiros', scale:'tons_inteiros' }] },
      tasks:['Ache o desenho que se repete a cada 3 casas na diminuta.','Improvise sobre G7(♭9) com a dominante diminuta.'] },
    { id:'fraseado', title:'Fraseado: motivo, ritmo e espaço', min:20,
      body:`<p>O que faz um solo soar profissional não é a quantidade de notas. É o <b>fraseado</b>:</p>
<ul><li><b>Motivo</b>: uma ideia curta (3 a 5 notas) que você repete e transforma.</li>
<li><b>Sequência</b>: o mesmo motivo começando em outra nota da escala.</li>
<li><b>Deslocamento rítmico</b>: a mesma frase começando meio tempo depois.</li>
<li><b>Espaço e dinâmica</b>: pausas, notas longas, tocar mais forte ou mais fraco.</li></ul>
<p>Grave seus improvisos e escute: você está conversando ou só passando escala?</p>`,
      demo:{ kind:'lick', lick:'fusion1' }, lick:'fusion1',
      tasks:['Improvise 2 minutos usando um motivo só.','Grave um improviso e anote 3 ideias que funcionaram.'],
      links:[{ to:'gravar', label:'Abrir o gravador' }] },
    { id:'jazz-fusion', title:'Linguagem de jazz e fusion', min:20,
      body:`<p>Duas ferramentas da linguagem do jazz para começar:</p>
<ul><li><b>Arpejos nas mudanças</b>: cada acorde do ii–V–I com o seu arpejo, ligando a 7ª de um à 3ª do seguinte (elas ficam a meio tom ou um tom de distância).</li>
<li><b>Enclosures</b>: cercar a nota-alvo por cima e por baixo antes de tocá-la.</li></ul>
<p>A melhor fonte é <b>transcrever</b>: tirar de ouvido frases dos músicos que você admira e tocá-las em outros tons.</p>`,
      demo:{ kind:'lick', lick:'jazz1' }, lick:'jazz1',
      tasks:['Toque o lick ii–V–I em mais dois tons.','Transcreva uma frase curta de um solo que você gosta.'],
      links:[{ to:'aula', id:'transcrever', label:'Aula: tirar música de ouvido' }] },
  ]},
  { id:'pro', level:5, order:3, title:'Vida profissional', tag:'Timbre, banda e palco', lessons:[
    { id:'timbre', title:'Timbre: amplificador, ganho e equalização', min:15,
      body:`<p>Três timbres resolvem quase tudo:</p>
<ul><li><b>Limpo</b>: ganho baixo (2–3), médios no meio, um pouco de reverb. Acordes, arpejos, louvor, pop.</li>
<li><b>Crunch</b>: ganho médio (4–6). Blues, rock clássico, base de pop rock. Responde à força da palhetada.</li>
<li><b>Drive de solo</b>: ganho alto, um pouco mais de <b>médios</b> para o solo aparecer na banda, e delay curto.</li></ul>
<p>Erros comuns: tirar todos os médios (some na banda), ganho alto demais (embola e esconde a palhetada) e graves exagerados. Use também o <b>volume da guitarra</b>: com ele em 7, o crunch vira quase limpo.</p>`,
      demo:{ kind:'none' },
      tasks:['Monte e anote seus 3 timbres: limpo, crunch e solo.','Toque o mesmo riff nos três e grave.'] },
    { id:'pedais', title:'Pedais e a ordem da cadeia', min:15,
      body:`<p>A ordem mais usada, da guitarra para o amplificador:</p>
<ol><li><b>Afinador</b></li><li><b>Filtros</b> (wah) e <b>compressor</b></li><li><b>Overdrive / distorção / fuzz</b></li><li><b>Modulação</b> (chorus, phaser, flanger)</li><li><b>Delay</b></li><li><b>Reverb</b></li></ol>
<p>Se o amplificador tem <b>loop de efeitos</b>, modulação, delay e reverb soam melhor nele. Pedaleiras e simuladores seguem a mesma lógica. No louvor, delay sincronizado com o BPM e reverb longo são a base do timbre ambiente.</p>`,
      demo:{ kind:'none' },
      tasks:['Desenhe a sua cadeia de efeitos.','Ajuste o delay no tempo de uma música (semínima ou colcheia pontuada).'] },
    { id:'regulagem', title:'Cordas, cuidados e regulagem', min:15,
      body:`<ul><li><b>Cordas</b>: troque a cada 1–3 meses, ou quando perderem brilho e afinação. Calibre 0.09 é mais macio; 0.10 tem mais corpo e segura melhor a afinação.</li>
<li><b>Ao trocar</b>: estique cada corda nova algumas vezes antes de afinar de vez.</li>
<li><b>Altura das cordas (action)</b>: baixa facilita, baixa demais trasteja.</li>
<li><b>Oitava (entonação)</b>: a casa 12 deve soar igual ao harmônico da casa 12; se não, ajuste o carrinho da ponte.</li>
<li><b>Tensor</b>: ajusta a curvatura do braço; mexa pouco (1/8 de volta por vez) ou leve a um luthier.</li>
<li>Limpe as cordas e o braço depois de tocar.</li></ul>`,
      demo:{ kind:'none' },
      tasks:['Troque as cordas sozinho uma vez.','Confira a oitava das 6 cordas com o afinador.'],
      links:[{ to:'afinador', label:'Abrir o afinador' }] },
    { id:'banda', title:'Tocando em banda', min:20,
      body:`<ul><li><b>Ouça o baixo e o bombo</b>: o seu ritmo encaixa neles.</li>
<li><b>Divida frequências</b>: se o teclado faz os acordes graves, toque tríades nas cordas agudas.</li>
<li><b>Menos é mais</b>: deixe espaço para a voz; preencha só onde não há melodia.</li>
<li><b>Dinâmica de banda</b>: verso mais vazio, refrão mais cheio, ponte diferente.</li>
<li><b>Mapa da música</b>: anote a estrutura (intro, verso, refrão, ponte) com os graus. Fica fácil mudar de tom.</li>
<li>Combine sinais para final, repetição e mudança de parte.</li></ul>`,
      demo:{ kind:'none' },
      tasks:['Faça o mapa de 3 músicas do seu repertório com os graus.','No Jam, toque só tríades nas cordas 1-2-3.'] },
    { id:'estudio', title:'Gravando em casa', min:20,
      body:`<p>Para gravar com qualidade você precisa de:</p>
<ul><li><b>Interface de áudio</b> (entrada para guitarra) e um <b>programa de gravação</b> (DAW).</li>
<li><b>Simulador de amplificador</b> no computador, ou microfone na frente do falante (perto do centro = mais agudo; para a borda = mais grave).</li>
<li><b>Click</b> (metrônomo) sempre ligado ao gravar.</li>
<li><b>Dobra</b>: grave a base duas vezes e coloque uma de cada lado (esquerda/direita). O som fica largo, de disco.</li>
<li>Grave mais de uma tomada e escolha a melhor; descanse os ouvidos antes de decidir.</li></ul>`,
      demo:{ kind:'none' },
      tasks:['Grave uma base com click e um solo por cima no looper.','Grave a mesma base duas vezes e compare.'],
      links:[{ to:'gravar', label:'Gravador e looper' }] },
    { id:'palco', title:'Palco e performance', min:15,
      body:`<ul><li><b>Setlist</b> com tom e BPM de cada música e a ordem das trocas de timbre.</li>
<li><b>Passagem de som</b>: peça no retorno o que você precisa ouvir (normalmente voz e bateria).</li>
<li><b>Kit de emergência</b>: cordas, cabo extra, palhetas, bateria/fonte dos pedais, afinador.</li>
<li><b>Nervosismo</b>: ensaie a música mais difícil até ficar no automático. Se errar, não pare: a música continua.</li>
<li>Ensaie as <b>transições</b> entre as músicas, não só as músicas.</li></ul>`,
      demo:{ kind:'none' },
      tasks:['Monte um setlist de 5 músicas com tom, BPM e timbre.','Toque o setlist inteiro sem parar, gravando.'] },
    { id:'estudo-pro', title:'Como estudar como profissional', min:15,
      body:`<ul><li><b>Prática deliberada</b>: estude o que você ainda não sabe, em blocos curtos e com objetivo claro.</li>
<li><b>Meça</b>: BPM, trocas por minuto, porcentagem nos quizzes. O que é medido melhora.</li>
<li><b>Grave e escute</b> toda semana.</li>
<li><b>Divida o tempo</b>: técnica, repertório, improviso, ouvido e teoria (o plano do dia faz isso por você).</li>
<li><b>Saúde</b>: aqueça antes, alongue depois, faça pausas a cada 25–30 minutos. Dor não é normal: pare e descanse.</li></ul>`,
      demo:{ kind:'none' },
      tasks:['Use o plano do dia por 2 semanas sem falhar.','Escolha uma meta medível para o mês.'],
      links:[{ to:'hoje', label:'Plano de hoje' }] },
    { id:'transcrever', title:'Tirar música de ouvido', min:20,
      body:`<ol><li>Descubra o <b>tom</b>: procure a nota que “resolve” no fim das frases, ou a nota que o baixo mais repete.</li>
<li>Ouça a <b>pentatônica</b> desse tom: a maioria das frases de rock, blues e pop sai dela.</li>
<li>Tire <b>uma frase curta</b> de cada vez. Cante antes de procurar na guitarra.</li>
<li>Use velocidade reduzida e loop do trecho (no app, o loop A-B dos licks treina isso).</li>
<li>Depois de tirar, escreva no editor de licks e toque em outros tons.</li></ol>`,
      demo:{ kind:'none' },
      tasks:['Tire de ouvido a melodia de uma música infantil ou do “parabéns”.','Tire uma frase de um solo que você gosta e salve no editor.'],
      links:[{ to:'quiz', id:'ouvido', label:'Treino de ouvido' },{ to:'editor', label:'Editor de licks' }] },
  ]},
);

/* ===== Trilha de aulas — módulos 5 a 8 ===== */
MODULES.push(
  { id:'m5', title:'Pentatônica e blues', tag:'Rock e blues', lessons:[
    { id:'pent1', title:'Pentatônica menor: caixa 1', min:15,
      body:`<p>A pentatônica menor tem 5 notas: <b>R, ♭3, 4, 5, ♭7</b>. É a escala mais usada em solos de rock e blues, porque quase não tem nota “errada” sobre acordes menores e sobre o blues.</p>
<p>A <b>caixa 1</b> é o desenho com a tônica na corda 6 sob o dedo 1. Em Lá, fica na casa 5: duas notas por corda, dedos 1 e 4 nas cordas 6, 2 e 1 e dedos 1 e 3 nas cordas 5, 4 e 3.</p>
<p>Use <b>palhetada alternada</b> (baixo, cima, baixo, cima) desde o primeiro dia. Velocidade vem depois. Comece no metrônomo a 60 BPM em colcheias.</p>`,
      demo:{ kind:'scale', scale:'pent_menor', root:'A', pos:0, keySel:true, views:[{label:'Intervalos', labels:'iv'},{label:'Notas', labels:'note'}] },
      lick:'r1',
      tasks:['Suba e desça a caixa 1 a 60 BPM, palhetada alternada.','Toque o lick de tercinas devagar e suba 5 BPM por dia.'],
      links:[{ to:'treino', id:'ex-pent', label:'Treino de velocidade da caixa 1' }] },
    { id:'pent5', title:'As cinco caixas', min:20,
      body:`<p>A pentatônica tem <b>5 caixas</b>, uma começando em cada nota da escala na corda 6. A última nota de uma caixa é a primeira da seguinte, então elas se encaixam como peças e cobrem o braço todo.</p>
<p>A forma mais rápida de ligar as caixas é pela <b>tônica</b>: ache a nota vermelha em cada desenho. As caixas 1 e 2 (casas 5 a 10 em Lá) são as mais usadas, e a caixa 4 aparece muito em solos clássicos na região da casa 12 e acima.</p>`,
      demo:{ kind:'scale', scale:'pent_menor', root:'A', pos:0, keySel:true, views:[{label:'Caixa 1', pos:0},{label:'Caixa 2', pos:1},{label:'Caixa 3', pos:2},{label:'Caixa 4', pos:3},{label:'Caixa 5', pos:4},{label:'Braço inteiro', pos:-1}] },
      tasks:['Aprenda uma caixa nova por semana.','Toque a caixa 1 e deslize para a caixa 2 sem parar.'],
      links:[{ to:'jam', id:'rock', label:'Improvisar sobre Am–G–F–G' }] },
    { id:'pentmaior', title:'Pentatônica maior e a relativa', min:12,
      body:`<p>A pentatônica maior (<b>R, 2, 3, 5, 6</b>) usa exatamente os <b>mesmos desenhos</b> da menor. Só muda qual nota é a tônica.</p>
<p>Regra prática: a pentatônica menor de Lá tem as mesmas notas da pentatônica maior de Dó. Para achar a maior de um tom, recue <b>3 casas</b> a partir da tônica menor. Sol maior = Mi menor, que fica 3 casas abaixo.</p>
<p>A pentatônica maior soa mais alegre, aberta e “country/gospel”. Em louvor e soul, ela aparece misturada com tríades e sextas.</p>`,
      demo:{ kind:'scale', scale:'pent_maior', root:'C', pos:4, keySel:true, views:[{label:'Dó maior', root:'C', scale:'pent_maior'},{label:'Lá menor', root:'A', scale:'pent_menor', pos:0}] },
      lick:'g4',
      tasks:['Toque a mesma caixa pensando em Lá menor e depois em Dó maior: termine as frases em notas diferentes.'] },
    { id:'blues', title:'Escala blues e a blue note', min:12,
      body:`<p>A escala blues é a pentatônica menor com uma nota a mais: a <b>♭5</b>, chamada de <b>blue note</b>. Ela é uma nota de passagem: soa tensa parada, e linda quando você passa por ela indo para a 4ª ou para a 5ª.</p>
<p>Na caixa 1 em Lá, a blue note (Ré♯/Mi♭) aparece na corda 5, casa 6, e na corda 3, casa 8. Toque o lick desta aula e preste atenção no “gemido” do slide até ela.</p>`,
      demo:{ kind:'scale', scale:'blues', root:'A', pos:0, keySel:true, views:[{label:'Caixa 1', pos:0},{label:'Caixa 2', pos:1},{label:'Braço inteiro', pos:-1}] },
      lick:'b4',
      tasks:['Toque a escala blues subindo e descendo.','Crie uma frase que passe pela blue note e termine na tônica.'],
      links:[{ to:'jam', id:'blues', label:'Improvisar sobre um blues em Lá' }] },
    { id:'tecnicas', title:'Bend, vibrato, slide e ligados', min:20,
      body:`<p>É na técnica de mão esquerda que a guitarra mais se diferencia do violão:</p>
<ul><li><b>Bend (b)</b>: empurre a corda para cima até a nota soar 1 tom (2 casas) ou ½ tom acima. Use 2 ou 3 dedos juntos e confira a afinação tocando a nota-alvo antes.</li>
<li><b>Release (r)</b>: volte o bend até a nota original sem palhetar.</li>
<li><b>Vibrato (~)</b>: pequenos bends repetidos e regulares. É a “assinatura” de cada guitarrista.</li>
<li><b>Slide (/ e \\)</b>: deslize até a próxima casa mantendo pressão.</li>
<li><b>Hammer-on (h) e pull-off (p)</b>: notas tocadas só com a mão esquerda, sem palhetar.</li></ul>`,
      demo:{ kind:'lick', lick:'r2' }, lick:'r2',
      tasks:['Bend de 1 tom na corda 3, casa 7: toque antes a casa 9 para ouvir o alvo.','Vibrato a 4 oscilações por segundo numa nota longa.'],
      links:[{ to:'licks', id:'r4', label:'Lick com bend em double stop' }] },
    { id:'blues12', title:'Blues de 12 compassos', min:20,
      body:`<p>O blues tem uma forma fixa de 12 compassos com três acordes: <b>I, IV e V</b>. Em Lá: A7, D7 e E7.</p>
<p class="mono-line">| A7 | D7 | A7 | A7 |<br>| D7 | D7 | A7 | A7 |<br>| E7 | D7 | A7 | E7 |</p>
<p>O estudo desta aula é um solo completo sobre essa forma. Repare nos espaços: blues é pergunta e resposta. Toque uma frase, deixe respirar, responda. E repare nas notas que mudam com o acorde: Fá♯ sobre o D7, Sol♯ sobre o E7.</p>`,
      demo:{ kind:'lick', lick:'s2' }, lick:'s2',
      tasks:['Toque o solo a 60% da velocidade e vá subindo.','Toque sobre a base de blues em Lá e crie seu próprio solo usando só a caixa 1.'],
      links:[{ to:'jam', id:'blues', label:'Base de blues em Lá' }] },
  ]},
  { id:'m6', title:'Escala maior e modos', tag:'Melodia', lessons:[
    { id:'maior3nps', title:'Escala maior com 3 notas por corda', min:15,
      body:`<p>Você já conhece a escala maior. No violão ela costuma ser tocada numa região só, com abertura de 4 dedos. Na guitarra, o sistema de <b>3 notas por corda</b> (3NPS) é muito popular: cada corda tem exatamente 3 notas, o que deixa a palhetada regular e facilita ligados e velocidade.</p>
<p>São 7 posições, uma começando em cada grau da escala na corda 6. As posições se sobrepõem: as duas últimas notas de cada corda são as duas primeiras da posição seguinte.</p>`,
      demo:{ kind:'scale', scale:'maior', root:'G', pos:0, keySel:true, views:[{label:'Pos. 1', pos:0},{label:'Pos. 2', pos:1},{label:'Pos. 3', pos:2},{label:'Pos. 4', pos:3},{label:'Pos. 5', pos:4},{label:'Pos. 6', pos:5},{label:'Pos. 7', pos:6},{label:'Braço', pos:-1}] },
      tasks:['Toque a posição 1 de Sol maior em semicolcheias a 70 BPM.','Ligue a posição 1 à posição 2 subindo pela corda 1.'],
      links:[{ to:'treino', id:'ex-3nps', label:'Treino de velocidade 3NPS' }] },
    { id:'menor-relativa', title:'Menor natural e a relativa', min:12,
      body:`<p>Toda escala maior tem uma <b>relativa menor</b> com as mesmas notas, começando no 6º grau. Dó maior e Lá menor são o mesmo conjunto de notas, com outro centro.</p>
<p>A menor natural é a pentatônica menor com duas notas a mais: a <b>2</b> e a <b>♭6</b>. Elas dão um sabor mais melódico e dramático ao solo, muito usado no rock e no metal.</p>`,
      demo:{ kind:'scale', scale:'menor', root:'A', pos:0, keySel:true, views:[{label:'Menor natural', scale:'menor'},{label:'Só a pentatônica', scale:'pent_menor'}] },
      tasks:['Toque a pentatônica e depois a menor natural na mesma região: ache as 2 notas novas.'] },
    { id:'modos', title:'Modos que o guitarrista usa', min:20,
      body:`<p>Modo é uma escala maior tocada a partir de outro grau. Para o dia a dia, pense em cada modo como uma escala conhecida com <b>uma nota característica</b>:</p>
<ul><li><b>Dórico</b> = menor natural com <b>6 maior</b>. Rock, funk, fusion (Santana).</li>
<li><b>Mixolídio</b> = maior com <b>♭7</b>. Blues, rock clássico, sobre acordes com 7.</li>
<li><b>Frígio</b> = menor com <b>♭2</b>. Metal, flamenco.</li>
<li><b>Lídio</b> = maior com <b>♯4</b>. Sonoridade de trilha de filme, flutuante.</li></ul>
<p>Para ouvir o modo, toque sobre uma base que fique num acorde só e destaque a nota característica.</p>`,
      demo:{ kind:'scale', scale:'dorico', root:'A', pos:0, keySel:true, views:[{label:'Dórico', scale:'dorico'},{label:'Mixolídio', scale:'mixolidio'},{label:'Frígio', scale:'frigio'},{label:'Lídio', scale:'lidio'}] },
      tasks:['Toque Lá dórico e Lá menor natural em sequência: só a 6ª muda.'] },
  ]},
  { id:'m7', title:'Metal e neoclássico', tag:'Velocidade', lessons:[
    { id:'harmonica', title:'Menor harmônica e frígio dominante', min:15,
      body:`<p>A <b>menor harmônica</b> é a menor natural com a <b>7ª maior</b>. Esse salto de 1 tom e meio entre a ♭6 e a 7 dá o sabor “clássico/oriental” do metal neoclássico.</p>
<p>Tocada a partir do 5º grau ela vira o <b>frígio dominante</b> (Mi frígio dominante = Lá menor harmônica), muito usado sobre o acorde V maior em tons menores.</p>
<p>O lick desta aula usa <b>pedal</b>: uma nota fixa (Mi, casa 12) alternando com a melodia na mesma corda, um recurso típico de Bach que os guitarristas neoclássicos adotaram.</p>`,
      demo:{ kind:'scale', scale:'menor_harm', root:'E', pos:0, keySel:true, views:[{label:'Menor harmônica', scale:'menor_harm'},{label:'Frígio dominante', scale:'frigio_dom'}] },
      lick:'m2',
      tasks:['Toque o lick de pedal só com palhetada alternada, bem devagar.'] },
    { id:'palhetada', title:'Palhetada alternada e sequências', min:20,
      body:`<p>Velocidade limpa vem de três coisas: <b>palhetada alternada</b> rigorosa, <b>mão esquerda sincronizada</b> e <b>metrônomo</b>.</p>
<ul><li>Movimento pequeno: a palheta passa só um pouco da corda.</li>
<li>Aumente 4 a 5 BPM por vez só quando conseguir 4 repetições limpas.</li>
<li>Sequências (grupos de 3, de 4) transformam escalas em frases. O exercício “aranha” (1-2-3-4) aquece e sincroniza as mãos.</li></ul>
<p>Use o <b>Treino de velocidade</b>: ele sobe o BPM sozinho a cada ciclo e guarda o seu recorde.</p>`,
      demo:{ kind:'lick', lick:'ex-aranha' }, lick:'ex-aranha',
      tasks:['Aranha a 80 BPM em semicolcheias, 3 minutos por dia.','Registre seu recorde no Treino.'],
      links:[{ to:'treino', id:'ex-aranha', label:'Treino de velocidade: aranha' },{ to:'treino', id:'ex-seq3', label:'Sequência em grupos de 3' }] },
    { id:'sweep', title:'Arpejos com sweep', min:20,
      body:`<p>No <b>sweep</b> a palheta “varre” as cordas num movimento só: para baixo na subida e para cima na descida. A mão esquerda solta cada nota assim que a próxima soar, para as notas não embolarem.</p>
<p>O lick desta aula tem um arpejo de Lá menor e outro de Mi maior (o V de Lá menor harmônica) em 5 cordas. Comece muito devagar e foque no abafamento, não na velocidade.</p>`,
      demo:{ kind:'lick', lick:'m3' }, lick:'m3',
      tasks:['Toque cada nota separada até ficar limpo, depois junte o movimento.'] },
  ]},
  { id:'m8', title:'Construindo solos', tag:'Musicalidade', lessons:[
    { id:'frases', title:'Pergunta, resposta e notas-alvo', min:15,
      body:`<p>Um solo marcante é feito de <b>frases</b>, como uma conversa. Três ideias para usar já:</p>
<ul><li><b>Pergunta e resposta</b>: frase 1 termina “em aberto” (na 5ª ou na 2ª), frase 2 resolve na tônica.</li>
<li><b>Notas-alvo</b>: quando o acorde muda, caia numa nota dele. No Jam deste app, as notas do acorde atual aparecem acesas no braço.</li>
<li><b>Repetição e variação</b>: repita um lick e mude só o final. O ouvinte reconhece e se envolve.</li></ul>
<p>E não esqueça do silêncio: pausas fazem parte da frase.</p>`,
      demo:{ kind:'lick', lick:'b2' }, lick:'b2',
      tasks:['No Jam, toque só 2 notas por acorde, sempre notas acesas.','Crie uma pergunta e três respostas diferentes.'],
      links:[{ to:'jam', id:'rock', label:'Jam: Am–G–F–G' }] },
    { id:'solo-rock', title:'Solo de rock em Lá menor', min:25,
      body:`<p>Este estudo de 8 compassos passa pelos acordes <b>Am – G – F – G – Am – G – F – E</b> e junta tudo: caixas 1 e 2 da pentatônica, a nota Fá da menor natural, bends e o Sol♯ da menor harmônica no último compasso.</p>
<p>Aprenda de 2 em 2 compassos. Quando estiver confortável, toque sobre o Jam “Rock menor” e depois troque algumas frases pelas suas.</p>`,
      demo:{ kind:'lick', lick:'s1' }, lick:'s1',
      tasks:['Compassos 1-2, depois 3-4, depois tudo.','Toque a 70% e suba até 100%.'],
      links:[{ to:'jam', id:'rock', label:'Jam: Am–G–F–G' }] },
  ]},
);
