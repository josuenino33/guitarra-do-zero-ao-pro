<title>Mapa do Braço</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app de estudo com barra de seções no topo (no celular, embaixo); coluna de até 1180px; o braço da guitarra é a peça principal de cada tela */
:root {
  --bg: #E7ECE9; --surface: #F7F9F7; --surface-2: #DCE3DF; --fg: #17201C; --muted: #53625B; --line: #C4CDC8;
  --accent: #1C5887; --accent-ink: #FFFFFF; --accent-soft: #D5E4F0;
  --ok: #2B7A4C; --bad: #B23E2C;
  --wood: #3B2719; --wood-edge: #2A1B11; --fret: #CBD0D5; --nut: #EFE8D6; --pearl: #ECE5D2; --string: #B7BCC1; --string-w: #A0927A;
  --iv-r: #D2412B; --iv-3: #E59D1E; --iv-5: #2C8A60; --iv-7: #7357C4; --iv-2: #3A84BF; --iv-4: #C04F7E; --iv-6: #7B8A28; --iv-b5: #13698F;
  --iv-n: #CFC9B9; --iv-pair: #E8B24D; --iv-q: #F4F1E8;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1412; --surface: #161D1A; --surface-2: #212A26; --fg: #E3EAE6; --muted: #93A29B; --line: #2C3632;
  --accent: #7DB2E2; --accent-ink: #0A1824; --accent-soft: #1B3145;
  --ok: #4DB37A; --bad: #E2705E;
  --wood: #2E1E14; --wood-edge: #1E130C; --fret: #9EA4AA; --nut: #CFC7B2; --pearl: #CBC2AC; --string: #8E949A; --string-w: #857862;
  --iv-n: #8F8A7D; --iv-q: #E3DED2;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0F1412; --surface: #161D1A; --surface-2: #212A26; --fg: #E3EAE6; --muted: #93A29B; --line: #2C3632;
  --accent: #7DB2E2; --accent-ink: #0A1824; --accent-soft: #1B3145;
  --ok: #4DB37A; --bad: #E2705E;
  --wood: #2E1E14; --wood-edge: #1E130C; --fret: #9EA4AA; --nut: #CFC7B2; --pearl: #CBC2AC; --string: #8E949A; --string-w: #857862;
  --iv-n: #8F8A7D; --iv-q: #E3DED2;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: .005em; }
h1 { font-size: clamp(32px, 5vw, 46px); }
h2 { font-size: 26px; }
h3 { font-size: 22px; }
p { margin: 0; }
.eyebrow { font: 600 12px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); margin-bottom: 8px; }
.lede { color: var(--muted); max-width: 62ch; margin-top: 10px; }
.small { font-size: 14px; color: var(--muted); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* casca */
.app { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 0 110px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 18px;
  margin-inline: -20px; padding: 10px 20px; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); font: 700 23px/1 var(--f-display); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.brand svg { width: 34px; height: 34px; flex: none; }
.nav { display: flex; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; text-decoration: none; color: var(--muted);
  font: 600 17px/1 var(--f-display); text-transform: uppercase; letter-spacing: .07em; }
.nav a:hover { color: var(--fg); }
.nav a.on { color: var(--accent); background: var(--accent-soft); }
.nav svg { display: none; width: 22px; height: 22px; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.sync { font: 500 12px var(--f-mono); color: var(--muted); white-space: nowrap; }
.sync.conta::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; font-size: 20px; }
.icon-btn svg { width: 20px; height: 20px; }

.view { display: flex; flex-direction: column; gap: 18px; padding-block: 22px; min-width: 0; }
.view > * { min-width: 0; }
.page-head { padding-block: 6px 2px; }
.crumbs { display: flex; gap: 8px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.crumbs a { color: var(--muted); }

/* blocos */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.btn { display: inline-flex; align-items: center; gap: 6px; font: 700 15px/1.2 var(--f-body); padding: 9px 15px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.ghost { background: transparent; }
.btn.big { padding: 12px 20px; font-size: 16px; }
.btn.round { width: 50px; height: 50px; border-radius: 50%; justify-content: center; padding: 0; font-family: var(--f-mono); }
.btn.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.btn.warn { border-color: var(--bad); color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 700 14px/1 var(--f-body); padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.chip:hover { color: var(--fg); }
.chip.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.ctrl-row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.ctrl-row + .ctrl-row, .ctrl-row + div, div + .ctrl-row { margin-top: 12px; }
.ctrl-row.center { justify-content: center; }
.ctrl-right { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-left: auto; }
.field { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.field.grow { flex: 1 1 260px; }
.field.grow select { flex: 1; min-width: 0; }
select, input[type="number"] { font: 15px var(--f-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; max-width: 100%; }
input[type="number"] { width: 5.2em; font-family: var(--f-mono); }
input[type="range"] { accent-color: var(--accent); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 17px; height: 17px; }
.pill { display: inline-block; font: 600 12.5px/1.3 var(--f-mono); padding: 5px 10px; border-radius: 999px; background: var(--surface-2); color: var(--fg); }
.pill.ok { background: var(--ok); color: #fff; }
.pill.muted { color: var(--muted); }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.caption { color: var(--muted); font-size: 14px; margin-top: 10px; }
.tip { font-size: 14px; color: var(--muted); margin-top: 12px; max-width: 75ch; }
.tip b { color: var(--fg); }

/* cores por função do intervalo */
.iv-r { --c: var(--iv-r); --ink: #fff; } .iv-3 { --c: var(--iv-3); --ink: #2B1A00; } .iv-5 { --c: var(--iv-5); --ink: #fff; }
.iv-7 { --c: var(--iv-7); --ink: #fff; } .iv-2 { --c: var(--iv-2); --ink: #fff; } .iv-4 { --c: var(--iv-4); --ink: #fff; }
.iv-6 { --c: var(--iv-6); --ink: #fff; } .iv-b5 { --c: var(--iv-b5); --ink: #fff; } .iv-n { --c: var(--iv-n); --ink: #241D10; }
.iv-pair { --c: var(--iv-pair); --ink: #2B1A00; } .iv-q { --c: var(--iv-q); --ink: #17201C; } .iv-bad { --c: var(--bad); --ink: #fff; }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--c, var(--iv-n)); margin-right: 6px; vertical-align: -1px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin-top: 10px; }

/* braço */
.fb-wrap { overflow-x: auto; overscroll-behavior-x: contain; margin-top: 12px; border-radius: 8px; -webkit-overflow-scrolling: touch; }
.fb { display: block; width: 100%; height: auto; }
.fb-wood { fill: var(--wood); stroke: var(--wood-edge); stroke-width: 2; }
.fb-inlay { fill: var(--pearl); opacity: .8; }
.fb-fret { fill: var(--fret); }
.fb-nut { fill: var(--nut); }
.fb-string { stroke: var(--string); }
.fb-string.wound { stroke: var(--string-w); }
.fb-sname, .fb-num { fill: var(--muted); font: 600 11px var(--f-mono); text-anchor: middle; }
.fb-num.strong { fill: var(--fg); }
.fb-hit { fill: transparent; cursor: pointer; }
.fb-hit:hover { fill: rgba(255, 255, 255, .09); }
.fb-note { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: transform .09s ease-out; }
.fb-note circle { fill: var(--c); stroke: rgba(0, 0, 0, .3); stroke-width: 1; }
.fb-note text { fill: var(--ink); font-family: var(--f-mono); font-weight: 600; text-anchor: middle; pointer-events: none; }
.fb-note.dim { opacity: .5; }
.fb-note.ring circle { fill-opacity: .35; stroke: var(--c); stroke-width: 2; }
.fb-note.is-on { transform: scale(1.28); }
.fb-note.is-on circle { stroke: #fff; stroke-width: 3; }

/* tablatura */
.tab-scroll { overflow-x: auto; margin-top: 12px; padding-bottom: 6px; background: var(--surface); }
.tab { display: flex; width: max-content; font: 14px/1 var(--f-mono); }
.tab-names, .tab-col { display: flex; flex-direction: column; }
.tab-col { width: calc(var(--w) * 1ch + 4px); border-radius: 4px; }
.tab-top { height: 20px; display: flex; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--muted); }
.tab-top i { font-style: normal; font-size: 9px; color: var(--accent); }
.tab-cell { height: 22px; display: flex; align-items: center; justify-content: center; background: linear-gradient(var(--line), var(--line)) center / 100% 1px no-repeat; }
.tab-cell b { background: var(--surface); padding: 0 2px; font-weight: 600; white-space: nowrap; }
.tab-names .tab-cell { width: 2.2ch; background: none; color: var(--muted); }
.tab-bar { width: 2px; margin-top: 20px; height: 132px; background: var(--muted); opacity: .55; }
.tab-col.on { background: var(--accent-soft); }
.tab-col.on b { background: var(--accent-soft); color: var(--accent); }

/* trilha */
.hero-strip { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; align-items: end; padding-block: 8px 4px; }
.stat-row { display: flex; flex-wrap: wrap; gap: 14px 26px; align-items: center; }
.stat-row.wide { gap: 14px 40px; }
.stat b { display: block; font: 700 46px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat b small { font-size: 24px; color: var(--muted); }
.stat span { font-size: 13px; color: var(--muted); }
.modules { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
.module { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 6px; display: flex; flex-direction: column; gap: 8px; }
.module header { display: flex; justify-content: space-between; gap: 8px; }
.mod-n { font: 600 12px var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.tag { font: 600 12px var(--f-mono); color: var(--accent); }
.lessons { list-style: none; margin: 4px 0 0; padding: 0; }
.lessons a { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 22px; gap: 8px; align-items: center; padding: 9px 2px; border-top: 1px solid var(--line); color: var(--fg); text-decoration: none; }
.lessons a:hover .lt { color: var(--accent); }
.ln, .lm { font: 500 12.5px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.lt { font-weight: 700; }
.ck { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.done .ck { background: var(--ok); border-color: var(--ok); }
.done .ck::after { content: '✓'; color: #fff; font-size: 12px; font-weight: 700; }

/* aula */
.lesson-head { margin-bottom: 14px; }
.prose { max-width: 68ch; display: flex; flex-direction: column; gap: 12px; }
.prose ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.mono-line { font: 14px/1.8 var(--f-mono); background: var(--surface-2); padding: 10px 14px; border-radius: 8px; overflow-x: auto; white-space: nowrap; }
.practice h2 { margin-bottom: 10px; }
.tasks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; max-width: 75ch; }
.tasks li { padding-left: 28px; position: relative; }
.tasks li::before { content: ''; position: absolute; left: 0; top: 3px; width: 16px; height: 16px; border: 2px solid var(--accent); border-radius: 4px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.lesson-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 8px; border-top: 1px solid var(--line); }

/* licks */
.licks-layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; align-items: start; }
.lick-list { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); max-height: calc(100vh - 100px); overflow: auto; }
.lick-list ul { list-style: none; margin: 12px 0 0; padding: 0; }
.lick-list a { display: flex; flex-direction: column; padding: 9px 10px; border-radius: 8px; text-decoration: none; color: var(--fg); }
.lick-list a:hover { background: var(--surface); }
.lick-list a.on { background: var(--accent-soft); }
.lick-list a.on .lt { color: var(--accent); }
.lick-list .lm { font-size: 12px; }
.lick-head { margin-top: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13.5px; color: var(--muted); margin-top: 6px; }
.chords { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; font: 600 14px var(--f-mono); }
.chords span { font-size: 10px; color: var(--muted); margin-right: -3px; align-self: flex-start; }

/* treino */
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; }
.subtabs a { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); text-decoration: none; font-weight: 700; font-size: 14px; }
.subtabs a.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.met { display: flex; flex-direction: column; gap: 18px; align-items: stretch; }
.met-bpm { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.bpm-read { text-align: center; min-width: 150px; }
.bpm-read b { display: block; font: 700 92px/0.9 var(--f-display); font-variant-numeric: tabular-nums; }
.bpm-read span { font: 600 12px var(--f-mono); color: var(--muted); letter-spacing: .12em; }
.met input[type="range"] { width: 100%; }
.beats { display: flex; justify-content: center; gap: 12px; }
.beats i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); }
.beats i.acc { border-color: var(--accent); }
.beats i.on { background: var(--accent); border-color: var(--accent); }
.speed-read { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; margin-top: 14px; }
.speed-read b { display: block; font: 700 46px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.speed-read span { font-size: 13px; color: var(--muted); }
.bar.wide { flex: 1 1 200px; height: 10px; }
.jam-now { display: flex; align-items: center; gap: 14px 26px; flex-wrap: wrap; margin-top: 14px; }
.now span { display: block; font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.now b { font: 700 44px/1 var(--f-display); }
.now.dim b { color: var(--muted); font-size: 30px; }
.bars { display: flex; flex-wrap: wrap; gap: 5px; list-style: none; margin: 0; padding: 0; flex: 1 1 260px; }
.bars li { font: 600 13px var(--f-mono); padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; }
.bars li.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* explorador */
.explorer-ctrl .ctrl-row { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.explorer-ctrl .ctrl-row:last-child { border-bottom: 0; padding-bottom: 0; }
.degrees { display: flex; flex-wrap: wrap; gap: 8px; margin-block: 4px 12px; }
.deg { padding: 6px 12px; border: 1px solid var(--line); border-top: 5px solid var(--c); border-radius: 6px; text-align: center; min-width: 54px; }
.deg b { display: block; font: 700 22px/1.1 var(--f-display); }
.deg span { font: 600 12px var(--f-mono); color: var(--muted); }

/* quiz */
.quiz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.quiz-card { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--fg); text-decoration: none; }
.quiz-card:hover { border-color: var(--accent); }
.quiz-card p { color: var(--muted); font-size: 15px; flex: 1; }
.quiz-top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.quiz-top h1 { font-size: 30px; margin-right: auto; }
.prompt { font-size: 19px; margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.answers { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; margin-top: 14px; }
.answers .btn { justify-content: center; text-align: center; }
.answers .result { grid-column: 1 / -1; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.result b { font: 700 80px/1 var(--f-display); }
.btn.ans.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn.ans.bad { background: var(--bad); color: #fff; border-color: var(--bad); }
.feedback { min-height: 1.6em; margin-top: 12px; font-weight: 700; }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--bad); }

/* progresso */
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 14px); grid-auto-columns: 14px; gap: 3px; margin-block: 6px 12px; overflow-x: auto; }
.heat i { border-radius: 3px; background: var(--surface-2); }
.heat i.on { background: var(--ok); }
.mod-prog { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.mod-prog li { display: grid; grid-template-columns: minmax(0, 1fr) 90px 36px; gap: 10px; align-items: center; font-size: 14.5px; }
.mod-prog em { font: normal 600 12.5px var(--f-mono); color: var(--muted); text-align: right; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.tbl th { text-align: left; font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 6px 4px; }
.tbl td { padding: 8px 4px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.danger { display: flex; justify-content: flex-end; }
.backup .ctrl-row { margin-top: 12px; }

/* configurações e aviso */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(8, 12, 10, .45); display: flex; justify-content: flex-end; }
.sheet { width: min(380px, 100%); height: 100%; background: var(--surface); padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 24px; overflow: auto; border-left: 1px solid var(--line); }
.sheet header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.set-row { display: flex; flex-direction: column; gap: 8px; padding-block: 12px; border-bottom: 1px solid var(--line); font-weight: 700; }
.set-row input[type="range"] { width: 100%; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); z-index: 60; background: var(--fg); color: var(--bg);

<script>
'use strict';
/* ===== Teoria: notas, escalas, acordes e posições no braço ===== */
const T = (() => {
  const SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
  const LAT = { C:'Dó', D:'Ré', E:'Mi', F:'Fá', G:'Sol', A:'Lá', B:'Si' };
  const ROOTS = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
  // índice 0 = corda 6 (Mi grave) ... índice 5 = corda 1 (Mi agudo)
  const TUNING = [40, 45, 50, 55, 59, 64];
  const IV = ['R','b2','2','b3','3','4','b5','5','b6','6','b7','7'];
  const IV_NAME = ['Tônica','2ª menor','2ª maior','3ª menor','3ª maior','4ª justa',
    'Trítono (5ª diminuta)','5ª justa','6ª menor','6ª maior','7ª menor','7ª maior'];
  // família de cor de cada intervalo (usado no CSS: .iv-r, .iv-3 ...)
  const IV_ROLE = ['r','2','2','3','3','4','b5','5','6','6','7','7'];
  const FLAT_PARENTS = new Set([5, 10, 3, 8, 1, 6]);

  const SCALES = {
    pent_menor: { name:'Pentatônica menor', iv:[0,3,5,7,10], parent:3, sys:'box' },
    pent_maior: { name:'Pentatônica maior', iv:[0,2,4,7,9], parent:0, sys:'box' },
    blues:      { name:'Escala blues', iv:[0,3,5,6,7,10], parent:3, sys:'box', base:[0,3,5,7,10] },
    blues_maior:{ name:'Blues maior', iv:[0,2,3,4,7,9], parent:0, sys:'box', base:[0,2,4,7,9] },
    maior:      { name:'Maior (jônio)', iv:[0,2,4,5,7,9,11], parent:0, sys:'3nps' },
    menor:      { name:'Menor natural (eólio)', iv:[0,2,3,5,7,8,10], parent:3, sys:'3nps' },
    dorico:     { name:'Dórico', iv:[0,2,3,5,7,9,10], parent:10, sys:'3nps' },
    frigio:     { name:'Frígio', iv:[0,1,3,5,7,8,10], parent:8, sys:'3nps' },
    lidio:      { name:'Lídio', iv:[0,2,4,6,7,9,11], parent:7, sys:'3nps' },
    mixolidio:  { name:'Mixolídio', iv:[0,2,4,5,7,9,10], parent:5, sys:'3nps' },
    menor_harm: { name:'Menor harmônica', iv:[0,2,3,5,7,8,11], parent:3, sys:'3nps' },
    frigio_dom: { name:'Frígio dominante', iv:[0,1,4,5,7,8,10], parent:8, sys:'3nps' },
  };

  const CHORDS = {
    maior: { name:'Maior', sym:'', iv:[0,4,7] },
    menor: { name:'Menor', sym:'m', iv:[0,3,7] },
    dim:   { name:'Diminuta', sym:'°', iv:[0,3,6] },
    aum:   { name:'Aumentada', sym:'+', iv:[0,4,8] },
    sus2:  { name:'Sus2', sym:'sus2', iv:[0,2,7] },
    sus4:  { name:'Sus4', sym:'sus4', iv:[0,5,7] },
    power: { name:'Power chord (5)', sym:'5', iv:[0,7] },
    dom7:  { name:'Dominante (7)', sym:'7', iv:[0,4,7,10] },
    maj7:  { name:'Maior com 7M', sym:'7M', iv:[0,4,7,11] },
    m7:    { name:'Menor com 7', sym:'m7', iv:[0,3,7,10] },
    m7b5:  { name:'Meio-diminuto', sym:'m7(b5)', iv:[0,3,6,10] },
  };

  // Formas CAGED: rs = corda da tônica (0 = corda 6); off = deslocamento em casas por corda
  const CAGED = {
    maior: [
      { k:'C', rs:1, off:[null,0,-1,-3,-2,-3] },
      { k:'A', rs:1, off:[null,0,2,2,2,0] },
      { k:'G', rs:0, off:[0,-1,-3,-3,-3,0] },
      { k:'E', rs:0, off:[0,2,2,1,0,0] },
      { k:'D', rs:2, off:[null,null,0,2,3,2] },
    ],
    menor: [
      { k:'C', rs:1, off:[null,0,-2,-3,-2,null] },
      { k:'A', rs:1, off:[null,0,2,2,1,0] },
      { k:'G', rs:0, off:[0,-2,-3,-3,0,0] },
      { k:'E', rs:0, off:[0,2,2,0,0,0] },
      { k:'D', rs:2, off:[null,null,0,2,3,1] },
    ],
  };

  const STRING_SETS = [
    { id:'123', label:'Cordas 1-2-3', s:[3,4,5] },
    { id:'234', label:'Cordas 2-3-4', s:[2,3,4] },
    { id:'345', label:'Cordas 3-4-5', s:[1,2,3] },
    { id:'456', label:'Cordas 4-5-6', s:[0,1,2] },
  ];
  const INV_NAME = ['Fundamental', '1ª inversão', '2ª inversão'];

  const mod = (n, m = 12) => ((n % m) + m) % m;
  const pcOf = name => {
    if (typeof name === 'number') return mod(name);
    const i = ROOTS.indexOf(name); if (i >= 0) return i;
    const j = SHARP.indexOf(name); return j >= 0 ? j : mod(FLAT.indexOf(name));
  };
  const pitch = (s, f) => TUNING[s] + f;

  function useFlats(rootPc, parent = 0) { return FLAT_PARENTS.has(mod(rootPc + parent)); }

  function noteName(pc, flats, latin) {
    let n = (flats ? FLAT : SHARP)[mod(pc)];
    if (latin) n = LAT[n[0]] + n.slice(1);
    return n.replace('#', '♯').replace('b', '♭');
  }
  // nome da tônica escolhida, respeitando a grafia dos seletores
  function rootName(pc, latin) {
    let n = ROOTS[mod(pc)];
    if (latin) n = LAT[n[0]] + n.slice(1);
    return n.replace('#', '♯').replace('b', '♭');
  }
  const ivLabel = semis => IV[mod(semis)].replace('b', '♭');

  function mark(s, f, rootPc, extra) {
    const pc = mod(pitch(s, f));
    const iv = mod(pc - rootPc);
    return Object.assign({ s, f, pc, iv, role: IV_ROLE[iv] }, extra);
  }

  /** Todas as notas das classes de altura dadas, no braço inteiro. */
  function allNotes(ivs, rootPc, maxFret, lo = 0) {
    const set = new Set(ivs.map(i => mod(rootPc + i)));
    const out = [];
    for (let s = 0; s < 6; s++)
      for (let f = lo; f <= maxFret; f++)
        if (set.has(mod(pitch(s, f)))) out.push(mark(s, f, rootPc));
    return out;
  }

  function nextPitch(p, pcs) { let q = p + 1; while (!pcs.has(mod(q))) q++; return q; }

  function fitFrets(list, maxFret) {
    let min = Math.min(...list.map(m => m.f)), max = Math.max(...list.map(m => m.f));
    let shift = 0;
    if (min < 0) shift = 12;
    else if (max > maxFret && min >= 12) shift = -12;
    if (shift) list.forEach(m => { m.f += shift; });
    return list.filter(m => m.f >= 0 && m.f <= maxFret);
  }

  /** Posição com N notas por corda começando no grau `deg` na corda 6. */
  function nps(ivs, rootPc, deg, perString, maxFret) {
    const pcs = new Set(ivs.map(i => mod(rootPc + i)));
    const startPc = mod(rootPc + ivs[deg]);
    let p = TUNING[0] + mod(startPc - TUNING[0]);
    const out = [];
    for (let s = 0; s < 6; s++) {
      for (let k = 0; k < perString; k++) {
        if (s > 0 || k > 0) p = nextPitch(p, pcs);
        out.push({ s, f: p - TUNING[s] });
      }
    }
    return fitFrets(out, maxFret).map(m => mark(m.s, m.f, rootPc));
  }

  /** Caixas (2 notas por corda) com notas extras (ex.: blue note) dentro da janela da corda. */
  function box(scaleKey, rootPc, idx, maxFret) {
    const sc = SCALES[scaleKey];
    const base = sc.base || sc.iv;
    const marks = nps(base, rootPc, idx, 2, maxFret);
    const extras = sc.iv.filter(i => !base.includes(i));
    if (!extras.length) return marks;
    const out = marks.slice();
    for (let s = 0; s < 6; s++) {
      const fs = marks.filter(m => m.s === s).map(m => m.f);
      if (!fs.length) continue;
      const lo = Math.min(...fs), hi = Math.max(...fs) + 1;
      for (let f = lo; f <= Math.min(hi, maxFret); f++)
        if (extras.includes(mod(pitch(s, f) - rootPc))) out.push(mark(s, f, rootPc));
    }
    return out;
  }

  function positionsCount(scaleKey) {
    const sc = SCALES[scaleKey];
    return (sc.base || sc.iv).length;
  }

  /** Notas de uma escala numa posição (ou braço inteiro quando pos < 0). */
  function scaleMarks(scaleKey, rootPc, pos, maxFret) {
    const sc = SCALES[scaleKey];
    if (pos < 0) return allNotes(sc.iv, rootPc, maxFret);
    const ms = sc.sys === 'box' ? box(scaleKey, rootPc, pos, maxFret) : nps(sc.iv, rootPc, pos, 3, maxFret);
    // posições depois da 1ª continuam subindo o braço quando cabem (evita cair nas cordas soltas)
    const lo = Math.min(...ms.map(m => m.f)), hi = Math.max(...ms.map(m => m.f));
    if (pos > 0 && lo < 3 && hi + 12 <= maxFret) ms.forEach(m => { m.f += 12; });
    return ms;
  }

  /** Forma CAGED posicionada no braço. */
  function cagedShape(quality, k, rootPc, maxFret) {
    const sh = CAGED[quality].find(x => x.k === k);
    let f = mod(rootPc - TUNING[sh.rs]);
    const offs = sh.off.filter(o => o != null);
    if (f + Math.min(...offs) < 0) f += 12;
    if (f + Math.max(...offs) > maxFret) f -= 12;
    const notes = [];
    sh.off.forEach((o, s) => { if (o != null) notes.push(mark(s, f + o, rootPc)); });
    const fs = notes.map(n => n.f);
    return { k, notes, lo: Math.min(...fs), hi: Math.max(...fs) };
  }

  function cagedAll(quality, rootPc, maxFret) {
    return CAGED[quality].map(sh => cagedShape(quality, sh.k, rootPc, maxFret)).sort((a, b) => a.lo - b.lo);
  }

  /** Tríades fechadas num grupo de 3 cordas, todas as inversões no braço. */
  function triads(rootPc, quality, strings, maxFret) {
    const ivs = CHORDS[quality].iv.slice(0, 3);
    const out = [];
    for (let inv = 0; inv < 3; inv++) {
      const order = ivs.slice(inv).concat(ivs.slice(0, inv));
      const pcs = order.map(i => mod(rootPc + i));
      const f0 = mod(pcs[0] - TUNING[strings[0]]);
      for (let base = f0; base <= maxFret; base += 12) {
        const p0 = TUNING[strings[0]] + base;
        const p1 = nextPitch(p0, new Set([pcs[1]]));
        const p2 = nextPitch(p1, new Set([pcs[2]]));
        const frets = [base, p1 - TUNING[strings[1]], p2 - TUNING[strings[2]]];
        if (frets.some(f => f < 0 || f > maxFret)) continue;
        if (Math.max(...frets) - Math.min(...frets) > 5) continue;
        out.push({ inv, notes: frets.map((f, i) => mark(strings[i], f, rootPc)), lo: Math.min(...frets) });
      }
    }
    return out.sort((a, b) => a.lo - b.lo);
  }

  /** Posições de uma classe de altura em todo o braço. */
  function pcPositions(pc, maxFret) {
    const out = [];
    for (let s = 0; s < 6; s++)
      for (let f = 0; f <= maxFret; f++)
        if (mod(pitch(s, f)) === mod(pc)) out.push({ s, f });
    return out;
  }

  const chordName = (rootPc, q, latin) => rootName(rootPc, latin) + CHORDS[q].sym;
  const stringLabel = s => 'Corda ' + (6 - s);

  return { SHARP, FLAT, ROOTS, TUNING, IV, IV_NAME, IV_ROLE, SCALES, CHORDS, CAGED, STRING_SETS, INV_NAME,
    mod, pcOf, pitch, useFlats, noteName, rootName, ivLabel, mark, allNotes, nps, box, positionsCount,
    scaleMarks, cagedShape, cagedAll, triads, pcPositions, chordName, stringLabel };
})();

/* ===== Áudio: corda sintetizada (Karplus-Strong), timbres, cliques e relógio ===== */
const A = (() => {
  let ctx = null, master, gtrIn, cleanG, driveG, revSend, clickBus, backBus;
  const cache = new Map();
  const voices = {};
  let live = [];
  let tone = 'clean', volume = 0.8;

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
    // iPhone: toca mesmo com a chave de silencioso ligada (Safari 16.4+)
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = volume;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    master.connect(comp); comp.connect(ctx.destination);

    // reverb curto de sala
    const conv = ctx.createConvolver();
    const len = Math.floor(ctx.sampleRate * 1.3);
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    conv.buffer = ir;
    revSend = ctx.createGain(); revSend.gain.value = 0.16;
    revSend.connect(conv); conv.connect(master);

    gtrIn = ctx.createGain();
    // limpo
    cleanG = ctx.createGain();
    const cleanLP = ctx.createBiquadFilter(); cleanLP.type = 'lowpass'; cleanLP.frequency.value = 6500;
    gtrIn.connect(cleanG); cleanG.connect(cleanLP); cleanLP.connect(master); cleanLP.connect(revSend);
    // drive: ganho -> saturação -> falante
    driveG = ctx.createGain();
    const pre = ctx.createGain(); pre.gain.value = 9;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 110;
    const sh = ctx.createWaveShaper();
    const curve = new Float32Array(2048);
    for (let i = 0; i < 2048; i++) { const x = i / 1023.5 - 1; curve[i] = Math.tanh(2.6 * x); }
    sh.curve = curve; sh.oversample = '2x';
    const mid = ctx.createBiquadFilter(); mid.type = 'peaking'; mid.frequency.value = 900; mid.gain.value = 4; mid.Q.value = 0.8;
    const cab = ctx.createBiquadFilter(); cab.type = 'lowpass'; cab.frequency.value = 3600; cab.Q.value = 0.9;
    const post = ctx.createGain(); post.gain.value = 0.22;
    gtrIn.connect(driveG); driveG.connect(hp); hp.connect(pre); pre.connect(sh); sh.connect(mid); mid.connect(cab); cab.connect(post);
    post.connect(master); post.connect(revSend);

    clickBus = ctx.createGain(); clickBus.gain.value = 0.9; clickBus.connect(master);
    // base do jam: sempre limpa, um pouco mais escura
    backBus = ctx.createGain(); backBus.gain.value = 0.55;
    const backLP = ctx.createBiquadFilter(); backLP.type = 'lowpass'; backLP.frequency.value = 3200;
    backBus.connect(backLP); backLP.connect(master); backLP.connect(revSend);
    setTone(tone);
    return ctx;
  }

  function setTone(t) {
    tone = t;
    if (!ctx) return;
    cleanG.gain.value = t === 'clean' ? 1 : 0;
    driveG.gain.value = t === 'drive' ? 1 : 0;
  }
  function setVolume(v) { volume = v; if (master) master.gain.value = v; }

  function buffer(midi) {
    if (cache.has(midi)) return cache.get(midi);
    const sr = ctx.sampleRate;
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    const dur = midi < 45 ? 3.4 : midi < 60 ? 2.8 : 2.2;
    const len = Math.floor(sr * dur);
    const buf = ctx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    const S = midi < 52 ? 0.5 : midi < 66 ? 0.4 : 0.3;
    const P = sr / f - S;
    const Ni = Math.floor(P), fr = P - Ni;
    const t60 = midi < 52 ? 5 : midi < 66 ? 4 : 3;
    const rho = Math.pow(0.001, 1 / (f * t60));
    // excitação: ruído suavizado (palheta média)
    let prev = 0;
    for (let i = 0; i < Ni + 2 && i < len; i++) { const r = Math.random() * 2 - 1; prev = prev * 0.45 + r * 0.55; d[i] = prev; }
    let mean = 0; for (let i = 0; i < Ni + 2; i++) mean += d[i]; mean /= (Ni + 2);
    for (let i = 0; i < Ni + 2; i++) d[i] -= mean;
    let dPrev = 0;
    for (let n = Ni + 2; n < len; n++) {
      const del = (1 - fr) * d[n - Ni] + fr * d[n - Ni - 1];
      d[n] = rho * ((1 - S) * del + S * dPrev);
      dPrev = del;
    }
    const fade = Math.floor(sr * 0.08);
    for (let i = 0; i < fade; i++) d[len - 1 - i] *= i / fade;
    cache.set(midi, buf);
    return buf;
  }

  /**
   * Toca uma nota. o: { dur, vel, string, bend, release, prebend, slideFrom, vib, mute, dry }
   */
  function play(midi, when, o = {}) {
    init();
    const t = Math.max(when ?? ctx.currentTime, ctx.currentTime);
    const src = ctx.createBufferSource();
    src.buffer = buffer(midi);
    const g = ctx.createGain();
    const vel = (o.vel ?? 0.8) * (o.mute ? 0.9 : 1);
    g.gain.setValueAtTime(vel, t);
    let out = g;
    if (o.mute) {
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1300;
      g.connect(lp); out = lp;
      g.gain.setTargetAtTime(0, t + 0.06, 0.07);
    }
    src.connect(g);
    out.connect(o.bus === 'back' ? backBus : (o.bus || gtrIn));
    const pr = src.playbackRate;
    const len = o.dur ?? 2.4;
    if (o.slideFrom != null) {
      pr.setValueAtTime(Math.pow(2, (o.slideFrom - midi) / 12), t);
      pr.linearRampToValueAtTime(1, t + Math.min(0.09, len * 0.5));
    }
    if (o.bend) {
      const r = Math.pow(2, o.bend / 12);
      if (o.prebend) pr.setValueAtTime(r, t); else { pr.setValueAtTime(1, t); pr.setTargetAtTime(r, t + 0.03, 0.045); }
      if (o.release) pr.setTargetAtTime(1, t + len * 0.55, 0.04);
    }
    if (o.vib) {
      const lfo = ctx.createOscillator(); lfo.frequency.value = 5.6;
      const lg = ctx.createGain(); lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0.018, t + 0.25);
      lfo.connect(lg); lg.connect(pr); lfo.start(t); lfo.stop(t + len + 0.2);
    }
    src.start(t);
    if (o.dur != null) {
      g.gain.setValueAtTime(vel, t + len);
      g.gain.linearRampToValueAtTime(0, t + len + 0.07);
      src.stop(t + len + 0.1);
    }
    // abafa a nota anterior na mesma corda
    if (o.string != null) {
      const pv = voices[o.string];
      if (pv && pv.t < t) { pv.g.gain.cancelScheduledValues(t); pv.g.gain.setTargetAtTime(0, t, 0.012); }
      voices[o.string] = { g, t };
    }
    const v = { src, g, end: t + len + 0.1 };
    live.push(v);
    if (live.length > 80) live = live.filter(x => x.end > ctx.currentTime);
    return v;
  }

  function stopAll() {
    if (!ctx) return;
    const now = ctx.currentTime;
    live.forEach(v => { try { v.g.gain.cancelScheduledValues(now); v.g.gain.setTargetAtTime(0, now, 0.02); v.src.stop(now + 0.15); } catch (e) {} });
    live = [];
    Object.keys(voices).forEach(k => delete voices[k]);
  }

  function click(t, accent) {
    init();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = accent ? 1750 : 1150;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(accent ? 0.35 : 0.2, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    o.connect(g); g.connect(clickBus); o.start(t); o.stop(t + 0.06);
  }

  function tick(t) {
    init();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 900;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    o.connect(g); g.connect(clickBus); o.start(t); o.stop(t + 0.04);
  }

  let noiseBuf = null;
  function noise() {
    if (noiseBuf) return noiseBuf;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }
  function drum(kind, t, vel = 1) {
    init();
    if (kind === 'kick') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
      g.gain.setValueAtTime(0.9 * vel, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
      o.connect(g); g.connect(clickBus); o.start(t); o.stop(t + 0.35);
      return;
    }
    const s = ctx.createBufferSource(); s.buffer = noise();
    const f = ctx.createBiquadFilter(), g = ctx.createGain();
    if (kind === 'hat') { f.type = 'highpass'; f.frequency.value = 7000; g.gain.setValueAtTime(0.18 * vel, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05); }
    else { f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 0.7; g.gain.setValueAtTime(0.5 * vel, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18); }
    s.connect(f); f.connect(g); g.connect(clickBus); s.start(t); s.stop(t + 0.25);
  }
  function bass(midi, t, dur) {
    init();
    play(midi, t, { dur, vel: 1, bus: 'back', string: 'bass' });
  }

  // mantém a tela do celular acesa enquanto o metrônomo ou a base estiverem tocando
  let lock = null, locks = 0;
  async function wake(on) {
    locks = Math.max(0, locks + (on ? 1 : -1));
    try {
      if (locks > 0 && !lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); }
      else if (locks === 0 && lock) { await lock.release(); lock = null; }
    } catch (e) { lock = null; }
  }

  /** Relógio com agendamento antecipado. onTick(tickIndex, time) por subdivisão. */
  function Clock(getBpm, perBeat, onTick) {
    let timer = null, next = 0, i = 0;
    const self = {
      running: false,
      start() {
        init();
        if (self.running) return;
        i = 0; next = ctx.currentTime + 0.12; self.running = true; wake(true);
        timer = setInterval(() => {
          while (next < ctx.currentTime + 0.12) {
            onTick(i, next);
            next += 60 / getBpm() / perBeat; i++;
          }
        }, 25);
      },
      stop() { if (self.running) wake(false); clearInterval(timer); timer = null; self.running = false; },
    };
    return self;
  }

  const now = () => (init(), ctx.currentTime);
  return { init, play, stopAll, click, tick, drum, bass, setTone, setVolume, Clock, now, get ctx() { return ctx; } };
})();

/* ===== Braço da guitarra em SVG ===== */
const FB = (() => {
  const NUT = 60, PAD_R = 14, TOP = 22, GAP = 28, K = 20;
  const WIDTHS = [2.7, 2.2, 1.8, 1.45, 1.1, 0.9];
  const INLAY = [3, 5, 7, 9, 15, 17, 19, 21];

  function geometry(N) {
    const W = NUT + N * 56 + PAD_R;
    const span = W - NUT - PAD_R;
    const norm = 1 - Math.pow(2, -N / K);
    const xs = [];
    for (let n = 0; n <= N; n++) xs.push(NUT + span * (1 - Math.pow(2, -n / K)) / norm);
    const y = s => TOP + (5 - s) * GAP;
    const H = TOP * 2 + 5 * GAP + 16;
    const nx = f => f === 0 ? NUT - 22 : (xs[f - 1] + xs[f]) / 2;
    return { W, H, xs, y, nx };
  }

  function create(host, opts = {}) {
    const inst = { state: { marks: [], frets: 15, lefty: false, labels: 'note', flats: false, latin: false } };
    host.classList.add('fb-wrap');
    host.addEventListener('click', e => {
      const hit = e.target.closest('[data-s]');
      if (!hit || !inst.state.onPick) return;
      inst.state.onPick(+hit.dataset.s, +hit.dataset.f, e);
    });

    inst.set = (patch) => { Object.assign(inst.state, patch); render(); return inst; };

    inst.setActive = (keys) => {
      const on = new Set(keys);
      host.querySelectorAll('.fb-note').forEach(n => n.classList.toggle('is-on', on.has(n.dataset.k)));
    };

    function label(m, st) {
      if (m.label != null) return m.label;
      if (st.labels === 'iv') return T.ivLabel(m.iv);
      if (st.labels === 'none') return '';
      return T.noteName(m.pc, st.flats, st.latin);
    }

    function render() {
      const st = inst.state, N = st.frets;
      const g = geometry(N);
      const X = x => st.lefty ? g.W - x : x;
      const p = [];
      const yTop = g.y(5) - 13, yBot = g.y(0) + 13;
      p.push(`<rect class="fb-wood" x="${Math.min(X(g.xs[0]), X(g.xs[N]))}" y="${yTop}" width="${g.xs[N] - g.xs[0]}" height="${yBot - yTop}" rx="2"/>`);
      const midY = (g.y(2) + g.y(3)) / 2;
      for (let n = 1; n <= N; n++) {
        const cx = X((g.xs[n - 1] + g.xs[n]) / 2);
        if (INLAY.includes(n)) p.push(`<circle class="fb-inlay" cx="${cx}" cy="${midY}" r="6"/>`);
        if (n === 12 || n === 24) {
          p.push(`<circle class="fb-inlay" cx="${cx}" cy="${(g.y(4) + g.y(3)) / 2}" r="6"/>`);
          p.push(`<circle class="fb-inlay" cx="${cx}" cy="${(g.y(2) + g.y(1)) / 2}" r="6"/>`);
        }
      }
      for (let n = 1; n <= N; n++) p.push(`<rect class="fb-fret" x="${X(g.xs[n]) - 1.6}" y="${yTop}" width="3.2" height="${yBot - yTop}"/>`);
      p.push(`<rect class="fb-nut" x="${X(g.xs[0]) - 3.5}" y="${yTop - 1}" width="7" height="${yBot - yTop + 2}" rx="1.5"/>`);
      for (let s = 0; s < 6; s++) {
        const y = g.y(s);
        p.push(`<line class="fb-string ${s < 3 ? 'wound' : ''}" x1="${X(NUT - 40)}" x2="${X(g.xs[N])}" y1="${y}" y2="${y}" stroke-width="${WIDTHS[s]}"/>`);
        p.push(`<text class="fb-sname" x="${X(12)}" y="${y + 4}">${6 - s}</text>`);
      }
      for (let n = 0; n <= N; n++) {
        const strong = INLAY.includes(n) || n === 12 || n === 24;
        p.push(`<text class="fb-num ${strong ? 'strong' : ''}" x="${X(g.nx(n))}" y="${g.H - 3}">${n}</text>`);
      }
      // áreas de clique
      if (st.onPick) {
        for (let s = 0; s < 6; s++) for (let f = 0; f <= N; f++) {
          const x0 = f === 0 ? NUT - 40 : g.xs[f - 1], x1 = f === 0 ? g.xs[0] - 4 : g.xs[f];
          const xa = Math.min(X(x0), X(x1));
          p.push(`<rect class="fb-hit" data-s="${s}" data-f="${f}" x="${xa}" y="${g.y(s) - GAP / 2}" width="${Math.abs(x1 - x0)}" height="${GAP}"/>`);
        }
      }
      // notas
      const sorted = st.marks.slice().sort((a, b) => (a.dim ? 0 : 1) - (b.dim ? 0 : 1));
      for (const m of sorted) {
        if (m.f > N) continue;
        const cx = X(g.nx(m.f)), cy = g.y(m.s);
        const txt = label(m, st);
        const fs = txt.length > 3 ? 8.5 : txt.length > 2 ? 9.5 : 11;
        const cls = ['fb-note', 'iv-' + (m.role || 'n'), m.dim ? 'dim' : '', m.cls || ''].join(' ');
        const r = m.small ? 8 : 12;
        p.push(`<g class="${cls}" data-k="${m.s}:${m.f}" ${st.onPick ? `data-s="${m.s}" data-f="${m.f}"` : ''}>` +
          `<circle cx="${cx}" cy="${cy}" r="${r}"/>` +
          (txt ? `<text x="${cx}" y="${cy + fs * 0.36}" font-size="${fs}">${txt}</text>` : '') + `</g>`);
      }
      host.innerHTML = `<svg class="fb" viewBox="0 0 ${g.W} ${g.H}" style="min-width:${Math.round(g.W * 0.74)}px" role="img" aria-label="Braço da guitarra">${p.join('')}</svg>`;
    }

    if (opts.state) inst.set(opts.state); else render();
    return inst;
  }

  return { create, geometry };
})();

/* ===== Tablatura: leitura, desenho e reprodução =====
   Sintaxe: "|e 3:5 3:7h 2:8b2r -"  (|q |e |s |t |h |w e "." para pontuada)
   Nota = corda:casa + técnica (h hammer, p pull-off, / slide, bN bend, r release,
   BN pré-bend, ~ vibrato, m palm mute). Corda:x = nota abafada. "+" junta notas. */
const TAB = (() => {
  const DUR = { w: 4, h: 2, q: 1, e: 0.5, s: 0.25, t: 1 / 3, x: 1 / 6 };

  function parse(src) {
    const ev = [];
    let d = 0.5, beat = 0;
    for (const tok of src.trim().split(/\s+/)) {
      if (!tok) continue;
      if (tok[0] === '|') { d = DUR[tok[1]] * (tok[2] === '.' ? 1.5 : 1); continue; }
      if (tok === '-') { ev.push({ rest: true, d, beat, notes: [] }); beat += d; continue; }
      const notes = tok.split('+').map(nt => {
        const m = nt.match(/^([1-6]):(\d+|x)(.*)$/);
        if (!m) throw new Error('Token inválido: ' + nt);
        const n = +m[1], tech = m[3];
        const o = { n, s: 6 - n, f: m[2] === 'x' ? null : +m[2], dead: m[2] === 'x' };
        if (tech.includes('h')) o.h = true;
        if (tech.includes('p')) o.p = true;
        if (tech.includes('/')) o.sl = true;
        if (tech.includes('~')) o.vib = true;
        if (tech.includes('m')) o.pm = true;
        const b = tech.match(/b(\d)/); if (b) o.bend = +b[1];
        const B = tech.match(/B(\d)/); if (B) { o.bend = +B[1]; o.pre = true; }
        if (tech.includes('r')) o.rel = true;
        return o;
      });
      ev.push({ notes, d, beat });
      beat += d;
    }
    // casa anterior em cada corda (para rótulo e áudio de slide/legato)
    const last = {};
    ev.forEach(e => e.notes.forEach(o => {
      if (o.dead) return;
      o.prev = last[o.s];
      last[o.s] = o.f;
    }));
    return { events: ev, beats: beat };
  }

  function noteLabel(o) {
    if (o.dead) return 'x';
    let t = String(o.f);
    if (o.h) t = 'h' + t;
    else if (o.p) t = 'p' + t;
    else if (o.sl) t = (o.prev != null && o.prev > o.f ? '\\' : '/') + t;
    if (o.bend) t = o.pre ? `${o.f}pb${o.f + o.bend}` : `${t}b${o.f + o.bend}`;
    if (o.rel) t += 'r' + o.f;
    if (o.vib) t += '~';
    return t;
  }

  function countLabel(beat) {
    const r = Math.round(beat * 6) / 6;
    if (Math.abs(r - Math.round(r)) < 1e-6) return String((Math.round(r) % 4) + 1);
    if (Math.abs(r - Math.floor(r) - 0.5) < 1e-6) return '&';
    return '';
  }

  /** Desenha a tablatura dentro de `host`; retorna função para destacar evento. */
  function render(host, parsed, beatsPerBar = 4) {
    const cols = [];
    const bar = () => cols.push(`<div class="tab-bar" aria-hidden="true"></div>`);
    bar();
    parsed.events.forEach((e, i) => {
      if (i > 0 && Math.abs(e.beat / beatsPerBar - Math.round(e.beat / beatsPerBar)) < 1e-6) bar();
      const rows = ['', '', '', '', '', ''];
      e.notes.forEach(o => { rows[o.n - 1] = noteLabel(o); });
      const maxLen = Math.max(1, ...rows.map(r => r.length));
      const w = Math.max(maxLen + 1.4, Math.round(e.d * 6) + 1);
      const pm = e.notes.some(o => o.pm) ? '<i>PM</i>' : '';
      cols.push(`<div class="tab-col" data-i="${i}" style="--w:${w}"><span class="tab-top">${countLabel(e.beat)}${pm}</span>` +
        rows.map(r => `<span class="tab-cell">${r ? `<b>${r.replace('\\', '&#92;')}</b>` : ''}</span>`).join('') + `</div>`);
    });
    bar();
    host.innerHTML = `<div class="tab" role="img" aria-label="Tablatura"><div class="tab-names"><span class="tab-top"></span>${['e','B','G','D','A','E'].map(n => `<span class="tab-cell">${n}</span>`).join('')}</div>${cols.join('')}</div>`;
    return (idx) => {
      host.querySelectorAll('.tab-col.on').forEach(c => c.classList.remove('on'));
      if (idx == null || idx < 0) return;
      const c = host.querySelector(`.tab-col[data-i="${idx}"]`);
      if (c) {
        c.classList.add('on');
        const box = host;
        const left = c.offsetLeft - box.clientWidth / 3;
        if (c.offsetLeft < box.scrollLeft || c.offsetLeft > box.scrollLeft + box.clientWidth - 40) box.scrollTo({ left, behavior: 'smooth' });
      }
    };
  }

  /** Marcas para o braço a partir dos eventos (todas as notas do lick). */
  function marks(parsed, rootPc) {
    const seen = new Map();
    parsed.events.forEach(e => e.notes.forEach(o => {
      if (o.dead) return;
      const k = o.s + ':' + o.f;
      if (!seen.has(k)) seen.set(k, T.mark(o.s, o.f, rootPc));
      if (o.bend && !o.pre) {
        // o alvo do bend aparece como fantasma uma ou duas casas acima
        const kb = o.s + ':' + (o.f + o.bend);
        if (!seen.has(kb)) seen.set(kb, T.mark(o.s, o.f + o.bend, rootPc, { dim: true, small: true }));
      }
    }));
    return [...seen.values()];
  }

  /** Agenda as notas de uma tablatura a partir de t0. onEv(i, t) para cada evento. */
  function scheduleNotes(parsed, t0, bpm, onEv) {
    const spb = 60 / bpm;
    parsed.events.forEach((e, i) => {
      const t = t0 + e.beat * spb;
      onEv && onEv(i, t);
      const isLast = i === parsed.events.length - 1;
      e.notes.forEach(o => {
        if (o.dead) { A.play(T.TUNING[o.s] + 5, t, { dur: 0.05, vel: 0.5, mute: true, string: o.s }); return; }
        const legato = o.h || o.p || o.sl;
        const dur = isLast ? Math.max(e.d * spb, 1.6) : Math.max(e.d * spb * 1.05, 0.12) + (o.bend || o.vib ? 0.15 : 0.35);
        A.play(T.TUNING[o.s] + o.f, t, {
          dur, string: o.s, vel: legato ? 0.55 : (e.notes.length > 1 ? 0.6 : 0.85),
          slideFrom: o.sl && o.prev != null ? T.TUNING[o.s] + o.prev : null,
          bend: o.bend, release: o.rel, prebend: o.pre, vib: o.vib, mute: o.pm,
        });
      });
    });
  }

  /** Reprodutor. cb.onEvent(i), cb.onEnd() */
  function Player(cb = {}) {
    let raf = null, sched = [], tEnd = 0, opt = {}, parsed = null, playing = false, lastIdx = -1;

    function schedule(t0) {
      scheduleNotes(parsed, t0, opt.bpm, (i, t) => sched.push({ i, t }));
      if (opt.click) {
        const spb = 60 / opt.bpm, beats = Math.ceil(parsed.beats);
        for (let b = 0; b < beats; b++) A.click(t0 + b * spb, b % 4 === 0);
      }
      return t0 + parsed.beats * 60 / opt.bpm;
    }

    function loop() {
      const now = A.ctx.currentTime;
      let idx = -1;
      for (const s of sched) { if (s.t <= now + 0.01) idx = s.i; else break; }
      if (idx !== lastIdx && now >= (sched[0]?.t ?? Infinity) - 0.01) { lastIdx = idx; cb.onEvent?.(idx); }
      if (now >= tEnd - 0.2 && opt.loop && playing) {
        sched = sched.filter(s => s.t > now - 0.05);
        const nextT0 = tEnd;
        tEnd = schedule(nextT0);
        sched.sort((a, b) => a.t - b.t);
      } else if (now >= tEnd && playing) { stop(); cb.onEnd?.(); return; }
      raf = requestAnimationFrame(loop);
    }

    function play(p, o) {
      stop(true);
      A.init();
      parsed = p; opt = Object.assign({ bpm: 90, loop: false, click: false, countIn: true }, o);
      const spb = 60 / opt.bpm;
      let t0 = A.now() + 0.12;
      if (opt.countIn) { for (let b = 0; b < 4; b++) A.click(t0 + b * spb, b === 0); t0 += 4 * spb; }
      sched = []; lastIdx = -2; playing = true;
      tEnd = schedule(t0);
      raf = requestAnimationFrame(loop);
    }

    function stop(silent) {
      playing = false;
      cancelAnimationFrame(raf); raf = null;
      sched = [];
      A.stopAll();
      if (!silent) cb.onEvent?.(-1);
    }

    return { play, stop, get playing() { return playing; } };
  }

  return { parse, render, marks, Player, noteLabel, scheduleNotes };
})();

/* ===== Trilha de aulas — módulos 1 a 4 ===== */
const MODULES = [
  { id:'m1', title:'O mapa do braço', tag:'Fundamentos', lessons:[
    { id:'afinacao', title:'Casas, cordas e a casa 12', min:8,
      body:`<p>A guitarra usa a mesma afinação padrão do violão: <b>Mi Lá Ré Sol Si Mi</b>, da corda 6 (mais grossa) para a corda 1. O que muda é o jeito de tocar: cordas mais finas, braço mais acessível até a casa 22 e muito mais solos acima da casa 5.</p>
<p>Cada casa sobe <b>meio tom</b>. Entre as notas naturais existe um tom inteiro, com duas exceções que você precisa decorar: <b>Mi→Fá</b> e <b>Si→Dó</b> ficam lado a lado, sem casa no meio.</p>
<p>Na <b>casa 12</b> tudo se repete uma oitava acima, com as mesmas notas das cordas soltas. Por isso ela tem a marcação dupla. Se você sabe as notas até a casa 11, sabe o braço inteiro.</p>`,
      demo:{ kind:'natural', strings:[0,5], views:[{label:'Cordas 6 e 1', strings:[0,5]},{label:'Todas as naturais', strings:[0,1,2,3,4,5]}] },
      tasks:['Toque a corda 6 casa por casa falando o nome da nota até a casa 12.','Ache os pares Mi–Fá e Si–Dó em cada corda.'],
      links:[{ to:'quiz', id:'qual-nota', label:'Quiz: qual é a nota?' }] },
    { id:'cordas65', title:'Notas nas cordas 6 e 5', min:10,
      body:`<p>As cordas 6 e 5 são as <b>âncoras</b> do braço. Quase todo desenho de acorde, escala e power chord começa com a tônica numa delas.</p>
<p>Use as marcações como referência: na corda 6, casa 3 = Sol, 5 = Lá, 7 = Si, 8 = Dó, 10 = Ré, 12 = Mi. Na corda 5, casa 3 = Dó, 5 = Ré, 7 = Mi, 8 = Fá, 10 = Sol, 12 = Lá.</p>
<p>Uma meta prática: dizer a nota de qualquer casa dessas duas cordas em menos de 2 segundos.</p>`,
      demo:{ kind:'natural', strings:[0,1] },
      tasks:['Faça o quiz “Ache a nota” só nas cordas 6 e 5 até acertar 10 de 10.','Fale em voz alta: Sol-3, Lá-5, Si-7, Dó-8 na corda 6.'],
      links:[{ to:'quiz', id:'ache-nota', label:'Quiz: ache a nota' }] },
    { id:'oitavas', title:'Desenhos de oitava', min:10,
      body:`<p>Uma oitava é a mesma nota, mais aguda. Na guitarra ela forma desenhos fixos que levam qualquer nota para o braço inteiro:</p>
<ul><li>Corda 6 → corda 4: <b>duas cordas acima, duas casas à frente</b>.</li>
<li>Corda 5 → corda 3: o mesmo desenho, duas casas à frente.</li>
<li>Corda 4 → corda 2 e corda 3 → corda 1: <b>três casas à frente</b>, por causa da corda Si.</li>
<li>Corda 6 → corda 1: mesma casa.</li></ul>
<p>Escolha uma nota e veja todas as posições dela. Esse é o primeiro passo para tocar em qualquer região do braço.</p>`,
      demo:{ kind:'note', root:'C', keySel:true },
      tasks:['Escolha uma nota por dia e toque todas as posições dela, de grave para agudo.','Com metrônomo a 60 BPM, toque a nota em uma corda por clique.'],
      links:[{ to:'quiz', id:'ache-nota', label:'Quiz: ache a nota' }] },
    { id:'cordasi', title:'A corda Si e o deslocamento', min:6,
      body:`<p>Todas as cordas vizinhas estão afinadas em <b>4ª justa</b> (5 casas), menos a dupla <b>Sol→Si</b>, que está em <b>3ª maior</b> (4 casas).</p>
<p>Na prática: qualquer desenho que cruza da corda 3 para a corda 2 anda <b>uma casa para a frente</b>. É por isso que escalas e tríades “quebram” naquele ponto. Quando um desenho parecer torto, confira se ele passa pela corda Si.</p>`,
      demo:{ kind:'interval', root:'G', s:2, f:5, ivs:[0,7,12,16,19], views:[{label:'Sem passar pela Si', s:1, f:5, root:'D'},{label:'Passando pela Si', s:2, f:5, root:'G'}] },
      tasks:['Toque a mesma oitava saindo da corda 5 e depois da corda 4 e compare os desenhos.'] },
  ]},
  { id:'m2', title:'Intervalos e power chords', tag:'Base do rock', lessons:[
    { id:'intervalos', title:'Intervalos como desenhos', min:12,
      body:`<p>Intervalo é a distância entre duas notas. Na guitarra, cada intervalo vira um <b>desenho</b> que funciona em qualquer tom. A partir de uma tônica na corda 6 ou 5:</p>
<ul><li><b>4ª justa</b>: mesma casa, corda de cima.</li>
<li><b>5ª justa</b>: corda de cima, duas casas à frente.</li>
<li><b>3ª maior</b>: corda de cima, uma casa para trás. <b>3ª menor</b>: duas casas para trás.</li>
<li><b>7ª menor</b>: duas cordas acima, mesma casa.</li>
<li><b>Oitava</b>: duas cordas acima, duas casas à frente.</li></ul>
<p>As cores das notas neste app seguem a função: <span class="dot iv-r"></span> tônica, <span class="dot iv-3"></span> terças, <span class="dot iv-5"></span> quintas, <span class="dot iv-7"></span> sétimas.</p>`,
      demo:{ kind:'interval', root:'A', s:0, f:5, ivs:[0,3,4,5,7,10,12], keySel:false, views:[{label:'Da corda 6', s:0, f:5, root:'A'},{label:'Da corda 5', s:1, f:3, root:'C'}] },
      tasks:['Ache a 3ª maior e a 3ª menor de Lá (corda 6, casa 5).','Faça o quiz de intervalos.'],
      links:[{ to:'quiz', id:'intervalo', label:'Quiz: intervalos' },{ to:'quiz', id:'ouvido', label:'Quiz: ouvido' }] },
    { id:'power', title:'Power chords e palm mute', min:12,
      body:`<p>O <b>power chord</b> tem só tônica e 5ª (às vezes a oitava). Sem a terça ele não é maior nem menor, por isso soa limpo mesmo com muita distorção. É a base do rock e do metal.</p>
<p>Desenho: tônica na corda 6 ou 5, 5ª na corda de cima duas casas à frente, oitava na corda seguinte também duas casas à frente.</p>
<p><b>Palm mute</b>: apoie a lateral da mão da palheta sobre as cordas, bem perto da ponte. O som fica curto e grave, o famoso “tchug”. Ative o timbre <b>Drive</b> nas configurações para ouvir o riff como numa guitarra distorcida.</p>`,
      demo:{ kind:'power', root:'E', s:0, keySel:true, views:[{label:'Tônica na corda 6', s:0},{label:'Tônica na corda 5', s:1}] },
      lick:'r3',
      tasks:['Toque o riff com palm mute a 80 BPM; suba 5 BPM quando sair limpo.','Troque entre E5, G5 e A5 sem olhar para a mão.'],
      links:[{ to:'treino', id:'r3', label:'Treinar o riff com metrônomo' }] },
  ]},
  { id:'m3', title:'Tríades', tag:'Gospel, funk, pop', lessons:[
    { id:'triade', title:'O que é uma tríade', min:8,
      body:`<p>Tríade é um acorde de 3 notas: <b>tônica, 3ª e 5ª</b>. A 3ª define o caráter:</p>
<ul><li><b>Maior</b> = tônica + 3ª maior + 5ª justa (alegre, aberto).</li>
<li><b>Menor</b> = tônica + 3ª menor + 5ª justa (melancólico).</li>
<li><b>Diminuta</b> = 3ª menor + 5ª diminuta. <b>Aumentada</b> = 3ª maior + 5ª aumentada.</li></ul>
<p>No violão você toca acordes de 5 ou 6 cordas. Na guitarra, principalmente em banda, as tríades em <b>três cordas vizinhas</b> soam mais definidas, não brigam com o baixo e o teclado e são a base de guitarra em louvor, funk e pop.</p>`,
      demo:{ kind:'triad', root:'C', quality:'maior', set:'123', inv:0, keySel:true, views:[{label:'Maior', quality:'maior'},{label:'Menor', quality:'menor'},{label:'Diminuta', quality:'dim'},{label:'Aumentada', quality:'aum'}] },
      tasks:['Toque as 4 tríades de Dó e escute a diferença.','Diga quais notas mudaram entre maior e menor (só a 3ª).'] },
    { id:'triade-123', title:'Tríades nas cordas 1-2-3', min:15,
      body:`<p>Toda tríade tem <b>3 inversões</b>, conforme a nota que fica embaixo:</p>
<ul><li><b>Fundamental</b>: a tônica embaixo (R-3-5).</li>
<li><b>1ª inversão</b>: a 3ª embaixo (3-5-R).</li>
<li><b>2ª inversão</b>: a 5ª embaixo (5-R-3).</li></ul>
<p>Nas cordas 1-2-3, as três inversões de um acorde maior cobrem o braço inteiro e depois se repetem a partir da casa 12. Decore os três desenhos e a posição da tônica em cada um. A tônica é a nota vermelha.</p>`,
      demo:{ kind:'triad', root:'G', quality:'maior', set:'123', inv:-1, keySel:true, views:[{label:'Todas', inv:-1},{label:'Fundamental', inv:0},{label:'1ª inv.', inv:1},{label:'2ª inv.', inv:2},{label:'Menor', inv:-1, quality:'menor'}] },
      tasks:['Toque as 3 inversões de Sol subindo e descendo o braço.','Repita em Ré e em Lá.','Faça o quiz de tríades.'],
      links:[{ to:'quiz', id:'triade', label:'Quiz: tríade e inversão' }] },
    { id:'triade-234', title:'Tríades nas cordas 2-3-4 e 3-4-5', min:15,
      body:`<p>O mesmo raciocínio vale para os outros grupos de cordas. Os desenhos mudam porque cada grupo tem uma relação diferente com a corda Si:</p>
<ul><li><b>Cordas 2-3-4</b>: a corda Si está em cima, então só o último salto anda uma casa.</li>
<li><b>Cordas 3-4-5</b> e <b>4-5-6</b>: nenhuma corda Si no caminho, os desenhos são “retos”.</li></ul>
<p>Dica de estudo: escolha uma região do braço (por exemplo, entre as casas 5 e 8) e ache a mesma tríade em todos os grupos de cordas sem sair dela.</p>`,
      demo:{ kind:'triad', root:'D', quality:'maior', set:'234', inv:-1, keySel:true, views:[{label:'2-3-4', set:'234'},{label:'3-4-5', set:'345'},{label:'4-5-6', set:'456'}] },
      tasks:['Ache Ré maior nas cordas 2-3-4 nas 3 inversões.','Fique entre as casas 5 e 8 e toque Ré maior em todos os grupos.'],
      links:[{ to:'quiz', id:'triade', label:'Quiz: tríade e inversão' }] },
    { id:'triade-prog', title:'Tríades numa progressão (I–V–vi–IV)', min:15,
      body:`<p>A progressão <b>I–V–vi–IV</b> (em Sol: G–D–Em–C) aparece em muitas músicas de louvor e pop. Em vez de pular de pestana em pestana, a guitarra escolhe a inversão <b>mais próxima</b> de cada acorde. Isso se chama <b>condução de vozes</b>.</p>
<p>No lick desta aula, os quatro acordes ficam entre as casas 5 e 9 nas cordas 1-2-3. Note como cada acorde muda poucas notas em relação ao anterior. Toque arpejado, com delay e reverb no pedal, e você tem uma base de guitarra de louvor.</p>`,
      demo:{ kind:'lick', lick:'g1' }, lick:'g1',
      tasks:['Toque o lick a 70 BPM e depois a 90 BPM.','Faça o mesmo caminho em Ré (D–A–Bm–G).'],
      links:[{ to:'treino', id:'g1', label:'Treinar com metrônomo' },{ to:'jam', id:'pop', label:'Tocar sobre a base I–V–vi–IV' }] },
  ]},
  { id:'m4', title:'Sistema CAGED', tag:'Organizar o braço', lessons:[
    { id:'caged', title:'As cinco formas', min:15,
      body:`<p>Você já conhece cinco acordes abertos do violão: <b>C, A, G, E e D</b>. O sistema CAGED usa esses cinco desenhos como formas móveis. Qualquer acorde maior pode ser tocado com cada uma delas, e elas se encaixam uma na outra ao longo do braço, sempre na ordem C→A→G→E→D (e recomeça).</p>
<p>Escolha uma tonalidade e passe pelas formas. Cada uma compartilha notas com a vizinha, e a tônica (vermelha) é o ponto de ligação. É isso que transforma o braço em um mapa contínuo em vez de pedaços soltos.</p>`,
      demo:{ kind:'caged', root:'C', quality:'maior', shape:'all', layer:'chord', keySel:true, views:[{label:'Todas', shape:'all'},{label:'C', shape:'C'},{label:'A', shape:'A'},{label:'G', shape:'G'},{label:'E', shape:'E'},{label:'D', shape:'D'}] },
      tasks:['Toque Dó maior nas 5 formas, uma após a outra, subindo o braço.','Repita em Sol e em Lá. Diga o nome da forma antes de tocar.'] },
    { id:'caged-menor', title:'CAGED menor', min:12,
      body:`<p>As mesmas cinco formas existem para acordes menores (Cm, Am, Gm, Em, Dm). A diferença está só na 3ª, que desce uma casa.</p>
<p>As formas de <b>Am</b> e <b>Em</b> são as mais usadas como pestana. A forma de <b>Dm</b> é ótima nas cordas agudas. As formas de Cm e Gm são mais difíceis como acorde, mas muito úteis como <b>mapa para solar</b>.</p>`,
      demo:{ kind:'caged', root:'A', quality:'menor', shape:'all', layer:'chord', keySel:true, views:[{label:'Todas', shape:'all'},{label:'C', shape:'C'},{label:'A', shape:'A'},{label:'G', shape:'G'},{label:'E', shape:'E'},{label:'D', shape:'D'}] },
      tasks:['Compare a forma de E maior e E menor no mesmo tom: qual nota mudou?'] },
    { id:'caged-arpejo', title:'Arpejos e pentatônica dentro do CAGED', min:15,
      body:`<p>Arpejo é tocar as notas do acorde uma por vez. Dentro de cada forma CAGED, as notas do acorde aparecem em todas as cordas, e é aí que mora o segredo de um solo melódico: <b>terminar as frases nas notas do acorde</b>.</p>
<p>Ligue a camada “Pentatônica”: a pentatônica maior aparece em volta de cada forma. Cada forma CAGED corresponde a uma das cinco caixas da pentatônica. Aprender um sistema ajuda o outro.</p>`,
      demo:{ kind:'caged', root:'G', quality:'maior', shape:'E', layer:'arp', keySel:true, views:[{label:'Acorde', layer:'chord'},{label:'Arpejo', layer:'arp'},{label:'Pentatônica', layer:'pent'}] },
      tasks:['Toque o arpejo da forma E de Sol, subindo e descendo.','Improvise na pentatônica e termine cada frase numa nota vermelha.'],
      links:[{ to:'jam', id:'pop', label:'Improvisar sobre uma base' }] },
  ]},
];

/* ===== Trilha de aulas — módulos 5 a 8 ===== */
MODULES.push(
  { id:'m5', title:'Pentatônica e blues', tag:'Rock e blues', lessons:[
    { id:'pent1', title:'Pentatônica menor: caixa 1', min:15,
      body:`<p>A pentatônica menor tem 5 notas: <b>R, ♭3, 4, 5, ♭7</b>. É a escala mais usada em solos de rock e blues, porque quase não tem nota “errada” sobre acordes menores e sobre o blues.</p>
<p>A <b>caixa 1</b> é o desenho com a tônica na corda 6 sob o dedo 1. Em Lá, fica na casa 5: duas notas por corda, dedos 1 e 4 nas cordas 6, 2 e 1 e dedos 1 e 3 nas cordas 5, 4 e 3.</p>
<p>Use <b>palhetada alternada</b> (baixo, cima, baixo, cima) desde o primeiro dia. Velocidade vem depois. Comece no metrônomo a 60 BPM em colcheias.</p>`,
      demo:{ kind:'scale', scale:'pent_menor', root:'A', pos:0, keySel:true, views:[{label:'Intervalos', labels:'iv'},{label:'Notas', labels:'note'}] },
      lick:'r1',
      tasks:['Suba e desça a caixa 1 a 60 BPM, palhetada alternada.','Toque o lick de tercinas devagar e suba 5 BPM por dia.'],
      links:[{ to:'treino', id:'ex-pent', label:'Treino de velocidade da caixa 1' }] },
    { id:'pent5', title:'As cinco caixas', min:20,
      body:`<p>A pentatônica tem <b>5 caixas</b>, uma começando em cada nota da escala na corda 6. A última nota de uma caixa é a primeira da seguinte, então elas se encaixam como peças e cobrem o braço todo.</p>
<p>A forma mais rápida de ligar as caixas é pela <b>tônica</b>: ache a nota vermelha em cada desenho. As caixas 1 e 2 (casas 5 a 10 em Lá) são as mais usadas, e a caixa 4 aparece muito em solos clássicos na região da casa 12 e acima.</p>`,
      demo:{ kind:'scale', scale:'pent_menor', root:'A', pos:0, keySel:true, views:[{label:'Caixa 1', pos:0},{label:'Caixa 2', pos:1},{label:'Caixa 3', pos:2},{label:'Caixa 4', pos:3},{label:'Caixa 5', pos:4},{label:'Braço inteiro', pos:-1}] },
      tasks:['Aprenda uma caixa nova por semana.','Toque a caixa 1 e deslize para a caixa 2 sem parar.'],
      links:[{ to:'jam', id:'rock', label:'Improvisar sobre Am–G–F–G' }] },
    { id:'pentmaior', title:'Pentatônica maior e a relativa', min:12,
      body:`<p>A pentatônica maior (<b>R, 2, 3, 5, 6</b>) usa exatamente os <b>mesmos desenhos</b> da menor. Só muda qual nota é a tônica.</p>
<p>Regra prática: a pentatônica menor de Lá tem as mesmas notas da pentatônica maior de Dó. Para achar a maior de um tom, recue <b>3 casas</b> a partir da tônica menor. Sol maior = Mi menor, que fica 3 casas abaixo.</p>
<p>A pentatônica maior soa mais alegre, aberta e “country/gospel”. Em louvor e soul, ela aparece misturada com tríades e sextas.</p>`,
      demo:{ kind:'scale', scale:'pent_maior', root:'C', pos:4, keySel:true, views:[{label:'Dó maior', root:'C', scale:'pent_maior'},{label:'Lá menor', root:'A', scale:'pent_menor', pos:0}] },
      lick:'g4',
      tasks:['Toque a mesma caixa pensando em Lá menor e depois em Dó maior: termine as frases em notas diferentes.'] },
    { id:'blues', title:'Escala blues e a blue note', min:12,
      body:`<p>A escala blues é a pentatônica menor com uma nota a mais: a <b>♭5</b>, chamada de <b>blue note</b>. Ela é uma nota de passagem: soa tensa parada, e linda quando você passa por ela indo para a 4ª ou para a 5ª.</p>
<p>Na caixa 1 em Lá, a blue note (Ré♯/Mi♭) aparece na corda 5, casa 6, e na corda 3, casa 8. Toque o lick desta aula e preste atenção no “gemido” do slide até ela.</p>`,
      demo:{ kind:'scale', scale:'blues', root:'A', pos:0, keySel:true, views:[{label:'Caixa 1', pos:0},{label:'Caixa 2', pos:1},{label:'Braço inteiro', pos:-1}] },
      lick:'b4',
      tasks:['Toque a escala blues subindo e descendo.','Crie uma frase que passe pela blue note e termine na tônica.'],
      links:[{ to:'jam', id:'blues', label:'Improvisar sobre um blues em Lá' }] },
    { id:'tecnicas', title:'Bend, vibrato, slide e ligados', min:20,
      body:`<p>É na técnica de mão esquerda que a guitarra mais se diferencia do violão:</p>
<ul><li><b>Bend (b)</b>: empurre a corda para cima até a nota soar 1 tom (2 casas) ou ½ tom acima. Use 2 ou 3 dedos juntos e confira a afinação tocando a nota-alvo antes.</li>
<li><b>Release (r)</b>: volte o bend até a nota original sem palhetar.</li>
<li><b>Vibrato (~)</b>: pequenos bends repetidos e regulares. É a “assinatura” de cada guitarrista.</li>
<li><b>Slide (/ e \\)</b>: deslize até a próxima casa mantendo pressão.</li>
<li><b>Hammer-on (h) e pull-off (p)</b>: notas tocadas só com a mão esquerda, sem palhetar.</li></ul>`,
      demo:{ kind:'lick', lick:'r2' }, lick:'r2',
      tasks:['Bend de 1 tom na corda 3, casa 7: toque antes a casa 9 para ouvir o alvo.','Vibrato a 4 oscilações por segundo numa nota longa.'],
      links:[{ to:'licks', id:'r4', label:'Lick com bend em double stop' }] },
    { id:'blues12', title:'Blues de 12 compassos', min:20,
      body:`<p>O blues tem uma forma fixa de 12 compassos com três acordes: <b>I, IV e V</b>. Em Lá: A7, D7 e E7.</p>
<p class="mono-line">| A7 | D7 | A7 | A7 |<br>| D7 | D7 | A7 | A7 |<br>| E7 | D7 | A7 | E7 |</p>
<p>O estudo desta aula é um solo completo sobre essa forma. Repare nos espaços: blues é pergunta e resposta. Toque uma frase, deixe respirar, responda. E repare nas notas que mudam com o acorde: Fá♯ sobre o D7, Sol♯ sobre o E7.</p>`,
      demo:{ kind:'lick', lick:'s2' }, lick:'s2',
      tasks:['Toque o solo a 60% da velocidade e vá subindo.','Toque sobre a base de blues em Lá e crie seu próprio solo usando só a caixa 1.'],
      links:[{ to:'jam', id:'blues', label:'Base de blues em Lá' }] },
  ]},
  { id:'m6', title:'Escala maior e modos', tag:'Melodia', lessons:[
    { id:'maior3nps', title:'Escala maior com 3 notas por corda', min:15,
      body:`<p>Você já conhece a escala maior. No violão ela costuma ser tocada numa região só, com abertura de 4 dedos. Na guitarra, o sistema de <b>3 notas por corda</b> (3NPS) é muito popular: cada corda tem exatamente 3 notas, o que deixa a palhetada regular e facilita ligados e velocidade.</p>
<p>São 7 posições, uma começando em cada grau da escala na corda 6. As posições se sobrepõem: as duas últimas notas de cada corda são as duas primeiras da posição seguinte.</p>`,
      demo:{ kind:'scale', scale:'maior', root:'G', pos:0, keySel:true, views:[{label:'Pos. 1', pos:0},{label:'Pos. 2', pos:1},{label:'Pos. 3', pos:2},{label:'Pos. 4', pos:3},{label:'Pos. 5', pos:4},{label:'Pos. 6', pos:5},{label:'Pos. 7', pos:6},{label:'Braço', pos:-1}] },
      tasks:['Toque a posição 1 de Sol maior em semicolcheias a 70 BPM.','Ligue a posição 1 à posição 2 subindo pela corda 1.'],
      links:[{ to:'treino', id:'ex-3nps', label:'Treino de velocidade 3NPS' }] },
    { id:'menor-relativa', title:'Menor natural e a relativa', min:12,
      body:`<p>Toda escala maior tem uma <b>relativa menor</b> com as mesmas notas, começando no 6º grau. Dó maior e Lá menor são o mesmo conjunto de notas, com outro centro.</p>
<p>A menor natural é a pentatônica menor com duas notas a mais: a <b>2</b> e a <b>♭6</b>. Elas dão um sabor mais melódico e dramático ao solo, muito usado no rock e no metal.</p>`,
      demo:{ kind:'scale', scale:'menor', root:'A', pos:0, keySel:true, views:[{label:'Menor natural', scale:'menor'},{label:'Só a pentatônica', scale:'pent_menor'}] },
      tasks:['Toque a pentatônica e depois a menor natural na mesma região: ache as 2 notas novas.'] },
    { id:'modos', title:'Modos que o guitarrista usa', min:20,
      body:`<p>Modo é uma escala maior tocada a partir de outro grau. Para o dia a dia, pense em cada modo como uma escala conhecida com <b>uma nota característica</b>:</p>
<ul><li><b>Dórico</b> = menor natural com <b>6 maior</b>. Rock, funk, fusion (Santana).</li>
<li><b>Mixolídio</b> = maior com <b>♭7</b>. Blues, rock clássico, sobre acordes com 7.</li>
<li><b>Frígio</b> = menor com <b>♭2</b>. Metal, flamenco.</li>
<li><b>Lídio</b> = maior com <b>♯4</b>. Sonoridade de trilha de filme, flutuante.</li></ul>

/* ===== Progresso: conta (db) com cópia local ===== */
const S = (() => {
  const KEY = 'mapa-do-braco-v1';
  const DEF = () => ({ v:1, done:{}, bpm:{}, quiz:{}, days:[],
    settings:{ latin:false, lefty:false, frets:15, tone:'clean', volume:0.8 } });
  let state = DEF(), ref = null, mode = 'local', timer = null, writing = Promise.resolve();
  const subs = new Set();

  try { const raw = localStorage.getItem(KEY); if (raw) state = Object.assign(DEF(), JSON.parse(raw)); } catch (e) {}
  state.settings = Object.assign(DEF().settings, state.settings);

  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

  function merge(a, b) {
    const out = DEF();
    out.done = Object.assign({}, b.done, a.done);
    for (const src of [a.bpm || {}, b.bpm || {}]) for (const k in src) out.bpm[k] = Math.max(out.bpm[k] || 0, src[k]);
    for (const src of [a.quiz || {}, b.quiz || {}]) for (const k in src) {
      const cur = out.quiz[k];
      if (!cur || src[k].best > cur.best) out.quiz[k] = src[k];
    }
    out.days = [...new Set([...(a.days || []), ...(b.days || [])])].sort().slice(-400);
    out.settings = Object.assign(DEF().settings, b.settings, a.settings);
    return out;
  }

  function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function scheduleRemote() {
    if (!ref) return;
    clearTimeout(timer);
    timer = setTimeout(() => {
      const body = JSON.parse(JSON.stringify(state));
      writing = writing.then(() => ref.set(body)).then(() => { if (mode !== 'conta') { mode = 'conta'; emit(); } })
        .catch(e => { if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { ref = null; mode = 'local'; emit(); } });
    }, 1200);
  }

  function emit() { subs.forEach(fn => { try { fn(state, mode); } catch (e) { console.error(e); } }); }

  function update(fn) {
    fn(state);
    saveLocal();
    scheduleRemote();
    emit();
  }

  async function connect() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const r = db.doc('data/users/' + id + '/progress');
      const snap = await r.get();
      ref = r; mode = 'conta';
      const remote = snap.exists ? snap.data() : null;
      if (remote) { state = merge(remote, state); saveLocal(); }
      const hasLocal = Object.keys(state.done).length || state.days.length || Object.keys(state.bpm).length;
      const differs = remote ? JSON.stringify(merge(remote, {})) !== JSON.stringify(state) : hasLocal;
      if (differs) scheduleRemote();
      emit();
    } catch (e) { mode = 'local'; emit(); }
  }

  function practiced() {
    const d = today();
    if (!state.days.includes(d)) update(s => { s.days.push(d); });
  }

  function streak() {
    const set = new Set(state.days);
    let n = 0; const d = new Date();
    if (!set.has(today())) d.setDate(d.getDate() - 1);
    for (;;) {
      const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      if (!set.has(k)) break;
      n++; d.setDate(d.getDate() - 1);
    }
    return n;
  }

  // fora do Claude (arquivo local, GitHub Pages, app instalado) não existe window.claude
  const standalone = !(window.claude && typeof window.claude.use === 'function');

  function importData(obj) {
    if (!obj || typeof obj !== 'object' || !obj.done || !obj.settings) throw new Error('Arquivo de backup inválido');
    state = merge(obj, state);
    saveLocal(); scheduleRemote(); emit();
  }
  const exportData = () => JSON.stringify(Object.assign({ app: 'mapa-do-braco', exportedAt: new Date().toISOString() }, state), null, 1);

  return {
    get: () => state, get mode() { return mode; }, standalone, importData, exportData,
    update, connect, practiced, streak, today,
    on(fn) { subs.add(fn); return () => subs.delete(fn); },
    reset() { const keep = state.settings; state = DEF(); state.settings = keep; saveLocal(); scheduleRemote(); emit(); },
  };
})();
