const QUAL_SUFFIX = { maior:'', menor:'m', dom7:'7', maj7:'7M', m7:'m7', m7b5:'m7(b5)', dim7:'°7', six:'6', m6:'m6', nine:'9', m9:'m9', maj9:'7M(9)',
  thirteen:'13', b9:'7(b9)', s9:'7(#9)', sus2:'sus2', sus4:'sus4', aum:'+', dim:'°', power:'5', add9:'add9' };

(() => {
  // novas cifras reconhecidas pelo parser
  const extra = { '6':'six', 'm6':'m6', '9':'nine', 'm9':'m9', '7M(9)':'maj9', 'maj9':'maj9', '13':'thirteen', '7(b9)':'b9', '7b9':'b9',
    '7(#9)':'s9', '7#9':'s9', '°7':'dim7', 'dim7':'dim7', '+':'aum', 'aug':'aum', 'add9':'add9' };
  Object.assign(CH.SUFFIX, extra);

  /** Todas as formas de um acorde no braço (aberta, se houver, e móveis). */
  CH.voicings = (rootPc, q, maxFret = 15) => {
    const name = T.ROOTS[T.mod(rootPc)] + (QUAL_SUFFIX[q] ?? '');
    const out = [];
    if (CH.OPEN[name]) out.push(Object.assign({ name, k: 'Aberta' }, CH.OPEN[name]));
    (VOICINGS[q] || []).forEach(v => {
      let f = T.mod(rootPc - T.TUNING[v.rs]);
      const offs = v.o.filter(o => o !== -9);
      if (f + Math.min(...offs) < 1) f += 12;
      if (f + Math.max(...offs) > maxFret && f - 12 + Math.min(...offs) >= 1) f -= 12;
      const frets = v.o.map(o => o === -9 ? -1 : f + o);
      if (frets.some(x => x > maxFret)) return;
      const same = frets.map((x, i) => x === f ? i : -1).filter(i => i >= 0);
      const sh = { name, k: v.k, f: frets, d: frets.map(() => 0) };
      if (same.length >= 3 && v.o.filter(o => o === 0).length >= 3 && Math.min(...offs) === 0) sh.b = { f, from: Math.min(...same), to: Math.max(...same) };
      out.push(sh);
    });
    return out;
  };

  // acordes sem forma aberta caem na primeira forma móvel
  const baseGet = CH.get;
  CH.get = (name, prefer) => {
    const sh = baseGet(name, prefer);
    if (sh) return sh;
    const p = CH.parse(name); if (!p) return null;
    const v = CH.voicings(p.root, p.q)[0];
    return v ? Object.assign({}, v, { name }) : null;
  };
})();

/** Campo harmônico: tríades e tétrades de cada grau. */
function harmonize(rootPc, scaleKey) {
  const iv = T.SCALES[scaleKey].iv, flats = T.useFlats(rootPc, T.SCALES[scaleKey].parent);
  const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
  const tri = { '4,7':'maior', '3,7':'menor', '3,6':'dim', '4,8':'aum' };
  const tet = { '4,7,11':'maj7', '3,7,10':'m7', '4,7,10':'dom7', '3,6,10':'m7b5', '3,6,9':'dim7', '3,7,11':'mmaj7', '4,8,11':'aummaj7' };
  return iv.map((d, i) => {
    const at = k => T.mod(iv[(i + k) % 7] - d);
    const t3 = tri[`${at(2)},${at(4)}`] || 'maior';
    const t4 = tet[`${at(2)},${at(4)},${at(6)}`] || 'm7';
    const pc = T.mod(rootPc + d);
    const nm = (flats ? T.FLAT : T.SHARP)[pc];
    const minor = t3 === 'menor' || t3 === 'dim';
    let roman = ROMAN[i]; if (minor) roman = roman.toLowerCase();
    const acc = T.mod(d - T.SCALES.maior.iv[i]);
    if (acc === 11) roman = '♭' + roman; else if (acc === 1) roman = '♯' + roman;
    const sym4 = { maj7:'7M', m7:'m7', dom7:'7', m7b5:'m7(b5)', dim7:'°7', mmaj7:'m(7M)', aummaj7:'+(7M)' }[t4];
    return { deg: i + 1, pc, roman: roman + (t3 === 'dim' ? '°' : t3 === 'aum' ? '+' : ''), triad: nm + QUAL_SUFFIX[t3], tetrad: nm + sym4, q3: t3, q4: t4,
      fn: ['T', 'SD', 'T', 'SD', 'D', 'T', 'D'][i] };
  });
}

/* ===== Áudio: corda sintetizada (Karplus-Strong), timbres, cliques e relógio ===== */
const A = (() => {
  let ctx = null, master, gtrIn, cleanG, driveG, revSend, clickBus, backBus;
  const cache = new Map();
  const voices = {};
  let live = [];
  let tone = 'clean', volume = 0.8;

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
    // iPhone: toca mesmo com a chave de silencioso ligada (Safari 16.4+)
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = volume;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    master.connect(comp); comp.connect(ctx.destination);

    // reverb curto de sala
    const conv = ctx.createConvolver();
    const len = Math.floor(ctx.sampleRate * 1.3);
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    conv.buffer = ir;
    revSend = ctx.createGain(); revSend.gain.value = 0.16;
    revSend.connect(conv); conv.connect(master);

    gtrIn = ctx.createGain();
    // limpo
    cleanG = ctx.createGain();
    const cleanLP = ctx.createBiquadFilter(); cleanLP.type = 'lowpass'; cleanLP.frequency.value = 6500;
    gtrIn.connect(cleanG); cleanG.connect(cleanLP); cleanLP.connect(master); cleanLP.connect(revSend);
    // drive: ganho -> saturação -> falante
    driveG = ctx.createGain();
    const pre = ctx.createGain(); pre.gain.value = 9;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 110;
    const sh = ctx.createWaveShaper();
    const curve = new Float32Array(2048);
    for (let i = 0; i < 2048; i++) { const x = i / 1023.5 - 1; curve[i] = Math.tanh(2.6 * x); }
    sh.curve = curve; sh.oversample = '2x';
    const mid = ctx.createBiquadFilter(); mid.type = 'peaking'; mid.frequency.value = 900; mid.gain.value = 4; mid.Q.value = 0.8;
    const cab = ctx.createBiquadFilter(); cab.type = 'lowpass'; cab.frequency.value = 3600; cab.Q.value = 0.9;
    const post = ctx.createGain(); post.gain.value = 0.22;
    gtrIn.connect(driveG); driveG.connect(hp); hp.connect(pre); pre.connect(sh); sh.connect(mid); mid.connect(cab); cab.connect(post);
    post.connect(master); post.connect(revSend);

    clickBus = ctx.createGain(); clickBus.gain.value = 0.9; clickBus.connect(master);
    // base do jam: sempre limpa, um pouco mais escura
    backBus = ctx.createGain(); backBus.gain.value = 0.55;
    const backLP = ctx.createBiquadFilter(); backLP.type = 'lowpass'; backLP.frequency.value = 3200;
    backBus.connect(backLP); backLP.connect(master); backLP.connect(revSend);
    setTone(tone);
    return ctx;
  }

  function setTone(t) {
    tone = t;
    if (!ctx) return;
    cleanG.gain.value = t === 'clean' ? 1 : 0;
    driveG.gain.value = t === 'drive' ? 1 : 0;
  }
  function setVolume(v) { volume = v; if (master) master.gain.value = v; }

  function buffer(midi) {
    if (cache.has(midi)) return cache.get(midi);
    const sr = ctx.sampleRate;
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    const dur = midi < 45 ? 3.4 : midi < 60 ? 2.8 : 2.2;
    const len = Math.floor(sr * dur);
    const buf = ctx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    const S = midi < 52 ? 0.5 : midi < 66 ? 0.4 : 0.3;
    const P = sr / f - S;
    const Ni = Math.floor(P), fr = P - Ni;
    const t60 = midi < 52 ? 5 : midi < 66 ? 4 : 3;
    const rho = Math.pow(0.001, 1 / (f * t60));
    // excitação: ruído suavizado (palheta média)
    let prev = 0;
    for (let i = 0; i < Ni + 2 && i < len; i++) { const r = Math.random() * 2 - 1; prev = prev * 0.45 + r * 0.55; d[i] = prev; }
    let mean = 0; for (let i = 0; i < Ni + 2; i++) mean += d[i]; mean /= (Ni + 2);
    for (let i = 0; i < Ni + 2; i++) d[i] -= mean;
    let dPrev = 0;
    for (let n = Ni + 2; n < len; n++) {
      const del = (1 - fr) * d[n - Ni] + fr * d[n - Ni - 1];
      d[n] = rho * ((1 - S) * del + S * dPrev);
      dPrev = del;
    }
    const fade = Math.floor(sr * 0.08);
    for (let i = 0; i < fade; i++) d[len - 1 - i] *= i / fade;
    cache.set(midi, buf);
    return buf;
  }

  /**
   * Toca uma nota. o: { dur, vel, string, bend, release, prebend, slideFrom, vib, mute, dry }
   */
  function play(midi, when, o = {}) {
    init();
    const t = Math.max(when ?? ctx.currentTime, ctx.currentTime);
    const src = ctx.createBufferSource();
    src.buffer = buffer(midi);
    const g = ctx.createGain();
    const vel = (o.vel ?? 0.8) * (o.mute ? 0.9 : 1);
    g.gain.setValueAtTime(vel, t);
    let out = g;
    if (o.mute) {
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1300;
      g.connect(lp); out = lp;
      g.gain.setTargetAtTime(0, t + 0.06, 0.07);
    }
    src.connect(g);
    out.connect(o.bus === 'back' ? backBus : (o.bus || gtrIn));
    const pr = src.playbackRate;
    const len = o.dur ?? 2.4;
    if (o.slideFrom != null) {
      pr.setValueAtTime(Math.pow(2, (o.slideFrom - midi) / 12), t);
      pr.linearRampToValueAtTime(1, t + Math.min(0.09, len * 0.5));
    }
    if (o.bend) {
      const r = Math.pow(2, o.bend / 12);
      if (o.prebend) pr.setValueAtTime(r, t); else { pr.setValueAtTime(1, t); pr.setTargetAtTime(r, t + 0.03, 0.045); }
      if (o.release) pr.setTargetAtTime(1, t + len * 0.55, 0.04);
    }
    if (o.vib) {
      const lfo = ctx.createOscillator(); lfo.frequency.value = 5.6;
      const lg = ctx.createGain(); lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0.018, t + 0.25);
      lfo.connect(lg); lg.connect(pr); lfo.start(t); lfo.stop(t + len + 0.2);
    }
    src.start(t);
    if (o.dur != null) {
      g.gain.setValueAtTime(vel, t + len);
      g.gain.linearRampToValueAtTime(0, t + len + 0.07);
      src.stop(t + len + 0.1);
    }
    // abafa a nota anterior na mesma corda
    if (o.string != null) {
      const pv = voices[o.string];
      if (pv && pv.t < t) { pv.g.gain.cancelScheduledValues(t); pv.g.gain.setTargetAtTime(0, t, 0.012); }
      voices[o.string] = { g, t };
    }
    const v = { src, g, end: t + len + 0.1 };
    live.push(v);
    if (live.length > 80) live = live.filter(x => x.end > ctx.currentTime);
    return v;
  }

  function stopAll() {
    if (!ctx) return;
    const now = ctx.currentTime;
    live.forEach(v => { try { v.g.gain.cancelScheduledValues(now); v.g.gain.setTargetAtTime(0, now, 0.02); v.src.stop(now + 0.15); } catch (e) {} });
    live = [];
    Object.keys(voices).forEach(k => delete voices[k]);
  }

  function click(t, accent) {
    init();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = accent ? 1750 : 1150;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(accent ? 0.35 : 0.2, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    o.connect(g); g.connect(clickBus); o.start(t); o.stop(t + 0.06);
  }

  function tick(t) {
    init();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 900;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    o.connect(g); g.connect(clickBus); o.start(t); o.stop(t + 0.04);
  }

  let noiseBuf = null;
  function noise() {
    if (noiseBuf) return noiseBuf;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }
  function drum(kind, t, vel = 1) {
    init();
    if (kind === 'kick') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
      g.gain.setValueAtTime(0.9 * vel, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
      o.connect(g); g.connect(clickBus); o.start(t); o.stop(t + 0.35);
      return;
    }
    const s = ctx.createBufferSource(); s.buffer = noise();
    const f = ctx.createBiquadFilter(), g = ctx.createGain();
    if (kind === 'hat') { f.type = 'highpass'; f.frequency.value = 7000; g.gain.setValueAtTime(0.18 * vel, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05); }
    else { f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 0.7; g.gain.setValueAtTime(0.5 * vel, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18); }
    s.connect(f); f.connect(g); g.connect(clickBus); s.start(t); s.stop(t + 0.25);
  }
  function bass(midi, t, dur) {
    init();
    play(midi, t, { dur, vel: 1, bus: 'back', string: 'bass' });
  }

  // mantém a tela do celular acesa enquanto o metrônomo ou a base estiverem tocando
  let lock = null, locks = 0;
  async function wake(on) {
    locks = Math.max(0, locks + (on ? 1 : -1));
    try {
      if (locks > 0 && !lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); }
      else if (locks === 0 && lock) { await lock.release(); lock = null; }
    } catch (e) { lock = null; }
  }

  /** Relógio com agendamento antecipado. onTick(tickIndex, time) por subdivisão. */
  function Clock(getBpm, perBeat, onTick) {
    let timer = null, next = 0, i = 0;
    const self = {
      running: false,
      start() {
        init();
        if (self.running) return;
        i = 0; next = ctx.currentTime + 0.12; self.running = true; wake(true);
        timer = setInterval(() => {
          while (next < ctx.currentTime + 0.12) {
            onTick(i, next);
            next += 60 / getBpm() / perBeat; i++;
          }
        }, 25);
      },
      stop() { if (self.running) wake(false); clearInterval(timer); timer = null; self.running = false; },
    };
    return self;
  }

  const now = () => (init(), ctx.currentTime);
  return { init, play, stopAll, click, tick, drum, bass, setTone, setVolume, Clock, now, get ctx() { return ctx; } };
})();

/* ===== Ritmo: levadas, palhetada de acordes e escrita rítmica ===== */
const RH = (() => {
  /* Levadas. beats = tempos por compasso, sub = divisões por tempo.
     D/U = para baixo/para cima soando, X = abafado (chuck), x = abafado leve para cima,
     B = baixo (nota mais grave do acorde), b = baixo alternado, '-' = mão passa sem tocar. */
  const PATTERNS = [
    { id:'semi', name:'Uma por tempo', style:'Primeiros passos', beats:4, sub:2, p:'D-D-D-D-', bpm:70 },
    { id:'colcheias', name:'Colcheias ↓↑', style:'Base de tudo', beats:4, sub:2, p:'DUDUDUDU', bpm:70 },
    { id:'pop', name:'Pop / violão de roda', style:'Pop, MPB, louvor', beats:4, sub:2, p:'D-DU-UDU', bpm:80 },
    { id:'balada', name:'Balada', style:'Pop, louvor', beats:4, sub:2, p:'D--UD-DU', bpm:70 },
    { id:'rock', name:'Rock em colcheias', style:'Rock', beats:4, sub:2, p:'DDDDDDDD', bpm:110, accent:[0, 4] },
    { id:'reggae', name:'Reggae (contratempo)', style:'Reggae', beats:4, sub:2, p:'-X-X-X-X', bpm:76 },
    { id:'chuck', name:'Pop com abafado', style:'Pop, funk leve', beats:4, sub:2, p:'D-XU-UXU', bpm:90 },
    { id:'funk', name:'Funk em semicolcheias', style:'Funk, black music', beats:4, sub:4, p:'D-xUX-xUD-xUX-xU', bpm:92 },
    { id:'country', name:'Baixo e acorde', style:'Country, sertanejo', beats:4, sub:2, p:'B-D-b-D-', bpm:96 },
    { id:'valsa', name:'Valsa 3/4', style:'Valsa, guarânia', beats:3, sub:2, p:'B-D-D-', bpm:96 },
    { id:'seisoito', name:'Balada 6/8', style:'Louvor, baladas', beats:2, sub:3, p:'D-UD-U', bpm:58 },
    { id:'shuffle', name:'Shuffle', style:'Blues, rock clássico', beats:4, sub:2, p:'DUDUDUDU', bpm:90, swing:true, accent:[2, 6] },
  ];
  const patById = id => PATTERNS.find(p => p.id === id) || PATTERNS[0];

  function chuck(t, vel = 0.5) {
    A.drum('snare', t, vel * 0.35);
    A.drum('hat', t, vel * 0.8);
  }

  /** Toca um golpe de palheta no acorde. */
  function hit(sym, chordName, t, slotDur, accent) {
    if (sym === '-') return;
    const sh = CH.get(chordName); if (!sh) return;
    const v = CH.voicing(sh);
    const vel = (accent ? 0.62 : 0.48);
    if (sym === 'X' || sym === 'x') {
      chuck(t, sym === 'X' ? 1 : 0.6);
      v.slice(sym === 'X' ? 0 : 2).forEach((n, i) => A.play(n.midi, t + i * 0.006, { dur: 0.05, vel: 0.35, mute: true, string: n.s }));
      return;
    }
    if (sym === 'B' || sym === 'b') {
      const n = sym === 'B' ? v[0] : (v[1] || v[0]);
      A.play(n.midi, t, { dur: slotDur * 1.9, vel: 0.7, string: n.s });
      return;
    }
    const notes = sym === 'U' ? v.slice(-4).reverse() : (sym === 'D' ? v : v);
    const ring = Math.max(0.25, slotDur * 2.2);
    notes.forEach((n, i) => A.play(n.midi, t + i * (sym === 'U' ? 0.012 : 0.016), { dur: ring, vel: sym === 'U' ? vel * 0.82 : vel, string: n.s }));
  }

  /**
   * Reprodutor de levada sobre uma sequência de acordes (um acorde por compasso).
   * cb.onSlot(bar, slot) a cada divisão.
   */
  function Strummer(cb = {}) {
    let clock = null, pat = null, chords = [], bpm = 80, click = true;
    function start(o) {
      stop();
      pat = patById(o.pattern); chords = o.chords; bpm = o.bpm || pat.bpm; click = o.click !== false;
      const slots = pat.beats * pat.sub;
      const countIn = o.countIn !== false ? slots : 0;
      clock = A.Clock(() => bpm, pat.sub, (i, t) => {
        const spb = 60 / bpm, slotDur = spb / pat.sub;
        const k = i - countIn;
        const slot = ((k % slots) + slots) % slots;
        const tt = pat.swing && slot % 2 === 1 ? t + spb / 6 : t;
        if (click && i % pat.sub === 0) A.click(t, (i / pat.sub) % pat.beats === 0);
        if (k < 0) return;
        const bar = Math.floor(k / slots) % chords.length;
        hit(pat.p[slot], chords[bar], tt, slotDur, (pat.accent || [0]).includes(slot));
        setTimeout(() => cb.onSlot && cb.onSlot(bar, slot), Math.max(0, (tt - A.ctx.currentTime) * 1000));
      });
      clock.start();
    }
    function stop() { if (clock) { clock.stop(); clock = null; } A.stopAll(); cb.onSlot && cb.onSlot(-1, -1); }
    return { start, stop, setBpm(b) { bpm = b; }, setClick(c) { click = c; }, get running() { return !!clock; } };
  }

  const ARROW = { D:'↓', U:'↑', X:'✕', x:'✕', B:'B', b:'b', '-':'' };
  function countLabels(pat) {
    const out = [];
    for (let b = 0; b < pat.beats; b++) for (let s = 0; s < pat.sub; s++) {
      if (s === 0) out.push(String(b + 1));
      else if (pat.sub === 2) out.push('e');
      else if (pat.sub === 3) out.push(s === 1 ? 'e' : 'a');
      else out.push(['', 'i', 'e', 'a'][s]);
    }
    return out;
  }
  /** Grade visual da levada. */
  function grid(pat) {
    const counts = countLabels(pat);
    return `<div class="strum-grid" style="--n:${pat.p.length}">${[...pat.p].map((c, i) =>
      `<div class="sg-cell ${c === '-' ? 'rest' : ''} ${c === 'x' || c === 'X' ? 'mute' : ''} ${c === 'U' || c === 'x' ? 'up' : ''} ${i % pat.sub === 0 ? 'beat' : ''}" data-slot="${i}">
        <b>${ARROW[c]}</b><span>${counts[i]}</span></div>`).join('')}</div>`;
  }

  /* ---- Escrita rítmica (uma linha, figuras e pausas) ----
     Tokens: w h q e s (semibreve…semicolcheia), "." pontuada, R antes = pausa (Rq, Re, Rh). */
  const VAL = { w: 4, h: 2, q: 1, e: 0.5, s: 0.25 };
  function parseRhythm(src) {
    let beat = 0;
    return src.trim().split(/\s+/).map(tok => {
      const rest = tok[0] === 'R';
      const k = rest ? tok[1] : tok[0];
      const dot = tok.endsWith('.');
      const d = VAL[k] * (dot ? 1.5 : 1);
      const ev = { k, rest, dot, d, beat };
      beat += d;
      return ev;
    });
  }
  const REST_GLYPH = { w:'𝄻', h:'𝄼', q:'𝄽', e:'𝄾', s:'𝄿' };

  /** SVG da linha rítmica, com barras de compasso a cada `per` tempos. */
  function notation(src, o = {}) {
    const evs = parseRhythm(src);
    const per = o.per || 4, unit = o.unit || 46, y = 44, H = 76;
    const total = evs.reduce((a, e) => a + e.d, 0);
    const bars = Math.ceil(total / per - 1e-6);
    const W = 24 + total * unit + bars * 10 + 12;
    const p = [`<line class="rn-line" x1="8" x2="${W - 8}" y1="${y}" y2="${y}"/>`];
    const xOf = beat => 24 + beat * unit + Math.floor(beat / per + 1e-6) * 10;
    for (let b = 0; b <= bars; b++) { const xb = b === 0 ? 12 : xOf(b * per) - 8; p.push(`<line class="rn-bar" x1="${xb}" x2="${xb}" y1="${y - 14}" y2="${y + 14}"/>`); }
    // agrupa colcheias/semicolcheias do mesmo tempo para as barras de ligação
    const groups = {};
    evs.forEach((e, i) => { e.x = xOf(e.beat) + 6; if (!e.rest && (e.k === 'e' || e.k === 's')) (groups[Math.floor(e.beat + 1e-6)] ||= []).push(e); });
    evs.forEach((e, i) => {
      if (e.rest) { p.push(`<text class="rn-rest" x="${e.x}" y="${y + 9}" text-anchor="middle">${REST_GLYPH[e.k]}</text>`); }
      else {
        const hollow = e.k === 'w' || e.k === 'h';
        p.push(`<ellipse class="rn-head ${hollow ? 'hollow' : ''}" cx="${e.x}" cy="${y}" rx="6.5" ry="4.6" transform="rotate(-20 ${e.x} ${y})"/>`);
        if (e.k !== 'w') p.push(`<line class="rn-stem" x1="${e.x + 5.6}" x2="${e.x + 5.6}" y1="${y - 2}" y2="${y - 32}"/>`);
      }
      if (e.dot) p.push(`<circle class="rn-dot" cx="${e.x + 12}" cy="${y - 3}" r="2"/>`);
      e.i = i;
    });
    Object.values(groups).forEach(g => {
      if (g.length === 1) {
        const e = g[0];
        p.push(`<path class="rn-flag" d="M${e.x + 5.6} ${y - 32} q 9 8 7 18"/>`);
        if (e.k === 's') p.push(`<path class="rn-flag" d="M${e.x + 5.6} ${y - 25} q 9 8 7 18"/>`);
        return;
      }
      const x1 = g[0].x + 5.6, x2 = g[g.length - 1].x + 5.6;
      p.push(`<rect class="rn-beam" x="${x1}" y="${y - 34}" width="${x2 - x1}" height="4"/>`);
      g.forEach((e, j) => {
        if (e.k !== 's') return;
        const nx = g[j + 1] && g[j + 1].k === 's' ? g[j + 1].x + 5.6 : (g[j - 1] && g[j - 1].k === 's' ? null : e.x + 5.6 + 9 * (j === g.length - 1 ? -1 : 1));
        if (nx != null) p.push(`<rect class="rn-beam" x="${Math.min(e.x + 5.6, nx)}" y="${y - 27}" width="${Math.abs(nx - e.x - 5.6)}" height="4"/>`);
      });
    });
    evs.forEach(e => p.push(`<rect class="rn-hit" data-ev="${e.i}" x="${e.x - 10}" y="${y - 38}" width="20" height="52"/>`));
    return { svg: `<svg class="rn" viewBox="0 0 ${W} ${H}" style="max-width:${Math.round(W * 1.7)}px;min-width:${Math.round(W * 1.15)}px">${p.join('')}</svg>`, evs, total };
  }

  /** Toca um ritmo: clique no tempo e uma nota abafada em cada figura. */
  function playRhythm(src, bpm, o = {}) {
    A.init();
    const evs = parseRhythm(src), spb = 60 / bpm;
    const total = evs.reduce((a, e) => a + e.d, 0);
    let t0 = A.now() + 0.1;
    const per = o.per || 4;
    if (o.countIn !== false) { for (let b = 0; b < per; b++) A.click(t0 + b * spb, b === 0); t0 += per * spb; }
    if (o.click !== false) for (let b = 0; b < Math.ceil(total); b++) A.click(t0 + b * spb, b % per === 0);
    evs.forEach(e => { if (!e.rest) A.play(57, t0 + e.beat * spb, { dur: Math.min(e.d * spb, 0.5), vel: 0.75, string: 3 }); });
    return { t0, evs, spb, end: t0 + total * spb };
  }

  /* Exercícios de leitura rítmica (um ou dois compassos 4/4) por nível. */
  const READING = [
    { lv:1, src:'q q q q' }, { lv:1, src:'h h' }, { lv:1, src:'w' }, { lv:1, src:'h q q' }, { lv:1, src:'q q h' },
    { lv:1, src:'q Rq q Rq' }, { lv:1, src:'h. q' }, { lv:2, src:'e e e e q q' }, { lv:2, src:'q e e q e e' },
    { lv:2, src:'e e q e e q' }, { lv:2, src:'q. e q q' }, { lv:2, src:'Re e Re e Re e Re e' }, { lv:2, src:'q Re e h' },
    { lv:3, src:'s s s s q e e q' }, { lv:3, src:'e s s e s s q q' }, { lv:3, src:'q. e e e q' }, { lv:3, src:'s s e s s e q q' },
    { lv:3, src:'e e Rq e e Rq' }, { lv:3, src:'Re e e e q. e' },
  ];

  return { PATTERNS, patById, Strummer, grid, hit, parseRhythm, notation, playRhythm, READING };
})();

/* ===== Microfone: detecção de altura (YIN simplificado) ===== */
const MIC = (() => {
  let stream = null, src = null, an = null, raf = null, buf = null;

  /** Frequência fundamental em Hz, ou -1 se não houver nota clara. */
  function yin(x, sr, fMin = 60, fMax = 1400) {
    const tauMin = Math.floor(sr / fMax), tauMax = Math.min(Math.floor(sr / fMin), (x.length >> 1) - 1);
    const W = x.length - tauMax;
    const d = new Float32Array(tauMax + 1);
    for (let tau = tauMin; tau <= tauMax; tau++) {
      let s = 0;
      for (let i = 0; i < W; i++) { const v = x[i] - x[i + tau]; s += v * v; }
      d[tau] = s;
    }
    // diferença média cumulativa normalizada
    let run = 0; const cm = new Float32Array(tauMax + 1); cm[0] = 1;
    for (let tau = 1; tau <= tauMax; tau++) { run += d[tau]; cm[tau] = tau < tauMin ? 1 : d[tau] * tau / (run || 1); }
    let tau = -1;
    for (let t = tauMin; t <= tauMax; t++) {
      if (cm[t] < 0.12) { while (t + 1 <= tauMax && cm[t + 1] < cm[t]) t++; tau = t; break; }
    }
    if (tau < 0) return -1;
    const a = cm[tau - 1] ?? cm[tau], b = cm[tau], c = cm[tau + 1] ?? cm[tau];
    const shift = (a - 2 * b + c) ? (a - c) / (2 * (a - 2 * b + c)) : 0;
    return sr / (tau + shift);
  }

  const available = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

  /** Inicia a escuta. onPitch({ hz, midi, cents, rms }) ~30 vezes por segundo. */
  async function start(onPitch) {
    stop();
    const ctx = A.init();
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    src = ctx.createMediaStreamSource(stream);
    an = ctx.createAnalyser(); an.fftSize = 4096;
    src.connect(an);
    buf = new Float32Array(an.fftSize);
    const half = new Float32Array(an.fftSize / 2);
    let last = 0;
    const loop = (ts) => {
      raf = requestAnimationFrame(loop);
      if (ts - last < 33) return; last = ts;
      an.getFloatTimeDomainData(buf);
      let rms = 0; for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
      rms = Math.sqrt(rms / buf.length);
      if (rms < 0.008) { onPitch({ hz: -1, rms }); return; }
      // reduz para metade da taxa (média de pares) para caber no processamento de celulares
      for (let i = 0; i < half.length; i++) half[i] = (buf[2 * i] + buf[2 * i + 1]) * 0.5;
      const hz = yin(half, ctx.sampleRate / 2);
      if (hz <= 0) { onPitch({ hz: -1, rms }); return; }
      const m = 69 + 12 * Math.log2(hz / 440);
      const midi = Math.round(m);
      onPitch({ hz, midi, cents: Math.round((m - midi) * 100), rms });
    };
    raf = requestAnimationFrame(loop);
  }

  function stop() {
    cancelAnimationFrame(raf); raf = null;
    if (src) { try { src.disconnect(); } catch (e) {} src = null; }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  }

  /** Mensagem amigável para falhas do microfone. */
  function errorText(e) {
    if (!S.standalone) return 'O link do Claude não libera o microfone. Use o app em josuenino33.github.io/mapa-do-braco para esta função.';
    if (e && e.name === 'NotAllowedError') return 'O microfone foi bloqueado. Libere o acesso nas permissões do navegador e tente de novo.';
    if (e && e.name === 'NotFoundError') return 'Nenhum microfone encontrado neste aparelho.';
    return 'Não consegui abrir o microfone neste navegador.';
  }

  return { yin, start, stop, available, errorText, get on() { return !!stream; } };
})();

/* ===== Gravador (MediaRecorder + IndexedDB) e looper (PCM sincronizado) ===== */
const MIC_OPTS = { audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } };

const REC = (() => {
  let mr = null, stream = null, chunks = [], t0 = 0;
  function db() {
    return new Promise((res, rej) => {
      const rq = indexedDB.open('mapa-gravacoes', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('takes', { keyPath: 'id' });
      rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
    });
  }
  async function tx(mode, fn) {
    const d = await db();
    return new Promise((res, rej) => { const t = d.transaction('takes', mode); const r = fn(t.objectStore('takes')); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); });
  }
  const list = async () => { try { const all = await tx('readonly', s => s.getAll()); return (all || []).sort((a, b) => b.date - a.date); } catch (e) { return []; } };
  const save = take => tx('readwrite', s => s.put(take));
  const del = id => tx('readwrite', s => s.delete(id));

  async function start() {
    stream = await navigator.mediaDevices.getUserMedia(MIC_OPTS);
    const type = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
    mr = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    chunks = []; mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    mr.start(250); t0 = performance.now();
    return stream;
  }
  function stop() {
    return new Promise(res => {
      if (!mr) return res(null);
      mr.onstop = () => {
        const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
        stream.getTracks().forEach(t => t.stop());
        const dur = (performance.now() - t0) / 1000;
        mr = null; stream = null;
        res({ blob, dur });
      };
      mr.stop();
    });
  }
  const supported = () => !!(window.MediaRecorder && navigator.mediaDevices);
  return { start, stop, list, save, del, supported, get on() { return !!mr; } };
})();

const LOOP = (() => {
  let stream = null, src = null, proc = null, sink = null, rec = null;
  let layers = [], anchor = 0, len = 0, bpm = 90, beats = 16, clickOn = true, clickTimer = null, lat = 0;
  const ctx = () => A.ctx;

  async function mic() {
    if (stream) return;
    A.init();
    stream = await navigator.mediaDevices.getUserMedia(MIC_OPTS);
    src = ctx().createMediaStreamSource(stream);
    proc = ctx().createScriptProcessor(4096, 1, 1);
    sink = ctx().createGain(); sink.gain.value = 0;
    src.connect(proc); proc.connect(sink); sink.connect(ctx().destination);
    lat = (ctx().outputLatency || 0) + (ctx().baseLatency || 0) + 0.01;
    proc.onaudioprocess = e => {
      if (!rec) return;
      const data = e.inputBuffer.getChannelData(0), sr = ctx().sampleRate;
      // o áudio que chega aqui foi tocado “lat” segundos antes
      const tStart = e.playbackTime - data.length / sr - lat;
      for (let i = 0; i < data.length; i++) {
        const k = Math.round((tStart + i / sr - rec.t0) * sr);
        if (k >= 0 && k < rec.buf.length) rec.buf[k] = data[i];
      }
      rec.peak = Math.max(rec.peak * 0.9, ...[0, 512, 1024, 2048, 3072].map(i => Math.abs(data[i] || 0)));
    };
  }

  function clicks(from, to) {
    const spb = 60 / bpm;
    let n = Math.ceil((from - anchor) / spb - 1e-6);
    for (;; n++) { const t = anchor + n * spb; if (t >= to) break; if (t >= from && n >= 0) A.click(t, n % 4 === 0); }
  }
  function startClicks() {
    stopClicks();
    let until = ctx().currentTime;
    clickTimer = setInterval(() => { if (!clickOn) { until = ctx().currentTime + 0.3; return; } const to = ctx().currentTime + 0.3; clicks(until, to); until = to; }, 100);
  }
  function stopClicks() { clearInterval(clickTimer); clickTimer = null; }

  function playLayer(L, when) {
    const s = ctx().createBufferSource(); s.buffer = L.buffer; s.loop = true;
    const g = ctx().createGain(); g.gain.value = L.vol ?? 1;
    s.connect(g); g.connect(A.ctx.destination);
    const offset = ((when - anchor) % len + len) % len;
    s.start(when, offset);
    L.src = s; L.g = g;
  }

  /** Grava uma volta. Na primeira, conta 4 tempos antes; depois, começa na próxima volta. */
  async function record(o, onDone) {
    await mic();
    const sr = ctx().sampleRate, now = ctx().currentTime;
    let t0;
    if (!layers.length) {
      bpm = o.bpm; beats = o.bars * 4; len = beats * 60 / bpm;
      anchor = now + 0.15 + 4 * 60 / bpm;   // contagem de 4 tempos
      t0 = anchor;
      for (let b = 0; b < 4; b++) A.click(now + 0.15 + b * 60 / bpm, b === 0);
    } else {
      const n = Math.ceil((now + 0.05 - anchor) / len);
      t0 = anchor + n * len;
    }
    rec = { t0, buf: new Float32Array(Math.round(len * sr)), peak: 0 };
    if (!clickTimer) startClicks();
    const waitMs = (t0 + len - ctx().currentTime) * 1000 + 300;
    setTimeout(() => {
      const r = rec; rec = null;
      const buffer = ctx().createBuffer(1, r.buf.length, sr);
      buffer.copyToChannel(r.buf, 0);
      const L = { buffer, vol: 1, name: 'Camada ' + (layers.length + 1) };
      layers.push(L);
      playLayer(L, ctx().currentTime + 0.02);
      onDone && onDone(L);
    }, waitMs);
    return { t0, len };
  }

  function undo() { const L = layers.pop(); if (L && L.src) { try { L.src.stop(); } catch (e) {} } if (!layers.length) stopClicks(); }
  function clear() { layers.forEach(L => { try { L.src.stop(); } catch (e) {} }); layers = []; rec = null; stopClicks(); }
  function close() {
    clear();
    if (proc) { proc.onaudioprocess = null; try { src.disconnect(); proc.disconnect(); sink.disconnect(); } catch (e) {} }
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = src = proc = sink = null;
  }
  function setVol(i, v) { const L = layers[i]; if (L) { L.vol = v; if (L.g) L.g.gain.value = v; } }

  /** Mixa as camadas em WAV (para baixar). */
  function wav() {
    if (!layers.length) return null;
    const n = layers[0].buffer.length, sr = layers[0].buffer.sampleRate, mix = new Float32Array(n);
    layers.forEach(L => { const d = L.buffer.getChannelData(0); for (let i = 0; i < n; i++) mix[i] += d[i] * (L.vol ?? 1); });
    let pk = 0; for (let i = 0; i < n; i++) pk = Math.max(pk, Math.abs(mix[i]));
    const k = pk > 0.98 ? 0.98 / pk : 1;
    const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, mix[i] * k)) * 0x7fff, true);
    return new Blob([buf], { type: 'audio/wav' });
  }

  return { record, undo, clear, close, setVol, wav,
    get layers() { return layers; }, get recording() { return rec; }, get len() { return len; }, get anchor() { return anchor; },
    set click(v) { clickOn = v; }, get click() { return clickOn; } };
})();

/* ===== Partitura: pauta com clave de sol (guitarra soa uma oitava abaixo do escrito) ===== */
const STAFF = (() => {
  const SP = 10;                         // distância entre linhas
  const LETTER = { C:0, D:1, E:2, F:3, G:4, A:5, B:6 };
  const STEP_E4 = 4 * 7 + 2;             // linha de baixo da pauta = Mi4

  /** Grafia de uma altura escrita: letra, acidente e degrau diatônico. */
  function spell(midiWritten, flats) {
    const nm = (flats ? T.FLAT : T.SHARP)[T.mod(midiWritten)];
    const oct = Math.floor(midiWritten / 12) - 1;
    return { letter: nm[0], acc: nm[1] === '#' ? '♯' : nm[1] === 'b' ? '♭' : '', step: oct * 7 + LETTER[nm[0]] };
  }

  /**
   * notes: [{ midi (som real), d (tempos, opcional), rest? }]
   * o: { flats, width, per (tempos por compasso), unit }
   */
  function render(notes, o = {}) {
    const top = 46, bottom = top + 4 * SP, left = 48;
    const unit = o.unit || 44;
    const timed = notes.some(n => n.d);
    let x = left + 18, beat = 0;
    const per = o.per || 4;
    const items = notes.map(n => {
      const it = Object.assign({}, n, { x });
      const w = timed ? Math.max(26, (n.d || 1) * unit) : 56;
      beat += n.d || 1;
      x += w;
      if (timed && Math.abs(beat / per - Math.round(beat / per)) < 1e-6) { it.barAfter = x - w / 2 + 4 + (w / 2); x += 10; }
      return it;
    });
    const W = Math.max(o.width || 0, x + 16), H = bottom + 46;
    const p = [];
    for (let i = 0; i < 5; i++) p.push(`<line class="st-line" x1="6" x2="${W - 6}" y1="${top + i * SP}" y2="${top + i * SP}"/>`);
    p.push(`<text class="st-clef" x="10" y="${bottom - SP * 0.98}">𝄞</text>`);
    p.push(`<text class="st-8" x="21" y="${bottom + 32}">8</text>`);
    items.forEach((n, i) => {
      if (n.barAfter && i < items.length - 1) p.push(`<line class="st-bar" x1="${n.barAfter}" x2="${n.barAfter}" y1="${top}" y2="${bottom}"/>`);
      if (n.rest) { p.push(`<text class="rn-rest st-rest" x="${n.x}" y="${top + SP * 2.9}" text-anchor="middle">${({ 4:'𝄻', 2:'𝄼', 1:'𝄽', 0.5:'𝄾', 0.25:'𝄿' })[n.d || 1] || '𝄽'}</text>`); return; }
      const sp = spell(n.midi + 12, o.flats);
      const y = bottom - (sp.step - STEP_E4) * SP / 2;
      for (let st = STEP_E4 - 2; st >= sp.step; st -= 2) { const ly = bottom - (st - STEP_E4) * SP / 2; p.push(`<line class="st-ledger" x1="${n.x - 11}" x2="${n.x + 11}" y1="${ly}" y2="${ly}"/>`); }
      for (let st = STEP_E4 + 10; st <= sp.step; st += 2) { const ly = bottom - (st - STEP_E4) * SP / 2; p.push(`<line class="st-ledger" x1="${n.x - 11}" x2="${n.x + 11}" y1="${ly}" y2="${ly}"/>`); }
      if (sp.acc) p.push(`<text class="st-acc" x="${n.x - 15}" y="${y + 5}" text-anchor="middle">${sp.acc}</text>`);
      const d = n.d || 1, hollow = d >= 2;
      p.push(`<ellipse class="rn-head ${hollow ? 'hollow' : ''}" data-n="${i}" cx="${n.x}" cy="${y}" rx="6.4" ry="4.6" transform="rotate(-20 ${n.x} ${y})"/>`);
      if (timed && d < 4) {
        const up = sp.step < STEP_E4 + 4;
        const sx = up ? n.x + 5.6 : n.x - 5.6, sy2 = up ? y - 32 : y + 32;
        p.push(`<line class="rn-stem" x1="${sx}" x2="${sx}" y1="${y}" y2="${sy2}"/>`);
        const flags = d === 0.5 || d === 0.75 ? 1 : d === 0.25 ? 2 : 0;
        for (let k = 0; k < flags; k++) { const fy = sy2 + (up ? 1 : -1) * k * 7; p.push(`<path class="rn-flag" d="M${sx} ${fy} q 9 ${up ? 8 : -8} 7 ${up ? 18 : -18}"/>`); }
        if ([1.5, 3, 0.75].includes(d)) p.push(`<circle class="rn-dot" cx="${n.x + 11}" cy="${y - 2}" r="2"/>`);
      }
      if (n.label) p.push(`<text class="st-label" x="${n.x}" y="${H - 6}" text-anchor="middle">${n.label}</text>`);
    });
    if (timed) p.push(`<line class="st-bar end" x1="${W - 8}" x2="${W - 8}" y1="${top}" y2="${bottom}"/>`);
    return `<svg class="staff" viewBox="0 0 ${W} ${H}" style="max-width:${Math.round(W * 1.5)}px;min-width:${Math.round(Math.min(W, 900) * 0.9)}px" role="img" aria-label="Partitura">${p.join('')}</svg>`;
  }

  /** Notas de uma tablatura (só notas simples) para a pauta. */
  function fromTab(parsed) {
    return parsed.events.map(e => {
      const n = e.notes.find(o => !o.dead);
      return n ? { midi: T.TUNING[n.s] + n.f, d: e.d } : { rest: true, d: e.d };
    });
  }

  return { render, spell, fromTab };
})();

/* ===== Braço da guitarra em SVG ===== */
const FB = (() => {
  const NUT = 60, PAD_R = 14, TOP = 22, GAP = 28, K = 20;
  const WIDTHS = [2.7, 2.2, 1.8, 1.45, 1.1, 0.9];
  const INLAY = [3, 5, 7, 9, 15, 17, 19, 21];

  function geometry(N) {
    const W = NUT + N * 56 + PAD_R;
    const span = W - NUT - PAD_R;
    const norm = 1 - Math.pow(2, -N / K);
    const xs = [];
    for (let n = 0; n <= N; n++) xs.push(NUT + span * (1 - Math.pow(2, -n / K)) / norm);
    const y = s => TOP + (5 - s) * GAP;
    const H = TOP * 2 + 5 * GAP + 16;
    const nx = f => f === 0 ? NUT - 22 : (xs[f - 1] + xs[f]) / 2;
    return { W, H, xs, y, nx };
  }

  function create(host, opts = {}) {
    const inst = { state: { marks: [], frets: 15, lefty: false, labels: 'note', flats: false, latin: false } };
    host.classList.add('fb-wrap');
    host.addEventListener('click', e => {
      const hit = e.target.closest('[data-s]');
      if (!hit || !inst.state.onPick) return;
      inst.state.onPick(+hit.dataset.s, +hit.dataset.f, e);
    });

    inst.set = (patch) => { Object.assign(inst.state, patch); render(); return inst; };

    inst.setActive = (keys) => {
      const on = new Set(keys);
      host.querySelectorAll('.fb-note').forEach(n => n.classList.toggle('is-on', on.has(n.dataset.k)));
    };

    function label(m, st) {
      if (m.label != null) return m.label;
      if (st.labels === 'iv') return T.ivLabel(m.iv);
      if (st.labels === 'none') return '';
      return T.noteName(m.pc, st.flats, st.latin);
    }

    function render() {
      const st = inst.state, N = st.frets;
      const g = geometry(N);
      const X = x => st.lefty ? g.W - x : x;
      const p = [];
      const yTop = g.y(5) - 13, yBot = g.y(0) + 13;
      p.push(`<rect class="fb-wood" x="${Math.min(X(g.xs[0]), X(g.xs[N]))}" y="${yTop}" width="${g.xs[N] - g.xs[0]}" height="${yBot - yTop}" rx="2"/>`);
      const midY = (g.y(2) + g.y(3)) / 2;
      for (let n = 1; n <= N; n++) {
        const cx = X((g.xs[n - 1] + g.xs[n]) / 2);
        if (INLAY.includes(n)) p.push(`<circle class="fb-inlay" cx="${cx}" cy="${midY}" r="6"/>`);
        if (n === 12 || n === 24) {
          p.push(`<circle class="fb-inlay" cx="${cx}" cy="${(g.y(4) + g.y(3)) / 2}" r="6"/>`);
          p.push(`<circle class="fb-inlay" cx="${cx}" cy="${(g.y(2) + g.y(1)) / 2}" r="6"/>`);
        }
      }
      for (let n = 1; n <= N; n++) p.push(`<rect class="fb-fret" x="${X(g.xs[n]) - 1.6}" y="${yTop}" width="3.2" height="${yBot - yTop}"/>`);
      p.push(`<rect class="fb-nut" x="${X(g.xs[0]) - 3.5}" y="${yTop - 1}" width="7" height="${yBot - yTop + 2}" rx="1.5"/>`);
      for (let s = 0; s < 6; s++) {
        const y = g.y(s);
        p.push(`<line class="fb-string ${s < 3 ? 'wound' : ''}" x1="${X(NUT - 40)}" x2="${X(g.xs[N])}" y1="${y}" y2="${y}" stroke-width="${WIDTHS[s]}"/>`);
        p.push(`<text class="fb-sname" x="${X(12)}" y="${y + 4}">${6 - s}</text>`);
      }
      for (let n = 0; n <= N; n++) {
        const strong = INLAY.includes(n) || n === 12 || n === 24;
        p.push(`<text class="fb-num ${strong ? 'strong' : ''}" x="${X(g.nx(n))}" y="${g.H - 3}">${n}</text>`);
      }
      // áreas de clique
      if (st.onPick) {
        for (let s = 0; s < 6; s++) for (let f = 0; f <= N; f++) {
          const x0 = f === 0 ? NUT - 40 : g.xs[f - 1], x1 = f === 0 ? g.xs[0] - 4 : g.xs[f];
          const xa = Math.min(X(x0), X(x1));
          p.push(`<rect class="fb-hit" data-s="${s}" data-f="${f}" x="${xa}" y="${g.y(s) - GAP / 2}" width="${Math.abs(x1 - x0)}" height="${GAP}"/>`);
        }
      }
      // notas
      const sorted = st.marks.slice().sort((a, b) => (a.dim ? 0 : 1) - (b.dim ? 0 : 1));
      for (const m of sorted) {
        if (m.f > N) continue;
        const cx = X(g.nx(m.f)), cy = g.y(m.s);
        const txt = label(m, st);
        const fs = txt.length > 3 ? 8.5 : txt.length > 2 ? 9.5 : 11;
        const cls = ['fb-note', 'iv-' + (m.role || 'n'), m.dim ? 'dim' : '', m.cls || ''].join(' ');
        const r = m.small ? 8 : 12;
        p.push(`<g class="${cls}" data-k="${m.s}:${m.f}" ${st.onPick ? `data-s="${m.s}" data-f="${m.f}"` : ''}>` +
          `<circle cx="${cx}" cy="${cy}" r="${r}"/>` +
          (txt ? `<text x="${cx}" y="${cy + fs * 0.36}" font-size="${fs}">${txt}</text>` : '') + `</g>`);
      }
      host.innerHTML = `<svg class="fb" viewBox="0 0 ${g.W} ${g.H}" style="min-width:${Math.round(g.W * 0.74)}px;max-width:${Math.round(g.W * 1.35)}px;margin-inline:auto" role="img" aria-label="Braço da guitarra">${p.join('')}</svg>`;
    }

    if (opts.state) inst.set(opts.state); else render();
    return inst;
  }

  return { create, geometry };
})();

/* ===== Tablatura: leitura, desenho e reprodução =====
   Sintaxe: "|e 3:5 3:7h 2:8b2r -"  (|q |e |s |t |h |w e "." para pontuada)
   Nota = corda:casa + técnica (h hammer, p pull-off, / slide, bN bend, r release,
   BN pré-bend, ~ vibrato, m palm mute). Corda:x = nota abafada. "+" junta notas. */
const TAB = (() => {
  const DUR = { w: 4, h: 2, q: 1, e: 0.5, s: 0.25, t: 1 / 3, x: 1 / 6 };

  function parse(src) {
    const ev = [];
    let d = 0.5, beat = 0, ticks = 0;   // 48 ticks por tempo: soma exata de tercinas e semicolcheias
    for (const tok of src.trim().split(/\s+/)) {
      if (!tok) continue;
      if (tok[0] === '|') { d = DUR[tok[1]] * (tok[2] === '.' ? 1.5 : 1); continue; }
      if (tok === '-') { ev.push({ rest: true, d, beat, notes: [] }); ticks += Math.round(d * 48); beat = ticks / 48; continue; }
      const notes = tok.split('+').map(nt => {
        const m = nt.match(/^([1-6]):(\d+|x)(.*)$/);
        if (!m) throw new Error('Token inválido: ' + nt);
        const n = +m[1], tech = m[3];
        const o = { n, s: 6 - n, f: m[2] === 'x' ? null : +m[2], dead: m[2] === 'x' };
        if (tech.includes('h')) o.h = true;
        if (tech.includes('p')) o.p = true;
        if (tech.includes('/')) o.sl = true;
        if (tech.includes('~')) o.vib = true;
        if (tech.includes('m')) o.pm = true;
        if (tech.includes('t')) o.tap = true;
        if (tech.includes('n')) o.harm = true;
        const b = tech.match(/b(\d)/); if (b) o.bend = +b[1];
        const B = tech.match(/B(\d)/); if (B) { o.bend = +B[1]; o.pre = true; }
        if (tech.includes('r')) o.rel = true;
        return o;
      });
      ev.push({ notes, d, beat });
      ticks += Math.round(d * 48); beat = ticks / 48;
    }
    // casa anterior em cada corda (para rótulo e áudio de slide/legato)
    const last = {};
    ev.forEach(e => e.notes.forEach(o => {
      if (o.dead) return;
      o.prev = last[o.s];
      last[o.s] = o.f;
    }));
    return { events: ev, beats: beat };
  }

  function noteLabel(o) {
    if (o.dead) return 'x';
    if (o.harm) return `<${o.f}>`;
    let t = String(o.f);
    if (o.tap) t = 't' + t;
    if (o.h) t = 'h' + t;
    else if (o.p) t = 'p' + t;
    else if (o.sl) t = (o.prev != null && o.prev > o.f ? '\\' : '/') + t;
    if (o.bend) t = o.pre ? `${o.f}pb${o.f + o.bend}` : `${t}b${o.f + o.bend}`;
    if (o.rel) t += 'r' + o.f;
    if (o.vib) t += '~';
    return t;
  }

  function countLabel(beat) {
    const r = Math.round(beat * 6) / 6;
    if (Math.abs(r - Math.round(r)) < 1e-6) return String((Math.round(r) % 4) + 1);
    if (Math.abs(r - Math.floor(r) - 0.5) < 1e-6) return '&';
    return '';
  }

  /** Desenha a tablatura dentro de `host`; retorna função para destacar evento. */
  function render(host, parsed, beatsPerBar = 4) {
    const cols = [];
    const bar = () => cols.push(`<div class="tab-bar" aria-hidden="true"></div>`);
    bar();
    parsed.events.forEach((e, i) => {
      if (i > 0 && Math.abs(e.beat / beatsPerBar - Math.round(e.beat / beatsPerBar)) < 1e-6) bar();
      const rows = ['', '', '', '', '', ''];
      e.notes.forEach(o => { rows[o.n - 1] = noteLabel(o); });
      const maxLen = Math.max(1, ...rows.map(r => r.length));
      const w = Math.max(maxLen + 1.4, Math.round(e.d * 6) + 1);
      const pm = e.notes.some(o => o.pm) ? '<i>PM</i>' : '';
      cols.push(`<div class="tab-col" data-i="${i}" style="--w:${w}"><span class="tab-top">${countLabel(e.beat)}${pm}</span>` +
        rows.map(r => `<span class="tab-cell">${r ? `<b>${r.replace(/[<>\\]/g, c => ({ '<': '&lt;', '>': '&gt;', '\\': '&#92;' })[c])}</b>` : ''}</span>`).join('') + `</div>`);
    });
    bar();
    host.innerHTML = `<div class="tab" role="img" aria-label="Tablatura"><div class="tab-names"><span class="tab-top"></span>${['e','B','G','D','A','E'].map(n => `<span class="tab-cell">${n}</span>`).join('')}</div>${cols.join('')}</div>`;
    return (idx) => {
      host.querySelectorAll('.tab-col.on').forEach(c => c.classList.remove('on'));
      if (idx == null || idx < 0) return;
      const c = host.querySelector(`.tab-col[data-i="${idx}"]`);
      if (c) {
        c.classList.add('on');
        const box = host;
        const left = c.offsetLeft - box.clientWidth / 3;
        if (c.offsetLeft < box.scrollLeft || c.offsetLeft > box.scrollLeft + box.clientWidth - 40) box.scrollTo({ left, behavior: 'smooth' });
      }
    };
  }

  /** Marcas para o braço a partir dos eventos (todas as notas do lick). */
  function marks(parsed, rootPc) {
    const seen = new Map();
    parsed.events.forEach(e => e.notes.forEach(o => {
      if (o.dead) return;
      const k = o.s + ':' + o.f;
      if (!seen.has(k)) seen.set(k, T.mark(o.s, o.f, rootPc));
      if (o.bend && !o.pre) {
        // o alvo do bend aparece como fantasma uma ou duas casas acima
        const kb = o.s + ':' + (o.f + o.bend);
        if (!seen.has(kb)) seen.set(kb, T.mark(o.s, o.f + o.bend, rootPc, { dim: true, small: true }));
      }
    }));
    return [...seen.values()];
  }

  /** Agenda as notas de uma tablatura a partir de t0. onEv(i, t) para cada evento. */
  function scheduleNotes(parsed, t0, bpm, onEv) {
    const spb = 60 / bpm;
    parsed.events.forEach((e, i) => {
      const t = t0 + e.beat * spb;
      onEv && onEv(i, t);
      const isLast = i === parsed.events.length - 1;
      e.notes.forEach(o => {
        if (o.dead) { A.play(T.TUNING[o.s] + 5, t, { dur: 0.05, vel: 0.5, mute: true, string: o.s }); return; }
        const legato = o.h || o.p || o.sl || o.tap;
        const HARM = { 12: 12, 24: 24, 7: 19, 19: 19, 5: 24, 4: 28, 9: 28, 16: 28, 3: 31 };
        const dur = isLast ? Math.max(e.d * spb, 1.6) : Math.max(e.d * spb * 1.05, 0.12) + (o.bend || o.vib ? 0.15 : 0.35);
        if (o.harm) { A.play(T.TUNING[o.s] + (HARM[o.f] ?? o.f), t, { dur: Math.max(e.d * spb, 1.2) + 0.8, vel: 0.42, string: o.s }); return; }
        A.play(T.TUNING[o.s] + o.f, t, {
          dur, string: o.s, vel: legato ? 0.55 : (e.notes.length > 1 ? 0.6 : 0.85),
          slideFrom: o.sl && o.prev != null ? T.TUNING[o.s] + o.prev : null,
          bend: o.bend, release: o.rel, prebend: o.pre, vib: o.vib, mute: o.pm,
        });
      });
    });
  }

  /** Reprodutor. cb.onEvent(i), cb.onEnd() */
  function Player(cb = {}) {
    let raf = null, sched = [], tEnd = 0, opt = {}, parsed = null, playing = false, lastIdx = -1;

    function schedule(t0) {
      scheduleNotes(parsed, t0, opt.bpm, (i, t) => sched.push({ i, t }));
      if (opt.click) {
        const spb = 60 / opt.bpm, beats = Math.ceil(parsed.beats);
        for (let b = 0; b < beats; b++) A.click(t0 + b * spb, b % 4 === 0);
      }
      return t0 + parsed.beats * 60 / opt.bpm;
    }

    function loop() {
      const now = A.ctx.currentTime;
      let idx = -1;
      for (const s of sched) { if (s.t <= now + 0.01) idx = s.i; else break; }
      if (idx !== lastIdx && now >= (sched[0]?.t ?? Infinity) - 0.01) { lastIdx = idx; cb.onEvent?.(idx); }
      if (now >= tEnd - 0.2 && opt.loop && playing) {
        sched = sched.filter(s => s.t > now - 0.05);
        const nextT0 = tEnd;
        tEnd = schedule(nextT0);
        sched.sort((a, b) => a.t - b.t);
      } else if (now >= tEnd && playing) { stop(); cb.onEnd?.(); return; }
      raf = requestAnimationFrame(loop);
    }

    function play(p, o) {
      stop(true);
      A.init();
      parsed = p; opt = Object.assign({ bpm: 90, loop: false, click: false, countIn: true }, o);
      const spb = 60 / opt.bpm;
      let t0 = A.now() + 0.12;
      if (opt.countIn) { for (let b = 0; b < 4; b++) A.click(t0 + b * spb, b === 0); t0 += 4 * spb; }
      sched = []; lastIdx = -2; playing = true;
      tEnd = schedule(t0);
      raf = requestAnimationFrame(loop);
    }

    function stop(silent) {
      playing = false;
      cancelAnimationFrame(raf); raf = null;
      sched = [];
      A.stopAll();
      if (!silent) cb.onEvent?.(-1);
    }

    return { play, stop, get playing() { return playing; } };
  }

  return { parse, render, marks, Player, noteLabel, scheduleNotes };
})();

    { id:'triade', title:'O que é uma tríade', min:8,

    { id:'caged', title:'As cinco formas', min:15,
      body:`<p>Você já conhece cinco acordes abertos do violão: <b>C, A, G, E e D</b>. O sistema CAGED usa esses cinco desenhos como formas móveis. Qualquer acorde maior pode ser tocado com cada uma delas, e elas se encaixam uma na outra ao longo do braço, sempre na ordem C→A→G→E→D (e recomeça).</p>
