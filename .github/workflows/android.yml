# Gera o app Android (APK) a partir de docs/ e publica no release "android" do repositório.
# Baixe no celular em: Releases > App Android > MapaDoBraco.apk
name: App Android

on:
  push:
    branches: [main]
    paths: ['docs/**', 'tools/android.sh', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Monta e compila o APK
        run: bash tools/android.sh
      - name: Publica o APK no release "android"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --cleanup-tag -y || true
          gh release create android build/MapaDoBraco.apk \
            --title "App Android" \
            --notes "Versão para Android gerada automaticamente a partir do site ($(date -u +%Y-%m-%d)). No celular: baixe MapaDoBraco.apk, abra o arquivo e permita instalar apps desta fonte." \
            --latest=false
