# Gera o app Android a partir de docs/ e publica no release "android" do repositório.
#   No celular: Releases > App Android > MapaDoBraco.apk (instalar direto)
#   Para a Play Store: MapaDoBraco.aab (enviar no Play Console)
# Com os segredos KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS e KEY_PASSWORD o app sai assinado
# (pronto para a loja). Sem eles, sai um APK de teste que também instala no celular.
name: App Android

on:
  push:
    branches: [main]
    paths: ['docs/**', 'tools/android.sh', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK (já vem instalado na máquina do GitHub)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Chave de assinatura (se configurada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi
      - name: Monta e compila o app
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash tools/android.sh
      - name: Publica no release "android"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="build/MapaDoBraco.apk"; [ -f build/MapaDoBraco.aab ] && FILES="$FILES build/MapaDoBraco.aab"
          gh release delete android --cleanup-tag -y || true
          gh release create android $FILES \
            --title "App Android (versão 1.0.${{ github.run_number }})" \
            --notes "Gerado automaticamente a partir do site em $(date -u +%Y-%m-%d). No celular: baixe MapaDoBraco.apk, abra o arquivo e permita instalar apps desta fonte. Para a Play Store, envie MapaDoBraco.aab no Play Console." \
            --latest=false
